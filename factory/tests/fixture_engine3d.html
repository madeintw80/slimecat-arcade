<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D 樣本（回歸測試用）</title>
<!--CONTENT-NOTES
blocks: id(string), color(string #rrggbb), size(number 0.4~2)
-->
<style>
  html, body { margin: 0; height: 100%; background: #14162a; overflow: hidden; }
  #wrap { position: relative; width: 400px; height: 600px; margin: 0 auto; }
  #view, #hud { position: absolute; left: 0; top: 0; width: 400px; height: 600px; touch-action: none; }
  #hud { pointer-events: none; }
  a.back { position: absolute; left: 8px; top: 8px; color: #fff; z-index: 2; font: 14px sans-serif; }
</style>
<script type="importmap">{"imports":{"three":"../../vendor/three/0.186.1/three.module.js"}}</script>
</head>
<body>
<a class="back" href="../../index.html">← 回遊戲區</a>
<div id="wrap"><canvas id="view"></canvas><canvas id="hud"></canvas></div>
<script id="sc-content">window.SC_CONTENT = {"blocks": [{"id": "b1", "color": "#ff8c33", "size": 1.2}, {"id": "b2", "color": "#5ad1ff", "size": 0.8}]};</script>
<script type="module">
import * as THREE from 'three';

// 3D 樣本：方塊依內容包生成、會轉；HUD 用疊在上面的 2D canvas 畫分數
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas: view, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(400, 600, false);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14162a);
const camera = new THREE.PerspectiveCamera(50, 400 / 600, 0.1, 100);
camera.position.set(0, 2, 7);
camera.lookAt(0, 0, 0);
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.8);
sun.position.set(3, 5, 4);
scene.add(sun);

const blocks = (window.SC_CONTENT && window.SC_CONTENT.blocks) || [];
const meshes = blocks.map((b, i) => {
  const s = Math.min(2, Math.max(0.4, Number(b.size) || 1));
  const m = new THREE.Mesh(new THREE.BoxGeometry(s, s, s), new THREE.MeshStandardMaterial({ color: b.color || '#ffffff' }));
  m.position.x = (i - (blocks.length - 1) / 2) * 2.2;
  scene.add(m);
  return m;
});

// HUD canvas 實體緩衝 = 400×600 × DPR，邏輯座標維持 400×600（不設的話預設 300×150 會被拉長）
const hudCanvas = document.getElementById('hud');
const dpr = Math.min(window.devicePixelRatio || 1, 3);
hudCanvas.width = 400 * dpr;
hudCanvas.height = 600 * dpr;
const hud = hudCanvas.getContext('2d');
hud.setTransform(dpr, 0, 0, dpr, 0, 0);
const state = { scene: 'title', score: 0, level: 0, elapsed: 0 };
let last = performance.now();

// 點擊或按鍵：加分（樣本只示範輸入接線）
const onHit = () => { if (state.scene === 'run') state.score += 1; };
view.addEventListener('pointerdown', onHit);
window.addEventListener('keydown', onHit);

renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (state.scene === 'run') state.elapsed += dt;
  meshes.forEach((m, i) => { m.rotation.x += dt * (1 + i * 0.3); m.rotation.y += dt * 1.4; });
  renderer.render(scene, camera);
  hud.clearRect(0, 0, 400, 600);
  hud.fillStyle = '#fff';
  hud.font = '20px sans-serif';
  hud.fillText(state.scene === 'run' ? `分數 ${state.score}` : '點一下開始', 140, 60);
});

window.SC_HOOKS = {
  start() { state.scene = 'run'; },
  snapshot() { return { scene: state.scene, score: state.score, level: state.level, elapsed: state.elapsed, blocks: meshes.length, revision: THREE.REVISION }; },
};
</script>
</body>
</html>
