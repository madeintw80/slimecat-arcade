<!--CONTENT-NOTES
《喵湯屋七班》引擎實際讀取 window.SC_CONTENT 的四個內容包（值＝物件陣列）。
缺欄位用預設值、數值超出範圍自動夾住；可自動修正的問題以 console.warn「[喵湯屋自檢]」回報；
參照不存在的客人 id 會依序找替代（id 前綴相近 → id 關鍵字對應同類客人 → 尚未排班的客人），替代成功以 console.warn 回報；
嚴重錯誤（沒有任何客人、沒有任何可用分店、客人參照找不到替代、有客人沒排進任何班表 weights／intro）
以 console.error「[喵湯屋自檢・阻擋開始]」回報、在標題頁以紅字顯示並阻擋開始。筆數不限（1～數十筆都可）。

[guests] 客人（建議 8 筆）
 id 字串唯一（重複會自動加 _）｜name 繁中名｜emoji 一個 emoji（預設 🐱）
 want：cool（<35°）/ warm（35–69°）/ hot（≥70°，含滾燙）/ boil（≥85°）/ any（任何溫度）；其他值→warm
 patience 秒 5–40（建議 8–26；第 1 班客人 ≥20）｜bath 秒 2–15｜pay 整數 1–500
 group 1 或 3（≥2 一律視為 3：一次進 3 位、需 3 個空候位，各自帶位；第一位入池後 8 秒內三位全到位給 pay×1.5 團體獎金）
 leave_fx：none / dirty（離池後池子變髒，要點池子 clean_taps 下）/ splash（離池後池溫 −15°）
 anger 整數 1–3（氣走扣口碑數）｜hint 字串（登場橫幅應對提示，建議 14 字內）
[tubs] 池種（≥1 筆；空包時引擎自建一個預設木桶）
 cool_rate 0–5（°/秒，再乘班表 cool_mult 與升級倍率）｜heat 1–50（每次添柴加溫）｜pay_mult 0.3–3｜clean_taps 整數 1–6｜color hex（#rgb 或 #rrggbb）
[branches] 分店（筆數不限，選店頁每頁 4 張可翻頁）；班數＝shifts 陣列長度（建議 7）
 need_stars 整數 ≥0（所有分店中最小的會被強制為 0）｜theme hex｜name / emoji / desc
 star2 / star3 分數門檻（缺省依目標總和推算；star3 會被抬到 > star2）
 tubs：最多 6 個 {type 池種 id（不存在→改用第一種池）, col 0–1, row 0–2（同格重複會順延到下一空格）, start_temp 0–100, open bool（預設 true）}
   開放池少於 2 個時自動開放前面的池；open=false 的池位依陣列順序被 open_tub 升級開啟
 shifts[]：n（引擎以陣列順序重編）｜dur 15–180 秒｜target 整數 ≥1｜first_spawn 0.5–30｜spawn_every 1.2–30（實際 ±15% 抖動）｜cool_mult 0–5
   weights {guestId: 權重>0}（未知 id 改用替代客人、找不到替代即阻擋開始；全空時改用第一位 patience≥20 的單人客）
   ops：seat / stoke / towel / clean 子集（seat 必定開放；某操作第一次出現的班會播「新操作」橫幅）
   intro：客人 id 或 ""（該班第一位客人強制為此客人並播「新客人！名字：hint」橫幅）
   event：none / cold_wind（6 秒內降溫 ×2.5）/ rush（10 秒內來客間隔 ×0.6 並立即多 2 位）/ hot_spring（全部開放池 +20°）
   event_at 0–1（班長比例，實際夾在第 2 秒～結束前 3 秒；觸發前 2 秒預告）
 inf_spawn_decay 0.8–0.99｜inf_target_grow 1.0–1.5（無限營業第 k 班：最後一班的間隔×decay^k、目標×grow^k、cool_mult+0.1k，權重與 ops 用最後一班，事件輪替）
[upgrades] 升級卡（班間抽 3 張；有未開池位且有 open_tub 卡時必列一張）
 effect：stoke_heat_add（+度）/ cool_mult（倍率，0.85＝降溫變 85%）/ patience_add（+秒）/ pay_mult（倍率 1.1＝收款×1.1；<0.5 視為 1+value）
   / towel_cd_mult（倍率，基礎冷卻 8 秒）/ open_tub（開幾個池位）/ bath_mult（倍率）/ combo_window_add（+秒，基礎 5 秒）
   / auto_stoke_every（秒 2–60；每 N 秒替最冷的溫／熱池自動添柴，每多一級間隔 ×0.8）/ clean_taps_sub（−下，至少留 1 下）
   / heart_max_add（口碑上限 +N 並回同量，上限 8）/ heal_heart（立即回 N 顆）；其他值整張略過
 value 數字（倍率型夾在 0.3–2；open_tub／heal_heart／heart_max_add 至少 1）｜cost 1–99999（第 L 級價格＝cost×1.6^L 四捨五入）
 max_lv 1–5｜from_shift 1–99（打烊時「已完成班序 ≥ from_shift」才會抽到；無限營業全部可抽）
 desc 樣板：{v}＝value（倍率型顯示成百分比，如 85%）；{total}＝買下這一級後的累計結果（添柴＝該店第一個開放池每次加溫度數；倍率型為百分比；其餘為累計數字）
-->

<script>
(()=>{
'use strict';
const W=400,H=600,STEP=1/60;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),wrap=document.getElementById('wrap');
let S=1,DPR=1;
// 等比縮放畫布並依 DPR 建立高解析緩衝
function resize(){S=Math.max(0.2,Math.min(wrap.clientWidth/W,wrap.clientHeight/H));DPR=Math.min(3,window.devicePixelRatio||1);cv.style.width=W*S+'px';cv.style.height=H*S+'px';cv.width=Math.round(W*S*DPR);cv.height=Math.round(H*S*DPR);}
addEventListener('resize',resize);resize();

// ===== 工具 =====
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const num=(v,d,a,b)=>{v=Number(v);return clamp(isFinite(v)?v:d,a,b);};
const str=(v,d)=>typeof v==='string'&&v.trim()?v:d;
const hex=(v,d)=>typeof v==='string'&&/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v)?v:d;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fmt=v=>String(Math.round(v*10)/10);
const pct=v=>Math.round(v*100)+'%';

// ===== content：讀取、正規化、自檢 =====
const WANTS=['cool','warm','hot','any','boil'],LFX=['none','dirty','splash'],OPS=['seat','stoke','towel','clean'],EVS=['none','cold_wind','rush','hot_spring'];
const EFFS=['stoke_heat_add','cool_mult','patience_add','pay_mult','towel_cd_mult','open_tub','bath_mult','combo_window_add','auto_stoke_every','clean_taps_sub','heart_max_add','heal_heart'];
const MULTS=['cool_mult','pay_mult','towel_cd_mult','bath_mult'];
const CT={guests:[],tubs:[],branches:[],upgrades:[],byId:{guests:{},tubs:{}},errors:[],warns:[]};
const cwarn=m=>CT.warns.push(m),cerr=m=>CT.errors.push(m);
function rawPack(k){const c=window.SC_CONTENT;const a=c&&typeof c==='object'?c[k]:null;return Array.isArray(a)?a.filter(o=>o&&typeof o==='object'):[];}
function uniqIds(list,pre){const seen={};list.forEach((o,i)=>{let id=str(o.id,pre+i);while(seen[id])id+='_';seen[id]=1;o.id=id;});return list;}
function index(list){const m={};list.forEach(o=>m[o.id]=o);return m;}
// 不存在的客人 id 找替代：前綴相近 → id 關鍵字對應同類客人 → 尚未排班的客人；找不到就由 normShift 報錯
const ALIAS={};
const KW=[[/ice|cold|cool|frost|snow|chill/i,g=>g.want==='cool'],[/boss|vip|rich|king/i,g=>g.want==='boil'],[/hot|fire|warm|heat|spicy/i,g=>g.want==='hot'||g.want==='boil'],[/mud|dirt|dust/i,g=>g.leave_fx==='dirty'],[/splash|water|wet/i,g=>g.leave_fx==='splash'],[/party|group|tour|team|family/i,g=>g.group>1],[/hast|rush|quick|fast/i,g=>g.want==='any']];
function buildAlias(raw){
  const refs=[],used={},G0=CT.guests;
  const add=k=>{if(typeof k!=='string'||!k)return;if(CT.byId.guests[k])used[k]=1;else if(!refs.includes(k))refs.push(k);};
  raw.forEach(b=>(Array.isArray(b.shifts)?b.shifts:[]).forEach(s=>{if(!s||typeof s!=='object')return;if(s.weights&&typeof s.weights==='object')Object.keys(s.weights).forEach(add);add(s.intro);}));
  const free=G0.filter(g=>!used[g.id]);
  const set=(k,g)=>{ALIAS[k]=g.id;const j=free.indexOf(g);if(j>=0)free.splice(j,1);cwarn(`參照不存在的客人 ${k}，改用 ${g.id}（${g.name}）`);};
  const kwFind=(k,list)=>{for(const [re,f] of KW)if(re.test(k)){const g=list.find(f);if(g)return g;}return null;};
  let left=refs.filter(k=>{const g=G0.find(g=>Math.min(k.length,g.id.length)>=4&&(k.startsWith(g.id)||g.id.startsWith(k)));if(g)set(k,g);return !g;});
  left=left.filter(k=>{const g=kwFind(k,free);if(g)set(k,g);return !g;});
  left.forEach(k=>{const g=free[0]||kwFind(k,G0);if(g)set(k,g);});
}
// 正規化一個班次
function normShift(s,i,bid){
  const weights={};let wsum=0;
  if(s.weights&&typeof s.weights==='object')for(const k in s.weights){const w=num(s.weights[k],0,0,1000);const id=CT.byId.guests[k]?k:ALIAS[k];if(!id){cerr(`分店 ${bid} 第 ${i+1} 班參照不存在的客人 ${k}，且找不到替代客人`);continue;}if(w>0){weights[id]=(weights[id]||0)+w;wsum+=w;}}
  if(!wsum){const g=CT.guests.find(g=>g.patience>=20&&g.group===1)||CT.guests[0];weights[g.id]=1;cwarn(`分店 ${bid} 第 ${i+1} 班沒有可用客人權重，改用 ${g.id}`);}
  const ops=Array.isArray(s.ops)?s.ops.filter(o=>OPS.includes(o)):[];if(!ops.includes('seat'))ops.unshift('seat');
  let intro=typeof s.intro==='string'?s.intro:'';if(intro&&!CT.byId.guests[intro]){if(ALIAS[intro])intro=ALIAS[intro];else{cerr(`分店 ${bid} 第 ${i+1} 班 intro ${intro} 不存在，且找不到替代客人`);intro='';}}
  return {n:i+1,dur:num(s.dur,55,15,180),target:Math.round(num(s.target,100,1,1e7)),first:num(s.first_spawn,3,0.5,30),every:num(s.spawn_every,5,1.2,30),cool:num(s.cool_mult,1,0,5),weights,ops,intro,event:EVS.includes(s.event)?s.event:'none',eventAt:num(s.event_at,0.5,0,1)};
}
// 正規化一間分店
function normBranch(b){
  const used={},tubs=[];
  (Array.isArray(b.tubs)?b.tubs:[]).forEach(t=>{
    if(!t||typeof t!=='object'||tubs.length>=6)return;
    let type=t.type;if(!CT.byId.tubs[type]){cwarn(`分店 ${b.id} 參照不存在的池種 ${type}，改用 ${CT.tubs[0].id}`);type=CT.tubs[0].id;}
    let slot=Math.round(num(t.row,0,0,2))*2+Math.round(num(t.col,0,0,1));while(used[slot])slot=(slot+1)%6;used[slot]=1;
    tubs.push({type,slot,start:num(t.start_temp,50,0,100),open:t.open!==false});
  });
  for(let s=0;tubs.length<2&&s<6;s++)if(!used[s]){used[s]=1;tubs.push({type:CT.tubs[0].id,slot:s,start:tubs.length?82:55,open:true});}
  let open=tubs.filter(t=>t.open).length;for(const t of tubs)if(open<2&&!t.open){t.open=true;open++;}
  const shifts=(Array.isArray(b.shifts)?b.shifts:[]).filter(s=>s&&typeof s==='object').map((s,i)=>normShift(s,i,b.id));
  if(!shifts.length){cwarn(`分店 ${b.id} 沒有班表，已略過`);return null;}
  const sum=shifts.reduce((a,s)=>a+s.target,0)+shifts.length*100;
  const star2=Math.round(num(b.star2,sum*1.4,1,1e9)),star3=Math.max(star2+1,Math.round(num(b.star3,sum*1.9,1,1e9)));
  return {id:b.id,name:str(b.name,'湯屋'),emoji:str(b.emoji,'🏮'),desc:str(b.desc,''),need:Math.round(num(b.need_stars,0,0,999)),theme:hex(b.theme,'#2b2140'),tubs,shifts,star2,star3,decay:num(b.inf_spawn_decay,0.92,0.8,0.99),grow:num(b.inf_target_grow,1.15,1,1.5)};
}
// 載入四包
function loadContent(){
  CT.guests=uniqIds(rawPack('guests').map(g=>({id:g.id,name:str(g.name,'客人喵'),emoji:str(g.emoji,'🐱'),want:WANTS.includes(g.want)?g.want:'warm',patience:num(g.patience,20,5,40),bath:num(g.bath,6,2,15),pay:Math.round(num(g.pay,20,1,500)),group:num(g.group,1,1,3)>=2?3:1,leave_fx:LFX.includes(g.leave_fx)?g.leave_fx:'none',anger:Math.round(num(g.anger,1,1,3)),hint:str(g.hint,'')})),'g');
  CT.byId.guests=index(CT.guests);
  CT.tubs=uniqIds(rawPack('tubs').map(t=>({id:t.id,name:str(t.name,'湯池'),emoji:str(t.emoji,'♨️'),cool_rate:num(t.cool_rate,1.5,0,5),heat:num(t.heat,15,1,50),pay_mult:num(t.pay_mult,1,0.3,3),clean_taps:Math.round(num(t.clean_taps,2,1,6)),color:hex(t.color,'#8a5a2b')})),'t');
  if(!CT.tubs.length){CT.tubs.push({id:'t_default',name:'木桶',emoji:'🪵',cool_rate:1.5,heat:15,pay_mult:1,clean_taps:2,color:'#8a5a2b'});cwarn('tubs 包為空，改用預設木桶');}
  CT.byId.tubs=index(CT.tubs);
  if(!CT.guests.length)CT.errors.push('guests 包沒有任何客人');
  else{const rb=rawPack('branches');buildAlias(rb);CT.branches=uniqIds(rb.map(b=>normBranch(b)).filter(Boolean),'b');}
  if(!CT.branches.length&&!CT.errors.length)CT.errors.push('branches 包沒有可用分店（至少需要 1 個班次）');
  CT.upgrades=uniqIds(rawPack('upgrades').filter(u=>{if(EFFS.includes(u.effect))return true;cwarn(`升級 ${u.id} 的 effect「${u.effect}」不支援，已略過`);return false;}).map(u=>{
    let v=num(u.value,1,-999,999);
    if(MULTS.includes(u.effect)){if(u.effect==='pay_mult'&&v<0.5)v=1+v;v=clamp(v,0.3,2);}
    else if(u.effect==='auto_stoke_every')v=clamp(v,2,60);
    else if(['open_tub','heal_heart','heart_max_add'].includes(u.effect))v=Math.max(1,Math.round(v));
    else v=clamp(v,0,999);
    return {id:u.id,name:str(u.name,'升級'),emoji:str(u.emoji,'✨'),effect:u.effect,value:v,cost:Math.round(num(u.cost,100,1,99999)),max:Math.round(num(u.max_lv,1,1,5)),from:Math.round(num(u.from_shift,1,1,99)),desc:str(u.desc,'效果 {v}')};
  }),'u');
  validate();
  CT.warns.forEach(w=>console.warn('[喵湯屋自檢]',w));
  CT.errors.forEach(w=>console.error('[喵湯屋自檢・阻擋開始]',w));
}
// 交叉參照自檢
function validate(){
  const inW={};CT.branches.forEach(b=>b.shifts.forEach(s=>{Object.keys(s.weights).forEach(k=>inW[k]=1);if(s.intro)inW[s.intro]=1;}));
  if(CT.branches.length)CT.guests.forEach(g=>{if(!inW[g.id])cerr(`客人 ${g.id} 沒有排進任何分店班表 weights 或 intro`);});
  const maxN=Math.max(1,...CT.branches.map(b=>b.shifts.length));
  CT.upgrades.forEach(u=>{if(u.from>maxN)cwarn(`升級 ${u.id} 的 from_shift ${u.from} 超過班數，只會在無限營業出現`);});
  const sorted=CT.branches.slice().sort((a,b)=>a.need-b.need);
  if(sorted.length&&sorted[0].need>0){cwarn('沒有 need_stars=0 的分店，最低門檻那間改為免費');sorted[0].need=0;}
  sorted.forEach((b,i)=>{if(b.need>i*3)cwarn(`分店 ${b.id} 需要 ${b.need} 星，但前面分店最多只有 ${i*3} 星`);});
}

// ===== progress：本機存檔 =====

let AC=null,NB=null;
function ac(){if(!AC){try{const A=window.AudioContext||window.webkitAudioContext;if(A)AC=new A();}catch(e){AC=null;}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});return AC;}
function tone(f,d,type,vol,f2,delay){const a=AC;if(!a||P.muted)return;try{const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.05);}catch(e){}}
function noise(d,vol,freq,delay){const a=AC;if(!a||P.muted)return;try{if(!NB){NB=a.createBuffer(1,a.sampleRate,a.sampleRate);const c=NB.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;}const t=a.currentTime+(delay||0),s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=NB;f.type='bandpass';f.frequency.value=freq||1000;g.gain.setValueAtTime(vol||0.2,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.05);}catch(e){}}

function pop(x,y,k,n){const cs=PCOL[k]||['#fff'];n=n||10;for(let i=0;i<n&&FX.parts.length<500;i++){const a=rnd(0,Math.PI*2),sp=k==='star'?rnd(60,200):k==='steam'?rnd(4,14):rnd(40,160);FX.parts.push({x,y,vx:Math.cos(a)*sp,vy:k==='steam'?-rnd(15,35):Math.sin(a)*sp-(k==='coin'||k==='splash'||k==='fire'?80:0),g:k==='steam'?-5:k==='fire'?-60:k==='star'?40:300,life:0,max:k==='steam'?rnd(1,2):rnd(0.4,0.9),c:pick(cs),r:k==='steam'?rnd(4,8):rnd(2,4.5),k});}}
function ftext(x,y,s,c,size,life){FX.texts.push({x,y,s,c:c||'#fff',size:size||16,life:0,max:life||1.1});if(FX.texts.length>40)FX.texts.shift();}
function banner(s,ms,c){FX.banners.push({s,t:0,max:(ms||1100)/1000,c:c||'#ffcf5a'});if(FX.banners.length>4)FX.banners.splice(1,1);}
const shake=ms=>{FX.shake=Math.max(FX.shake,ms/1000);};
function updFx(dt){
  for(const p of FX.parts){p.life+=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.k==='steam')p.r+=dt*6;}
  FX.parts=FX.parts.filter(p=>p.life<p.max);
  for(const t of FX.texts){t.life+=dt;t.y-=26*dt;}
  FX.texts=FX.texts.filter(t=>t.life<t.max);
  if(FX.banners.length){const b=FX.banners[0];b.t+=dt;if(b.t>=b.max)FX.banners.shift();}
  FX.shake=Math.max(0,FX.shake-dt);FX.flash=Math.max(0,FX.flash-dt*1.5);
}

// ===== upgrades：效果彙總、說明、預覽 =====
function calcMods(lv){
  const m={heatAdd:0,coolMul:1,patAdd:0,payMul:1,towelMul:1,bathMul:1,comboAdd:0,autoEvery:0,cleanSub:0};
  for(const u of CT.upgrades){const L=lv[u.id]||0;if(!L)continue;const v=u.value;
    switch(u.effect){
      case 'stoke_heat_add':m.heatAdd+=v*L;break;case 'cool_mult':m.coolMul*=Math.pow(v,L);break;
      case 'patience_add':m.patAdd+=v*L;break;case 'pay_mult':m.payMul*=Math.pow(v,L);break;
      case 'towel_cd_mult':m.towelMul*=Math.pow(v,L);break;case 'bath_mult':m.bathMul*=Math.pow(v,L);break;
      case 'combo_window_add':m.comboAdd+=v*L;break;case 'clean_taps_sub':m.cleanSub+=v*L;break;
      case 'auto_stoke_every':{const e=v*Math.pow(0.8,L-1);m.autoEvery=m.autoEvery?Math.min(m.autoEvery,e):e;break;}
    }}
  m.coolMul=clamp(m.coolMul,0.15,3);m.payMul=clamp(m.payMul,0.3,5);m.towelMul=clamp(m.towelMul,0.15,3);m.bathMul=clamp(m.bathMul,0.25,3);
  return m;
}
// 回傳 [標籤, 購買前, 購買後, {total}代入值]
function preview(u){
  const lv2=Object.assign({},G.lv);lv2[u.id]=(lv2[u.id]||0)+1;
  const a=G.mods,b=calcMods(lv2),v=u.value,ref=(G.tubs.find(t=>t.open)||G.tubs[0]||{type:CT.tubs[0]}).type.heat;
  switch(u.effect){
    case 'stoke_heat_add':{const x=Math.round(ref+b.heatAdd);return ['每次添柴',`+${Math.round(ref+a.heatAdd)}°`,`+${x}°`,x];}
    case 'cool_mult':return ['降溫速度',pct(a.coolMul),pct(b.coolMul),pct(b.coolMul)];
    case 'patience_add':return ['客人耐心',`+${fmt(a.patAdd)}秒`,`+${fmt(b.patAdd)}秒`,fmt(b.patAdd)];
    case 'pay_mult':return ['收款倍率',pct(a.payMul),pct(b.payMul),pct(b.payMul)];
    case 'towel_cd_mult':return ['毛巾冷卻',`${fmt(8*a.towelMul)}秒`,`${fmt(8*b.towelMul)}秒`,fmt(8*b.towelMul)];
    case 'bath_mult':return ['泡湯時間',pct(a.bathMul),pct(b.bathMul),pct(b.bathMul)];
    case 'combo_window_add':return ['連擊視窗',`${fmt(5+a.comboAdd)}秒`,`${fmt(5+b.comboAdd)}秒`,fmt(b.comboAdd)];
    case 'auto_stoke_every':return ['自動添柴',a.autoEvery?`每${fmt(a.autoEvery)}秒`:'無',`每${fmt(b.autoEvery)}秒`,fmt(b.autoEvery)];
    case 'clean_taps_sub':return ['刷池次數',`−${fmt(a.cleanSub)}下`,`−${fmt(b.cleanSub)}下`,fmt(b.cleanSub)];
    case 'heart_max_add':{const x=Math.min(8,G.heartsMax+v);return ['口碑上限',`${G.heartsMax}♥`,`${x}♥`,Math.max(0,x-5)];}
    case 'heal_heart':{const x=Math.min(G.heartsMax,G.hearts+v);return ['口碑',`${G.hearts}♥`,`${x}♥`,x];}
    case 'open_tub':{const n=G.tubs.filter(t=>t.open).length,x=n+Math.min(G.tubs.length-n,v);return ['營業池數',`${n}池`,`${x}池`,x];}
  }
  return ['效果','—','—','—'];
}

// 抽三張（有鎖池位時必含擴店卡）
function drawCards(n){
  const locked=G.tubs.some(t=>!t.open);
  const pool=CT.upgrades.filter(u=>u.from<=n&&(G.lv[u.id]||0)<u.max&&(u.effect!=='open_tub'||locked)&&!(u.effect==='heal_heart'&&G.hearts>=G.heartsMax)&&!(u.effect==='heart_max_add'&&G.heartsMax>=8));
  const opens=pool.filter(u=>u.effect==='open_tub'),out=[];
  if(opens.length)out.push(pick(opens));
  for(const u of shuffle(pool.filter(u=>u.effect!=='open_tub'))){if(out.length>=3)break;out.push(u);}
  return shuffle(out);
}

function seat(t,g){
  removeGuest(g);
  const b=tubBody(t.slot),cx=b.x+b.w/2,tip=g.pat/g.max>=0.6?1.5:1;
  comboHit();
  t.occ={gt:g.gt,tip,cm:comboMult(),bathT:g.gt.bath*G.mods.bathMul};t.prog=0;t.flashT=0.5;
  pop(cx,b.y+40,'splash',18);play('seat');ftext(cx,b.y+20,G.tutSeat?'撲通！歡迎泡湯！':'歡迎泡湯！','#bfefff',15);

// 班內每步更新
function updShift(dt){
  const s=G.spec,m=G.mods;
  G.elapsed+=dt;G.shiftT+=dt;G.timeLeft-=dt;
  const ev=G.ev;
  if(ev.at>=0){if(!ev.warned&&G.shiftT>=ev.at-2){ev.warned=true;eventWarn(ev.type);}if(!ev.fired&&G.shiftT>=ev.at){ev.fired=true;eventFire(ev.type);}}
  if(G.evIcon)G.evIcon.t=Math.max(0,G.evIcon.t-dt);
  G.windT=Math.max(0,G.windT-dt);G.rushT=Math.max(0,G.rushT-dt);
  G.spawnT-=dt;
  if(G.spawnT<=0&&G.timeLeft>2)G.spawnT=spawn()?s.every*(G.rushT>0?0.6:1)*rnd(0.85,1.15):0.5;
  G.guests.forEach((g,i)=>{g.x+=(slotX(i)-g.x)*Math.min(1,dt*12);g.bounce=Math.max(0,g.bounce-dt*3);g.flash=Math.max(0,g.flash-dt);});
  for(const g of G.guests.slice()){g.pat-=dt;if(g.pat<=0){guestLeave(g);if(G.phase!=='shift')return;}}
  const coolEff=(G.windT>0?Math.max(s.cool,1)*2.5:s.cool)*m.coolMul;
  for(const t of G.tubs){
    t.shakeT=Math.max(0,t.shakeT-dt);t.flashT=Math.max(0,t.flashT-dt);
    if(!t.open)continue;
    const prev=RANK[bandOf(t.temp)];
    t.temp=clamp(t.temp-t.type.cool_rate*coolEff*dt,0,100);
    if(RANK[bandOf(t.temp)]<prev)onBandDrop(t);
    t.steamT+=dt*Math.max(0,t.temp-30)/70*5;
    while(t.steamT>1){t.steamT--;const b=tubBody(t.slot);pop(b.x+rnd(20,150),b.y+rnd(15,45),'steam',1);}
    if(t.occ){t.prog+=dt;if(t.prog>=t.occ.bathT)finishBath(t);}
  }
  if(m.autoEvery>0){G.autoT+=dt;if(G.autoT>=m.autoEvery){G.autoT=0;autoStoke();}}
  if(G.comboT>0){G.comboT-=dt;if(G.comboT<=0)comboBreak();}
  G.comboPulse=Math.max(0,G.comboPulse-dt*3);
  if(G.towelCd>0)G.towelCd-=dt;
  if(G.tutPoint){G.tutPoint.t-=dt;if(G.tutPoint.t<=0)G.tutPoint=null;}
  if(G.timeLeft<=0)endShift();
}
// 打烊結算
function endShift(){
  for(const t of G.tubs)if(t.occ)finishBath(t,true);
  G.guests=[];G.sel=0;G.tutPoint=null;G.windT=0;G.rushT=0;G.evIcon=null;G.combo=0;G.comboT=0;
  const met=G.revenue>=G.target,zero=G.angryShift===0,bonus=(met?100:0)+(zero?80:0);
  if(bonus)scoreUp(bonus);
  G.result={n:G.spec.n,met,zero,rev:G.revenue,target:G.target,angry:G.angryShift};
  G.phase='settle';G.phaseT=0;pSave();
  if(met){gainHeart();play('goal');}else loseHeart(1,'未達標');
}
function afterSettle(){if(G.phase!=='settle')return;if(!G.inf&&G.si>=G.br.shifts.length-1)victory();else openUpgrade();}
function openUpgrade(){G.offered=drawCards(G.inf?99:G.si+1);G.upSel=0;G.upT=10;G.compare=null;G.phase='upgrade';G.phaseT=0;if(!G.offered.length)nextShift();}
function victory(){
  const b=G.br,before=unlockedCount();G.fixedScore=G.score;
  let st=1;if(G.score>=b.star2)st=2;if(G.score>=b.star3&&G.angry<=2)st=3;
  const prevSt=clamp(Number(P.stars[b.id])||0,0,3),newBest=G.score>G.prevBest;
  if(st>prevSt)P.stars[b.id]=st;if(newBest)P.best[b.id]=G.score;
  let near;
  if(st<2)near=`差 ${b.star2-G.score} 分拿 ★★`;
  else if(st<3)near=G.score<b.star3?`差 ${b.star3-G.score} 分拿 ★★★`:`氣走 ≤2 人才拿 ★★★（這局 ${G.angry} 人）`;
  else near='★★★ 完美營業！';
  pSave();
  G.info={stars:st,score:G.score,prev:G.prevBest,newBest,angry:G.angry,near,unlock:unlockedCount()>before};
  G.phase='victory';G.phaseT=0;G.fwT=0;play('goal');if(newBest)play('record');
}
function gameOver(reason){
  if(G.phase==='over')return;
  const b=G.br,I={reason,inf:G.inf,newBest:false,left:0,reached:0,infPrev:Number(P.infBest[b.id])||0,prev:G.prevBest};
  if(G.inf){I.reached=b.shifts.length+G.infK;I.newBest=I.reached>I.infPrev;if(I.newBest)P.infBest[b.id]=I.reached;}
  else{I.left=b.shifts.length-G.si;I.newBest=G.score>G.prevBest;if(I.newBest)P.best[b.id]=G.score;}
  G.info=I;G.phase='over';G.phaseT=0;G.paused=false;G.fwT=0;pSave();
  play('bankrupt');shake(500);if(I.newBest)play('record');
  finish(G.score);
}

  ctx.save();if(FX.shake>0)ctx.translate(rnd(-4,4),rnd(-4,4));
  const p=G.phase;
  if(p==='title')drawTitle();
  else if(p==='select')drawSelect();
  else{
    drawGame(p==='shift'&&!G.paused);
    if(p==='shift'&&G.paused)drawPause();else if(p==='settle')drawSettle();else if(p==='upgrade')drawUpgrade();else if(p==='victory')drawVictory();else if(p==='over')drawOver();
  }
  drawFx();ctx.restore();
}

// ===== input：指標與鍵盤 =====
function onPointer(x,y){for(let i=REG.length-1;i>=0;i--){const r=REG[i];if(x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h){r.fn();return;}}}
let held=false;
cv.addEventListener('pointerdown',e=>{e.preventDefault();ac();held=true;const r=cv.getBoundingClientRect();if(!r.width||!r.height)return;try{onPointer((e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H);}catch(err){console.warn(err);}});
cv.addEventListener('pointerup',()=>{held=false;});
cv.addEventListener('pointercancel',()=>{held=false;});
cv.addEventListener('contextmenu',e=>e.preventDefault());
const pauseIfPlaying=()=>{held=false;if(G.phase==='shift')G.paused=true;};
addEventListener('blur',pauseIfPlaying);
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseIfPlaying();});
const SEATK=['KeyQ','KeyW','KeyE','KeyA','KeyS','KeyD'],STOKEK=['KeyZ','KeyX','KeyC','KeyV','KeyB','KeyN'];
function onKey(c){
  const p=G.phase,ok=c==='Enter'||c==='Space'||c==='NumpadEnter';
  if(p==='title'){if(ok)tryTitle();return;}
  if(p==='select'){const n=CT.branches.length;if(!n)return;if(c==='ArrowDown'||c==='ArrowRight')G.selIdx=(G.selIdx+1)%n;else if(c==='ArrowUp'||c==='ArrowLeft')G.selIdx=(G.selIdx-1+n)%n;else if(ok){const b=CT.branches[G.selIdx];if(b&&isUnlocked(b))startRun(b);}G.selPage=Math.floor(G.selIdx/4);return;}
  if(p==='shift'){
    if(G.paused){if(ok||c==='Escape'||c==='KeyP')G.paused=false;else if(c==='KeyM')toggleMute();return;}
    if(c==='Escape'||c==='KeyP'){G.paused=true;return;}
    if(c==='KeyM'){toggleMute();return;}
    const d=/^(Digit|Numpad)([1-6])$/.exec(c);if(d){const g=G.guests[+d[2]-1];if(g)select(g);return;}
    let i=SEATK.indexOf(c);if(i>=0){const t=tubAt(i);if(t)tapTub(t);return;}
    i=STOKEK.indexOf(c);if(i>=0){const t=tubAt(i);if(t&&t.open)stoke(t);return;}
    if(c==='KeyT')towel();return;
  }
  if(p==='settle'){if(ok&&G.phaseT>0.5)afterSettle();return;}
  if(p==='upgrade'){if(G.compare)return;const n=G.offered.length;
    if(c==='ArrowRight'||c==='ArrowDown')G.upSel=(G.upSel+1)%(n+1);else if(c==='ArrowLeft'||c==='ArrowUp')G.upSel=(G.upSel+n)%(n+1);
    else if(ok){if(G.upSel<n)buy(G.offered[G.upSel]);else saveMoney();}
    else{const d=/^(Digit|Numpad)([1-3])$/.exec(c);if(d&&G.offered[+d[2]-1])buy(G.offered[+d[2]-1]);}return;}
  if(p==='victory'){if(G.phaseT<0.6)return;if(ok||c==='KeyR')restart();else if(c==='KeyI'&&G.phaseT>=2)goInfinite();else if(c==='Escape'){finish(G.score);goSelect();}return;}
  if(p==='over'&&G.phaseT>0.4){if(ok||c==='KeyR')restart();else if(c==='Escape')goSelect();}
}
addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter'].includes(e.code))e.preventDefault();ac();try{onKey(e.code);}catch(err){console.warn(err);}});

// ===== 主迴圈（固定步長） =====
let last=performance.now(),acc=0,warned=false;
function frame(now){
  let d=(now-last)/1000;last=now;if(!(d>=0))d=0;if(d>0.25)d=0.25;acc+=d;
  try{let n=0;while(acc>=STEP&&n<8){update(STEP);acc-=STEP;n++;}if(n>=8)acc=0;draw();}
  catch(err){if(!warned){warned=true;console.warn('[喵湯屋]',err);}}
  requestAnimationFrame(frame);
}

// ===== 品管掛勾 =====
window.SC_HOOKS={
  start(){const b=CT.branches.find(isUnlocked)||CT.branches[0];if(b&&!CT.errors.length)startRun(b);},
  snapshot(){return {scene:G.phase,score:G.score,level:G.br?(G.inf?G.br.shifts.length+G.infK:G.si+1):0,elapsed:Math.round(G.elapsed*100)/100,
    branch:G.br?G.br.id:'',inf:G.inf,paused:G.paused,hearts:G.hearts,heartsMax:G.heartsMax,wallet:G.wallet,revenue:G.revenue,target:G.target,
    timeLeft:Math.max(0,Math.round(G.timeLeft*10)/10),queue:G.guests.map(g=>({id:g.gt.id,want:g.gt.want,patience:Math.round(g.pat*10)/10})),
    selected:G.guests.findIndex(g=>g.uid===G.sel),tubs:G.tubs.map(t=>({slot:t.slot,temp:Math.round(t.temp),band:bandOf(t.temp),open:t.open,occupied:!!t.occ,dirty:t.dirty})),
    ops:G.ops.slice(),combo:G.combo,angry:G.angry,served:G.served,reported:G.reported,errors:CT.errors.slice()};}
};

pLoad();loadContent();requestAnimationFrame(frame);
})();
</script>
