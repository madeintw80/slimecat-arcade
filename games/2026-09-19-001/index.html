所有欄位缺漏 → 補預設值；數值超範圍 → clamp；未知 enum → 退回預設 enum；不會靜默略過（console.warn + 標題畫面紅字）。

[zones] 井區，建議 12 筆（引擎依陣列長度動態決定；1 筆也能跑）
  id            string 唯一英文 id（必填，重複會警告）
  name          string 繁中區名（顯示於 HUD 與進區字幕）
  order         int 1..99（引擎會依 order 排序；缺值用陣列索引）
  pads          int 3..999（該區層數；最後一區建議 999＝無限循環區）
  gravity       number 80..260（px/s²；clamp）
  wind_max      number 0..60（px/s²；合約上限 90 但引擎硬 clamp 到 60，避免側噴抵銷不了）
  gust_rate     number 0..8（每分鐘陣風次數）
  pad_width     array [最小,最大]，各 60..180（會自動排序大小；非陣列則視為 [v,v]）
  pad_types     array of pad_types.id（至少 1 個；引用不存在的 id ＝阻擋式錯誤，標題紅字）
  fuel_pickup_rate number 0..1（每層出現魚乾罐機率）
  wall_gap      int 0 或 100..220（0＝無橫梁；1..99 會被提升到 100）
  heat          bool（是否啟用過熱系統）
  twin_rate     number 0..1（雙墊選擇段機率）
  intro         string 12 字內進區字幕
  規則建議：order 1~2 合計 ≥8 層、無風、pad_width 最小 ≥120；order 4 需 wind_max ≥30 且含 slide 墊；
            order 7 需 heat=true；偶數區為喘息區（較寬墊、fuel_pickup_rate ≥0.4）。
            最後一區 pads=999，引擎每循環自動 gravity +5%、pad_width -5px（下限 60）、gust_rate +1。

[pad_types] 墊型，建議 10 筆
  id            string 唯一英文 id（被 zones.pad_types 引用）
  name          string 繁中名
  motion        enum static|slide|sink|shrink|blink|tilt（未知值退回 static）
  speed         number 0..80（px/s；static 填 0）
  amplitude     number 0..140（slide＝往返半程 px／sink＝下沉距離 px／shrink＝縮減量 px／
                blink＝亮暗週期秒×10（引擎下限 12＝1.2 秒）／tilt＝傾角度數）
  soft_mult     number 0.6..1.2（綠窗口倍率，<1 更嚴；建議 min_zone_order≥3 才用 <1）
  score_mult    number 1.0..2.5（static 建議 1.0）
  color         string #rrggbb（非法色碼退回 #7be495）
  min_zone_order int 1..12（僅作提示用，實際出現由 zones.pad_types 決定）
  hint          string 14 字內，首次出現時顯示 2 秒
  規則：shrink 後寬度引擎保證 ≥60px；判定寬＝視覺寬＋6px（判定比看起來寬鬆）。

[boons] 肉球卡，建議 20 筆（少於 3 筆時引擎自動以 common 補齊重複抽池）
  id/name/desc  string（name ≤6 字、desc ≤16 字）
  stat          enum tank|thrust|side|soft_window|hull|fuel_refund|score_mult|magnet|heat_cap|wind_resist
  value         number（mode=mul 時 0.5..2.0；mode=add 時 -3..60）
  mode          enum mul|add（未知退回 mul）
  rarity        enum common|rare|legendary（權重固定 70/25/5，內容包不可改）
  max_stack     int 1..4
  side_stat     同 stat 的可用值，或 "none"
  side_value    number（mul 0.5..1.0 或 add 負值；無副作用填 1）
  規則：legendary 必有副作用；common 不可有副作用；hull 的 add 值 ≤1；score_mult 單張 ≤1.5。

[pods] 艙體，建議 10 筆
  id/name/desc  string（desc ≤16 字）
  mass          number 0.7..1.6
  tank          int 60..160
  thrust        number 180..360
  side_thrust   number 40..140（引擎硬 clamp 到 thrust×0.4 以內）
  hull          int 1..4
  soft_limit    number 1.0..2.2（綠色門檻，顯示單位 m/s）
  hull_color    string #rrggbb
  shape         enum round|square|drop|star（未知退回 round）
  unlock_type   enum default|depth|combo|fish|daily_streak|perfect_count（未知退回 depth）
  unlock_value  int 0..500（default 填 0）
  規則：恰好一艘 default（沒有的話引擎自動把第一艘設為 default）；第二艘建議 depth ≤12。
-->

 "pods":[

  {"id":"fat_tank","name":"胖胖油罐艙","desc":"油多但煞車慢","mass":1.4,"tank":150,"thrust":280,"side_thrust":80,"hull":3,"soft_limit":1.4,"hull_color":"#ffb37a","shape":"square","unlock_type":"depth","unlock_value":12}
 ]

<script>
(function(){
"use strict";
// ===== 基礎工具 =====
var W=400,H=600,cv=document.getElementById("cv"),ctx=cv.getContext("2d"),scale=1,dpr=1;
var clamp=function(v,a,b){v=+v;if(!isFinite(v))v=a;return v<a?a:(v>b?b:v);};
var lerp=function(a,b,t){return a+(b-a)*t;};
var HEX=/^#[0-9a-fA-F]{6}$/;
var col=function(c,d){return (typeof c==="string"&&HEX.test(c))?c:d;};
var pickEnum=function(v,list,d){return list.indexOf(v)>=0?v:d;};
var fmt=function(n){return Math.floor(n).toLocaleString("en-US");};

// canvas 等比縮放 + DPR
function resize(){
  var aw=window.innerWidth-12, ah=window.innerHeight-12;
  scale=Math.min(aw/W,ah/H); if(scale>2)scale=2; if(scale<0.3)scale=0.3;
  dpr=Math.min(window.devicePixelRatio||1,3);
  cv.style.width=(W*scale)+"px"; cv.style.height=(H*scale)+"px";
  cv.width=Math.round(W*scale*dpr); cv.height=Math.round(H*scale*dpr);
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  ctx.textBaseline="alphabetic";
}
window.addEventListener("resize",resize);

// ===== 音效（WebAudio 合成） =====
var AC=null,muted=false;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } } if(AC&&AC.state==="suspended"){ try{AC.resume();}catch(e){} } return AC; }
function tone(f1,f2,dur,type,vol,delay){
  var c=ac(); if(!c||muted)return;
  var t0=c.currentTime+(delay||0);
  var o=c.createOscillator(),g=c.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(f1,t0);
  if(f2&&f2!==f1)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,(vol||0.18)),t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+dur+0.03);
}
var noiseBuf=null;
function noise(dur,vol,filt,slide){
  var c=ac(); if(!c||muted)return;
  if(!noiseBuf){ noiseBuf=c.createBuffer(1,c.sampleRate*1.2,c.sampleRate); var d=noiseBuf.getChannelData(0);
    for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1; }
  var s=c.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  var bp=c.createBiquadFilter(); bp.type="bandpass"; bp.frequency.setValueAtTime(filt||800,c.currentTime); bp.Q.value=1.1;
  if(slide)bp.frequency.exponentialRampToValueAtTime(Math.max(60,slide),c.currentTime+dur);
  var g=c.createGain(); g.gain.setValueAtTime(vol||0.12,c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+dur);
  s.connect(bp); bp.connect(g); g.connect(c.destination); s.start(); s.stop(c.currentTime+dur+0.05);
}
// 持續噴射音（白噪 loop）
var jetSrc=null,jetGain=null;
function jetOn(){
  var c=ac(); if(!c||muted||jetSrc)return;
  if(!noiseBuf){ noiseBuf=c.createBuffer(1,c.sampleRate*1.2,c.sampleRate); var d=noiseBuf.getChannelData(0);
    for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1; }
  jetSrc=c.createBufferSource(); jetSrc.buffer=noiseBuf; jetSrc.loop=true;
  var lp=c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=900;
  jetGain=c.createGain(); jetGain.gain.setValueAtTime(0.0001,c.currentTime);
  jetGain.gain.linearRampToValueAtTime(0.075,c.currentTime+0.05);
  jetSrc.connect(lp); lp.connect(jetGain); jetGain.connect(c.destination); jetSrc.start();
}
function jetOff(){
  if(!jetSrc)return; var c=AC;
  try{ jetGain.gain.cancelScheduledValues(c.currentTime); jetGain.gain.setValueAtTime(jetGain.gain.value,c.currentTime);
       jetGain.gain.linearRampToValueAtTime(0.0001,c.currentTime+0.06); jetSrc.stop(c.currentTime+0.1); }catch(e){}
  jetSrc=null; jetGain=null;
}
var SFX={
  green:function(){ tone(880,1320,0.16,"triangle",0.2); tone(1320,1760,0.12,"sine",0.12,0.05); },
  perfect:function(){ [0,0.07,0.14,0.22].forEach(function(d,i){ tone(660*Math.pow(1.26,i),0,0.18,"triangle",0.17,d); }); },
  yellow:function(){ tone(150,70,0.24,"square",0.16); noise(0.16,0.1,400,160); },
  boom:function(){ noise(0.55,0.28,700,80); tone(90,32,0.5,"sawtooth",0.2); },
  card:function(){ tone(520,980,0.1,"triangle",0.14); },
  legend:function(){ [0,0.08,0.16].forEach(function(d,i){ tone(784*Math.pow(1.33,i),0,0.3,"sine",0.15,d); }); },
  record:function(){ [523,659,784,1046,1318].forEach(function(f,i){ tone(f,0,0.3,"triangle",0.16,i*0.09); }); },
  pick:function(){ tone(420,620,0.07,"square",0.1); },
  can:function(){ tone(1046,1568,0.09,"sine",0.15); },
  unlock:function(){ [440,554,659,880].forEach(function(f,i){ tone(f,0,0.35,"triangle",0.15,i*0.08); }); },
  beat:function(){ tone(180,120,0.08,"sine",0.12); },
  heat:function(){ tone(300,120,0.3,"sawtooth",0.14); noise(0.25,0.08,1600,400); }
};

// ===== 內容載入與驗證 =====
var CONTENT={zones:[],pads:{},padList:[],boons:[],pods:[]},CERR=[],CWARN=0;
function warn(msg){ CWARN++; if(CWARN<40&&window.console&&console.warn)console.warn("[SC_CONTENT] "+msg); }
var MOTIONS=["static","slide","sink","shrink","blink","tilt"];
var STATS=["tank","thrust","side","soft_window","hull","fuel_refund","score_mult","magnet","heat_cap","wind_resist"];
var RARITY=["common","rare","legendary"];
var SHAPES=["round","square","drop","star"];
var UNLOCKS=["default","depth","combo","fish","daily_streak","perfect_count"];

function loadContent(){
  var raw=(window.SC_CONTENT&&typeof window.SC_CONTENT==="object")?window.SC_CONTENT:{};
  var arr=function(k){ return Array.isArray(raw[k])?raw[k]:(warn(k+" 缺少或非陣列，使用空陣列"),[]); };
  // pad_types
  var pts=arr("pad_types"),seen={};
  CONTENT.padList=pts.map(function(p,i){
    p=p||{}; var id=(typeof p.id==="string"&&p.id)?p.id:("pad"+i);
    if(seen[id]){ warn("pad_types id 重複："+id); id=id+"_"+i; } seen[id]=1;
    var amp=clamp(p.amplitude,0,140), mo=pickEnum(p.motion,MOTIONS,"static");
    if(p.motion&&mo!==p.motion)warn("未知 motion："+p.motion+"（退回 static）");
    if(mo==="blink"&&amp<12)amp=12; // 亮暗週期 ≥1.2 秒
    return {id:id,name:(p.name||id)+"",motion:mo,speed:clamp(p.speed,0,80),amplitude:amp,
      soft_mult:clamp(p.soft_mult==null?1:p.soft_mult,0.6,1.2),
      score_mult:clamp(p.score_mult==null?1:p.score_mult,1,2.5),
      color:col(p.color,"#7be495"),min_zone_order:clamp(p.min_zone_order||1,1,99)|0,
      hint:(p.hint||"")+""};
  });
  if(!CONTENT.padList.length){ CONTENT.padList=[{id:"static",name:"軟墊",motion:"static",speed:0,amplitude:0,soft_mult:1,score_mult:1,color:"#7be495",min_zone_order:1,hint:""}]; warn("pad_types 為空，使用內建 fallback"); }
  CONTENT.pads={}; CONTENT.padList.forEach(function(p){CONTENT.pads[p.id]=p;});
  // zones
  var zs=arr("zones");
  CONTENT.zones=zs.map(function(z,i){
    z=z||{};
    var pw=Array.isArray(z.pad_width)?z.pad_width:[z.pad_width,z.pad_width];
    var a=clamp(pw[0],60,180),b=clamp(pw[1],60,180); if(a>b){var t=a;a=b;b=t;}
    var types=Array.isArray(z.pad_types)?z.pad_types.slice():[];
    var ok=[];
    types.forEach(function(id){
      if(CONTENT.pads[id])ok.push(id);
      else CERR.push("井區「"+(z.name||z.id||("#"+(i+1)))+"」引用了不存在的墊型 id：「"+id+"」");
    });
    if(!ok.length){ ok=[CONTENT.padList[0].id]; if(!types.length)warn("zone "+(z.id||i)+" pad_types 為空，補預設墊型"); }
    var wg=clamp(z.wall_gap||0,0,220)|0; if(wg>0&&wg<100)wg=100;
    return {id:(z.id||("z"+i))+"",name:(z.name||("第 "+(i+1)+" 區"))+"",
      order:(z.order==null?i+1:clamp(z.order,1,99))|0,
      pads:clamp(z.pads==null?5:z.pads,1,999)|0,
      gravity:clamp(z.gravity==null?120:z.gravity,80,260),
      wind_max:clamp(z.wind_max||0,0,60),
      gust_rate:clamp(z.gust_rate||0,0,8),
      pad_width:[a,b],pad_types:ok,
      fuel_pickup_rate:clamp(z.fuel_pickup_rate==null?0.3:z.fuel_pickup_rate,0,1),
      wall_gap:wg,heat:!!z.heat,twin_rate:clamp(z.twin_rate||0,0,1),
      intro:(z.intro||z.name||"")+""};
  }).sort(function(x,y){return x.order-y.order;});
  if(!CONTENT.zones.length){ CERR.push("zones 內容包是空的，無法開始遊戲"); }
  // boons
  CONTENT.boons=arr("boons").map(function(b,i){
    b=b||{}; var mode=pickEnum(b.mode,["mul","add"],"mul");
    var st=pickEnum(b.stat,STATS,"tank"); if(b.stat&&st!==b.stat)warn("未知 boon stat："+b.stat);
    var v=mode==="mul"?clamp(b.value==null?1.1:b.value,0.5,2):clamp(b.value==null?10:b.value,-3,60);
    if(st==="hull"&&mode==="add")v=clamp(v,-1,1);
    if(st==="score_mult"&&mode==="mul")v=clamp(v,0.5,1.5);
    var ss=(b.side_stat==="none"||b.side_stat==null)?"none":pickEnum(b.side_stat,STATS,"none");
    var sv=b.side_value==null?1:+b.side_value; if(!isFinite(sv))sv=1;
    var rar=pickEnum(b.rarity,RARITY,"common");
    if(rar==="common"&&ss!=="none"){ ss="none"; warn("common 卡不應有副作用："+(b.id||i)); }
    return {id:(b.id||("b"+i))+"",name:(b.name||"肉球卡")+"",desc:(b.desc||"")+"",stat:st,value:v,mode:mode,
      rarity:rar,max_stack:clamp(b.max_stack==null?1:b.max_stack,1,4)|0,side_stat:ss,side_value:sv};
  });
  if(CONTENT.boons.length===0)warn("boons 為空，將不會出現三選一");
  // pods
  CONTENT.pods=arr("pods").map(function(p,i){
    p=p||{}; var th=clamp(p.thrust==null?260:p.thrust,180,360);
    var ut=pickEnum(p.unlock_type,UNLOCKS,"depth");
    return {id:(p.id||("pod"+i))+"",name:(p.name||"艙體")+"",desc:(p.desc||"")+"",
      mass:clamp(p.mass==null?1:p.mass,0.7,1.6),tank:clamp(p.tank==null?100:p.tank,60,160)|0,
      thrust:th,side_thrust:Math.min(clamp(p.side_thrust==null?90:p.side_thrust,40,140),th*0.4),
      hull:clamp(p.hull==null?3:p.hull,1,4)|0,soft_limit:clamp(p.soft_limit==null?1.5:p.soft_limit,1,2.2),
      hull_color:col(p.hull_color,"#9fd8ff"),shape:pickEnum(p.shape,SHAPES,"round"),
      unlock_type:ut,unlock_value:clamp(p.unlock_value||0,0,500)|0};
  });
  if(!CONTENT.pods.length){ CONTENT.pods=[{id:"default_pod",name:"果凍艙",desc:"均衡",mass:1,tank:100,thrust:260,side_thrust:90,hull:3,soft_limit:1.5,hull_color:"#9fd8ff",shape:"round",unlock_type:"default",unlock_value:0}]; warn("pods 為空，使用內建艙體"); }
  if(!CONTENT.pods.some(function(p){return p.unlock_type==="default";})){ CONTENT.pods[0].unlock_type="default"; CONTENT.pods[0].unlock_value=0; warn("沒有 default 艙，已將第一艘設為預設"); }
  fillContent();
}

// ===== 內容補齊（合約：zones/pad_types/boons/pods = 12/10/20/10）=====
// 內容包資料不足時不改資料本身，改由引擎依既有內容程序化衍生，保證每區都有可吞的成長階梯。
var TARGET={zones:12,pad_types:10,boons:20,pods:10};
var AUTO_COLORS=["#7be495","#ffe08a","#c79a6b","#f6c453","#a8e6cf","#e08283","#9b8cf2","#ff9f68","#5dade2","#d35400"];
var AUTO_PADNAME={static:"衍生軟墊",slide:"衍生滑板",sink:"衍生沉墊",shrink:"衍生酥餅墊",blink:"衍生忽明墊",tilt:"衍生歪碟墊"};
var AUTO_BOONNAME={tank:"備用油袋",thrust:"備用推力",side:"備用側踢",soft_window:"備用軟墊",hull:"備用外殼",fuel_refund:"備用回油",score_mult:"備用加分",magnet:"備用磁吸",heat_cap:"備用涼感",wind_resist:"備用定風"};
var AUTO_BOONDESC={tank:"油箱容量提升",thrust:"推力提升",side:"側噴力提升",soft_window:"綠窗口加寬",hull:"外殼耐久+1",fuel_refund:"落地回油提升",score_mult:"分數倍率提升",magnet:"撿罐範圍+20px",heat_cap:"過熱耐受提升",wind_resist:"抗風力提升"};
function fillContent(){
  var i,made;
  // pad_types → 10 筆（依 motion 輪替出階梯）
  made=0;
  for(i=CONTENT.padList.length;i<TARGET.pad_types;i++){
    var mo=MOTIONS[i%MOTIONS.length],pid="auto_pad_"+i;
    while(CONTENT.pads[pid])pid+="_";
    var pt={id:pid,name:AUTO_PADNAME[mo]||"衍生軟墊",motion:mo,
      speed:(mo==="slide")?clamp(30+i*4,0,80):((mo==="sink"||mo==="shrink")?clamp(20+i*3,0,80):0),
      amplitude:(mo==="blink")?clamp(12+i,12,140):((mo==="tilt")?clamp(16+i*2,0,40):clamp(40+i*6,0,140)),
      soft_mult:clamp(1.05-0.05*i,0.6,1.2),score_mult:clamp(1+0.15*i,1,2.5),
      color:AUTO_COLORS[i%AUTO_COLORS.length],min_zone_order:clamp(i+1,1,12)|0,
      hint:"引擎衍生墊型，先看動向"};
    CONTENT.padList.push(pt); CONTENT.pads[pt.id]=pt; made++;
  }
  if(made)warn("pad_types 只有 "+(CONTENT.padList.length-made)+" 筆（合約 "+TARGET.pad_types+"），引擎衍生補上 "+made+" 筆");
  // zones → 12 筆（完全沒有 zones 時不補，維持 CERR 阻擋）
  made=0;
  if(CONTENT.zones.length){
    for(i=CONTENT.zones.length;i<TARGET.zones;i++){
      var prev=CONTENT.zones[CONTENT.zones.length-1];
      var ord=clamp(prev.order+1,1,99)|0,last=(i===TARGET.zones-1),even=(ord%2===0);
      var ids=CONTENT.padList.filter(function(p){return p.min_zone_order<=ord;}).map(function(p){return p.id;});
      if(!ids.length)ids=[CONTENT.padList[0].id];
      CONTENT.zones.push({id:"auto_z"+i,name:"深井第 "+ord+" 區",order:ord,
        pads:last?999:clamp(5+(i%3),3,999)|0,
        gravity:clamp(prev.gravity+5,80,260),
        wind_max:clamp(ord>=4?36:0,0,60),gust_rate:clamp(ord>=4?3:0,0,8),
        pad_width:[clamp(prev.pad_width[0]-4,60,180),clamp(prev.pad_width[1]-4,60,180)],
        pad_types:ids,fuel_pickup_rate:even?0.45:0.25,
        wall_gap:ord>=11?150:0,heat:ord>=7,twin_rate:clamp(0.2+0.02*i,0,1),
        intro:last?"沒有終點，只有紀錄":"再往下，越來越沉"});
      made++;
    }
  }
  if(made)warn("zones 只有 "+(CONTENT.zones.length-made)+" 筆（合約 "+TARGET.zones+"），引擎衍生補上 "+made+" 筆");
  // boons → 20 筆（第二輪為 rare 強化版，common 一律無副作用）
  made=0;
  for(i=CONTENT.boons.length;i<TARGET.boons;i++){
    var st=STATS[i%STATS.length],tier=Math.floor(i/STATS.length)>0?1:0;
    var mode=(st==="hull"||st==="magnet")?"add":"mul";
    var val=mode==="add"?(st==="hull"?1:(tier?30:20)):(st==="score_mult"?(tier?1.3:1.15):(tier?1.28:1.15));
    CONTENT.boons.push({id:"auto_boon_"+i,name:(AUTO_BOONNAME[st]||"備用肉球")+(tier?"Ⅱ":""),
      desc:AUTO_BOONDESC[st]||"",stat:st,value:val,mode:mode,
      rarity:tier?"rare":"common",max_stack:tier?2:3,side_stat:"none",side_value:1});
    made++;
  }
  if(made)warn("boons 只有 "+(CONTENT.boons.length-made)+" 筆（合約 "+TARGET.boons+"），引擎衍生補上 "+made+" 筆");
  // pods → 10 筆（以既有艙為基底遞增，解鎖一律 depth）
  made=0;
  var basePods=CONTENT.pods.slice();
  for(i=CONTENT.pods.length;i<TARGET.pods;i++){
    var bp=basePods[i%basePods.length],kk=i-basePods.length+1;
    var th2=clamp(bp.thrust+6*kk,180,360);
    CONTENT.pods.push({id:"auto_pod_"+i,name:"衍生喵艙 "+kk,desc:"引擎衍生的備用艙",
      mass:clamp(bp.mass+0.03*kk,0.7,1.6),tank:clamp(bp.tank+4*kk,60,160)|0,thrust:th2,
      side_thrust:Math.min(clamp(bp.side_thrust+3*kk,40,140),th2*0.4),
      hull:clamp(bp.hull,1,4)|0,soft_limit:clamp(bp.soft_limit+0.04*kk,1,2.2),
      hull_color:bp.hull_color,shape:bp.shape,unlock_type:"depth",unlock_value:clamp(15+8*kk,0,500)|0});
    made++;
  }
  if(made)warn("pods 只有 "+(CONTENT.pods.length-made)+" 筆（合約 "+TARGET.pods+"），引擎衍生補上 "+made+" 筆");
}

// ===== 存檔 =====
var KEY="sc_jelly_pod_well_v1";
var SAVE={best:0,bestDepth:0,fish:0,hangar:{tank:0,thrust:0,hull:0,magnet:0},pods:[],podSelected:"",
  stats:{landings:0,perfect:0,maxCombo:0,runs:0},daily:{date:"",best:0,streak:0,last:""},mute:false};
function loadSave(){
  try{ var s=localStorage.getItem(KEY); if(s){ var o=JSON.parse(s);
    if(o&&typeof o==="object"){
      SAVE.best=+o.best||0; SAVE.bestDepth=+o.bestDepth||0; SAVE.fish=+o.fish||0;
      if(o.hangar)["tank","thrust","hull","magnet"].forEach(function(k){SAVE.hangar[k]=clamp(o.hangar[k]||0,0,5)|0;});
      SAVE.pods=Array.isArray(o.pods)?o.pods.filter(function(x){return typeof x==="string";}):[];
      SAVE.podSelected=o.podSelected||"";
      if(o.stats)["landings","perfect","maxCombo","runs"].forEach(function(k){SAVE.stats[k]=+o.stats[k]||0;});
      if(o.daily)SAVE.daily={date:o.daily.date||"",best:+o.daily.best||0,streak:+o.daily.streak||0,last:o.daily.last||""};
      SAVE.mute=!!o.mute;
    }}}catch(e){}
  muted=SAVE.mute;
  var def=CONTENT.pods.filter(function(p){return p.unlock_type==="default";})[0]||CONTENT.pods[0];

}

function zone(g){ return CONTENT.zones[Math.min(g.zoneIdx,CONTENT.zones.length-1)]||CONTENT.zones[0]; }
// 循環區加壓：每循環 gravity+5%、寬度-5px、gust+1
function zoneTuned(g){
  var z=zone(g),L=g.loop;
  if(!L)return z;
  return {id:z.id,name:z.name+(L?" ×"+(L+1):""),order:z.order,pads:z.pads,

    gust_rate:Math.min(8,z.gust_rate+L),pad_width:[Math.max(60,z.pad_width[0]-5*L),Math.max(66,z.pad_width[1]-5*L)],
    pad_types:z.pad_types,fuel_pickup_rate:z.fuel_pickup_rate,wall_gap:z.wall_gap,heat:z.heat,
    twin_rate:z.twin_rate,intro:z.intro};
}

// 生成下一座墊（含雙墊、魚乾罐、牆縫橫梁）
function spawnPad(g){
  var z=zoneTuned(g),r=g.rng;
  var idx=g.pads.length?g.pads[g.pads.length-1].depth+1:1;
  var mk=function(xr,wmul,mult){
    var tid=z.pad_types[Math.floor(r()*z.pad_types.length)%z.pad_types.length];
    var pt=CONTENT.pads[tid]||CONTENT.padList[0];
    var w=clamp(lerp(z.pad_width[0],z.pad_width[1],r())*wmul,60,180);
    var x=clamp(xr,40+w/2,W-40-w/2);
    return {type:pt,x:x,x0:x,w:w,w0:w,y:g.nextY,y0:g.nextY,depth:idx,phase:r()*6.28,
      dead:false,used:false,mult:mult,sinkAmt:0,visible:true,tilt:0,broken:0};
  };
  var twin=(r()<z.twin_rate)&&idx>3;
  if(twin){
    var big=mk(110+r()*40,1.0,1.0); var small=mk(280+r()*40,0.6,2.2);
    small.isSmall=true; g.pads.push(big,small);
  }else{
    g.pads.push(mk(60+r()*(W-120),1.0,1.0));
  }
  // 魚乾罐（在墊上方 100~170px，偏離 40~80px）
  if(r()<z.fuel_pickup_rate){
    var base=g.pads[g.pads.length-1];
    g.cans.push({x:clamp(base.x+(r()<0.5?-1:1)*(40+r()*40),45,W-45),y:g.nextY-110-r()*60,got:false,ph:r()*6.3});
  }
  // 牆縫橫梁（致死，但提前可見）
  if(z.wall_gap>0&&idx%2===0){
    var gap=z.wall_gap, gx=clamp(60+r()*(W-120),40+gap/2,W-40-gap/2);
    g.beams.push({y:g.nextY-190,gx:gx,gap:gap});
  }
  g.nextY+=200+Math.floor(r()*40);
}

// ===== 物理與局流程 =====
var FIXED=1/120;
var VY_UP=150;    // 上升速度上限（px/s）
var VY_DOWN=1400; // 落速上限（px/s）
var CEIL_GAP=240; // 井口天花板：距目前下潛進度最多往上爬這麼多 px
function step(g,dt){
  var z=zoneTuned(g);
  var inp=readInput();
  g.elapsed+=dt;
  // 過熱系統
  if(z.heat){
    if(g.overheat>0){ g.overheat-=dt; if(g.overheat<=0){g.overheat=0;g.heat=0;} }
    else if(inp.thrust&&g.fuel>0){ g.heat+=40*dt; if(g.heat>=100*g.mods.heat_cap){ g.overheat=1.2; SFX.heat(); burst(g,g.x,g.y+10,10,"#ff7a5a"); } }
    else g.heat=Math.max(0,g.heat-60*dt);
  }else{ g.heat=Math.max(0,g.heat-80*dt); g.overheat=0; }
  var canThrust=g.fuel>0&&g.overheat<=0;
  var th=inp.thrust&&canThrust?1:0;
  var sd=canThrust?inp.side:0; // 沒油／過熱時側噴一併失效，不再有免費水平推力
  // 噴射音
  if(th&&!muted&&scene==="play")jetOn(); else if(!th)jetOff();
  // 燃料
  if(th)g.fuel-=6*dt;
  if(sd&&g.fuel>0)g.fuel-=2*Math.abs(sd)*dt;
  if(g.fuel<0)g.fuel=0;
  // 風（陣風：預告 1 秒 → 1 秒升到 wind_max → 退回）
  if(z.wind_max>0){
    g.gustNext-=dt;
    if(g.gustWarn>0){ g.gustWarn-=dt; if(g.gustWarn<=0){ g.gust=1.6; g.windTarget=z.wind_max*g.gustDir; } }
    else if(g.gust>0){ g.gust-=dt; if(g.gust<=0)g.windTarget=z.wind_max*0.25*g.gustDir; }
    else if(g.gustNext<=0&&z.gust_rate>0){ g.gustWarn=1.0; g.gustDir=g.rng()<0.5?-1:1; g.gustNext=60/z.gust_rate; }
    if(g.windTarget===0)g.windTarget=z.wind_max*0.25*(g.rng()<0.5?-1:1);
  }else{ g.windTarget=0; g.gustWarn=0; g.gust=0; }
  g.wind=lerp(g.wind,g.windTarget/g.mods.wind_resist,Math.min(1,dt*2.4));
  // 加速度
  var m=g.pod.mass;
  var ay=z.gravity-(th?(g.pod.thrust*g.mods.thrust)/m:0);
  var ax=(sd*(g.pod.side_thrust*g.mods.side))/m+g.wind;
  g.vy+=ay*dt; g.vx+=ax*dt;
  // 速度上下界：長按噴射最多以 VY_UP 上升，落速也不會爆表
  if(g.vy<-VY_UP)g.vy=-VY_UP; else if(g.vy>VY_DOWN)g.vy=VY_DOWN;
  g.vx*=Math.pow(0.98,dt*60);
  g.y+=g.vy*dt; g.x+=g.vx*dt;
  // 井口天花板：只跟著下潛進度往下走，最多往上爬 CEIL_GAP，杜絕無限滯空
  if(g.y<g.ceilY){ g.y=g.ceilY; if(g.vy<0)g.vy=0; }
  else if(g.y-CEIL_GAP>g.ceilY)g.ceilY=g.y-CEIL_GAP;
  // 撞牆：反彈（不致死）
  if(g.x<46){ g.x=46; g.vx=Math.abs(g.vx)*0.4; }
  if(g.x>W-46){ g.x=W-46; g.vx=-Math.abs(g.vx)*0.4; }
  // 噴射粒子
  if(th&&Math.random()<dt*70)burst(g,g.x+(Math.random()-0.5)*10,g.y+14,1,"#ffd27a",1);
  if(sd&&Math.random()<dt*35)burst(g,g.x-sd*12,g.y,1,"#a9e6ff",1);
  // 墊子行為
  for(var i=0;i<g.pads.length;i++)updatePad(g,g.pads[i],dt);
  // 魚乾罐（磁吸）
  for(var c=0;c<g.cans.length;c++){
    var can=g.cans[c]; if(can.got)continue; can.ph+=dt*3;
    var d=Math.hypot(can.x-g.x,can.y-g.y);
    if(d<22+g.mods.magnet){ can.got=true; g.fuel=Math.min(g.tankMax,g.fuel+14); g.fishRun+=3;
      SFX.can(); burst(g,can.x,can.y,10,"#ffd27a"); floatTxt(g,can.x,can.y,"+3 魚乾","#ffd27a"); }
  }
  // 橫梁致死判定
  for(var b=0;b<g.beams.length;b++){
    var bm=g.beams[b];
    if(g.y+14>bm.y-6&&g.y-14<bm.y+6){
      if(g.x<bm.gx-bm.gap/2+10||g.x>bm.gx+bm.gap/2-10){ return boom(g,"撞上橫梁"); }
    }
  }
  // 觸地裁決
  for(var p2=0;p2<g.pads.length;p2++){
    var pd=g.pads[p2];
    if(pd.used||pd.dead||!pd.visible)continue;
    if(g.y+14>=pd.y&&g.y+14<=pd.y+26&&g.vy>0){
      var half=pd.w/2+3; // 判定比視覺寬 6px
      var off=Math.abs(g.x-pd.x);
      var limit=pd.type.motion==="tilt"?half*0.6:half;
      if(off<=limit){ return judgeLand(g,pd,off,half); }
    }
  }
  // 掉太深（無墊接住）→ 井底
  if(g.pads.length&&g.y>g.pads[g.pads.length-1].y+600)return boom(g,"墜入井底");
  // 生成更多墊
  while(g.nextY<g.y+1400)spawnPad(g);
  // 清掉上方過期物件
  g.pads=g.pads.filter(function(o){return o.y>g.y-400;});
  g.cans=g.cans.filter(function(o){return o.y>g.y-400;});
  g.beams=g.beams.filter(function(o){return o.y>g.y-400;});
  // 沒油且速度超標的提示心跳
  if(g.fuel/g.tankMax<0.25){ g.beatT=(g.beatT||0)+dt; if(g.beatT>0.62){g.beatT=0;SFX.beat();} }
}
function updatePad(g,pd,dt){
  pd.phase+=dt;
  var t=pd.type;
  if(t.motion==="slide"){ pd.x=clamp(pd.x0+Math.sin(pd.phase*(t.speed/40))*t.amplitude,40+pd.w/2,W-40-pd.w/2); }
  else if(t.motion==="sink"){ if(pd.trig){ pd.sinkAmt=Math.min(t.amplitude,pd.sinkAmt+t.speed*dt); pd.y=pd.y0+pd.sinkAmt; }
    else if(Math.abs(g.y-pd.y)<260){ pd.trig=true; } }
  else if(t.motion==="shrink"){ if(Math.abs(g.y-pd.y)<300){ pd.w=Math.max(60,pd.w0-Math.min(t.amplitude,(pd.shr=(pd.shr||0)+t.speed*dt))); } }
  else if(t.motion==="blink"){ var per=Math.max(1.2,t.amplitude/10); pd.visible=(pd.phase%per)<per*0.62; }
  else if(t.motion==="tilt"){ pd.tilt=Math.sin(pd.phase*0.8)*(t.amplitude*Math.PI/180)*0.5; }
  if(pd.broken>0)pd.broken+=dt;
}
function judgeLand(g,pd,off,half){
  var soft=g.pod.soft_limit*pd.type.soft_mult*g.mods.soft_window;
  var spd=g.vy/60; // 轉成 m/s 顯示刻度
  var grade = spd<=soft?"green":(spd<=soft*1.8?"yellow":"red");
  pd.used=true; g.lastJudge={grade:grade,speed:spd,offset:off/half,soft:soft};
  if(grade==="red")return boom(g,"落速 "+spd.toFixed(1)+" 太快",spd,soft);
  // 計分
  var prec=lerp(2.0,1.0,clamp(off/half,0,1));
  var fuelRatio=clamp(g.fuel/g.tankMax,0,1);
  var mult=pd.type.score_mult*pd.mult;
  var gain=100*mult*prec*(grade==="green"?1.5:0.5)*(1+fuelRatio)*(1+0.1*g.combo)*g.mods.score_mult;
  var perfect=(off/half<0.1&&spd<soft*0.5&&grade==="green");
  if(perfect){ gain+=200; g.perfectRun++; }
  gain=Math.round(gain);
  g.score+=gain; g.landings++; g.depth=pd.depth;
  if(SAVE.bestDepth<g.depth)SAVE.bestDepth=g.depth;
  // 外殼／連段
  if(grade==="green"){ g.combo++; if(g.combo>g.maxCombo)g.maxCombo=g.combo;
    g.fuel=Math.min(g.tankMax,g.fuel+20*prec*g.mods.fuel_refund); }
  else { g.combo=0; g.hull--; }
  // 演出
  g.x=pd.x*0.25+g.x*0.75; g.vy=0; g.vx*=0.2; g.phase="landed"; g.landT=0.8; g.squash=1;
  jetOff();
  if(grade==="green"){
    SFX.green(); burst(g,g.x,pd.y,14,pd.type.color);
    floatTxt(g,g.x,pd.y-28,"+"+fmt(gain),"#8ef0a8");
    if(perfect){ SFX.perfect(); shake=6; g.rings.push({x:g.x,y:pd.y,r:10,life:0.7,c:"#ffe27a"});
      floatTxt(g,g.x,pd.y-56,"完美著陸！+200","#ffe27a"); flash={c:"#ffe27a",a:0.18}; }
    if(g.combo>=3)floatTxt(g,g.x+52,pd.y-44,"連段 ×"+g.combo,"#9fd8ff");
  }else{
    SFX.yellow(); shake=9; burst(g,g.x,pd.y,18,"#ffc46b");
    floatTxt(g,g.x,pd.y-28,"硬著陸 +"+fmt(gain),"#ffc46b");
    floatTxt(g,g.x,pd.y-50,"外殼 -1","#ff8f8f");
  }
  // 落速數字（常駐 near-miss）
  var gc=grade==="green"?"#8ef0a8":"#ffc46b";
  floatTxt(g,g.x+58,pd.y-6,spd.toFixed(1)+" / "+soft.toFixed(1),gc,1.4);
  if(grade==="yellow")floatTxt(g,g.x+58,pd.y+14,"差 "+(spd-soft).toFixed(1)+" 就是軟著陸","#ffd9a0",1.6);
  SAVE.stats.landings++; if(perfect)SAVE.stats.perfect++;
  if(g.maxCombo>SAVE.stats.maxCombo)SAVE.stats.maxCombo=g.maxCombo;
  checkUnlocks(g);
  if(g.hull<=0)return boom(g,"外殼碎裂");
  // 進區／循環
  g.zoneLeft--;
  if(g.zoneLeft<=0){
    if(g.zoneIdx<CONTENT.zones.length-1){ g.zoneIdx++; g.zoneLeft=zone(g).pads; }
    else { g.loop++; g.zoneLeft=zone(g).pads; }
    var zz=zoneTuned(g); g.introT=2.2; g.introTxt=zz.name+"　"+zz.intro;
  }
  return null;
}
function boom(g,reason,spd,soft){
  if(g.over)return null;
  g.over=true; g.phase="boom"; g.overReason=reason; jetOff();
  if(spd!=null&&soft!=null)g.missTxt="差 "+(spd-soft).toFixed(1)+" m/s 就是軟著陸";
  SFX.boom(); shake=18; burst(g,g.x,g.y,46,"#ff7a5a"); burst(g,g.x,g.y,22,"#ffd27a");
  flash={c:"#ff7a5a",a:0.3};
  setTimeout(function(){ endRun(g); },520);
  return "over";
}
function endRun(g){
  if(g.ended)return; g.ended=true;
  g.gainFish=Math.floor(g.score/100)+g.fishRun;
  SAVE.fish+=g.gainFish; SAVE.stats.runs++;
  g.newRecord=g.score>SAVE.best;
  if(g.newRecord)SAVE.best=Math.round(g.score);
  if(g.daily){
    var t=todayStr();
    if(SAVE.daily.date!==t){
      var y=new Date(Date.now()-86400000); var ys=y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();
      SAVE.daily.streak=(SAVE.daily.date===ys)?SAVE.daily.streak+1:1;
      SAVE.daily.date=t; SAVE.daily.best=0;
    }
    if(g.score>SAVE.daily.best)SAVE.daily.best=Math.round(g.score);
  }
  checkUnlocks(g); save();
  scene="over"; overT=0;
  if(g.newRecord)SFX.record();
  if(!g.reported){ g.reported=true; if(window.SC&&SC.over)SC.over(Math.round(g.score)); }
}
// 艙體解鎖檢查
function checkUnlocks(g){
  var got=[];
  CONTENT.pods.forEach(function(p){
    if(SAVE.pods.indexOf(p.id)>=0||p.unlock_type==="default")return;
    var v=0;
    if(p.unlock_type==="depth")v=Math.max(SAVE.bestDepth,g?g.depth:0);
    else if(p.unlock_type==="combo")v=Math.max(SAVE.stats.maxCombo,g?g.maxCombo:0);
    else if(p.unlock_type==="fish")v=SAVE.fish;
    else if(p.unlock_type==="daily_streak")v=SAVE.daily.streak;
    else if(p.unlock_type==="perfect_count")v=SAVE.stats.perfect;
    if(v>=p.unlock_value){ SAVE.pods.push(p.id); got.push(p); }
  });
  if(got.length){ got.forEach(function(p){ toast("新艙體解鎖！"+p.name); }); SFX.unlock(); save(); }
}
function unlockProgress(p){
  if(p.unlock_type==="default")return 1;
  var v=0;
  if(p.unlock_type==="depth")v=SAVE.bestDepth; else if(p.unlock_type==="combo")v=SAVE.stats.maxCombo;
  else if(p.unlock_type==="fish")v=SAVE.fish; else if(p.unlock_type==="daily_streak")v=SAVE.daily.streak;
  else if(p.unlock_type==="perfect_count")v=SAVE.stats.perfect;
  return {v:v,need:p.unlock_value,r:clamp(v/Math.max(1,p.unlock_value),0,1)};
}

// ===== 肉球卡 =====
function drawCards(g){
  if(!CONTENT.boons.length)return null;
  var pool=CONTENT.boons.filter(function(b){ return (g.owned[b.id]||0)<b.max_stack; });
  if(!pool.length)return null;
  var wt={common:70,rare:25,legendary:5},out=[],used={};
  for(var n=0;n<3;n++){
    var avail=pool.filter(function(b){return !used[b.id];});
    if(!avail.length){ avail=pool.filter(function(b){return b.rarity==="common";}); if(!avail.length)avail=pool; }
    var tot=0; avail.forEach(function(b){tot+=wt[b.rarity]||70;});
    var r=g.rng()*tot,pickd=avail[0];
    for(var i=0;i<avail.length;i++){ r-=(wt[avail[i].rarity]||70); if(r<=0){pickd=avail[i];break;} }
    out.push(pickd); used[pickd.id]=1;
  }
  return out;
}
function applyStat(g,stat,mode,val){
  if(stat==="none")return;
  var M=g.mods;
  if(stat==="hull"){ var add=mode==="add"?Math.round(val):0; g.hullMax=clamp(g.hullMax+add,1,6); g.hull=clamp(g.hull+add,0,g.hullMax); return; }
  if(stat==="magnet"){ M.magnet+= mode==="add"?val:(val-1)*40; return; }
  if(M[stat]==null)return;
  if(mode==="mul")M[stat]*=val; else M[stat]+=val/100;
  if(stat==="tank"){ var old=g.tankMax; g.tankMax=g.pod.tank*M.tank; g.fuel=Math.min(g.tankMax,g.fuel*(g.tankMax/Math.max(1,old))); }
  if(stat==="heat_cap")M.heat_cap=clamp(M.heat_cap,0.5,3);
}
function chooseCard(i){
  var g=G; if(!g||!g.cards||!g.cards[i])return;
  var b=g.cards[i];
  g.owned[b.id]=(g.owned[b.id]||0)+1;
  applyStat(g,b.stat,b.mode,b.value);
  if(b.side_stat!=="none")applyStat(g,b.side_stat,b.side_value<=1&&b.side_value>0?"mul":"add",b.side_value);
  SFX.pick(); toast(b.name+"："+b.desc);
  floatTxt(g,W/2,320,b.name,"#ffe27a",1.6);
  g.cards=null; g.phase="fall"; g.cardT=0;
}

function burst(g,x,y,n,c,small){
  for(var i=0;i<n;i++){
    var a=Math.random()*6.283,s=(small?30:60)*(0.3+Math.random());
    g.parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(small?40:0),life:small?0.35:0.5+Math.random()*0.4,t:0,c:c,r:small?2:2+Math.random()*3});
  }
  if(g.parts.length>360)g.parts.splice(0,g.parts.length-360);
}
function floatTxt(g,x,y,txt,c,life){ g.floats.push({x:x,y:y,txt:txt,c:c,life:life||1.1,t:0}); if(g.floats.length>24)g.floats.shift(); }
function toast(txt){ uiToasts.push({txt:txt,t:0,life:2.2}); if(uiToasts.length>4)uiToasts.shift(); }
function fxStep(g,dt){
  for(var i=g.parts.length-1;i>=0;i--){ var p=g.parts[i]; p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=180*dt; if(p.t>=p.life)g.parts.splice(i,1); }
  for(var j=g.floats.length-1;j>=0;j--){ var f=g.floats[j]; f.t+=dt; f.y-=22*dt; if(f.t>=f.life)g.floats.splice(j,1); }
  for(var k=g.rings.length-1;k>=0;k--){ var r=g.rings[k]; r.t=(r.t||0)+dt; r.r+=190*dt; if(r.t>=r.life)g.rings.splice(k,1); }
  if(g.squash)g.squash=Math.max(0,g.squash-dt*3);
}

// 井壁
function drawWell(g,off){
  ctx.fillStyle="#0a0d18"; ctx.fillRect(0,0,W,H);
  var z=zoneTuned(g),hue=(z.order*47)%360;
  // 背景漸層（依區變色）
  var bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,"hsl("+hue+",32%,9%)"); bg.addColorStop(1,"hsl("+((hue+40)%360)+",38%,5%)");
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  // 磚紋（隨深度捲動）
  ctx.strokeStyle="hsla("+hue+",40%,40%,.16)"; ctx.lineWidth=1;
  var step=48, base=-((off%step)+step)%step;
  for(var y=base;y<H;y+=step){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(30,y); ctx.moveTo(W-30,y); ctx.lineTo(W,y); ctx.stroke(); }
  ctx.fillStyle="hsla("+hue+",35%,16%,1)"; ctx.fillRect(0,0,30,H); ctx.fillRect(W-30,0,30,H);
  ctx.fillStyle="hsla("+hue+",45%,30%,.6)"; ctx.fillRect(28,0,2,H); ctx.fillRect(W-30,0,2,H);
  // 風粒子
  if(Math.abs(g.wind)>1){

function drawPad(g,pd,off){

function drawPod(g,off){
  var y=g.y-off,x=g.x;

  var sx=1+sq*0.5, sy=1-sq*0.35;
  var soft=g.pod.soft_limit*g.mods.soft_window, spd=g.vy/60;
  var glow = g.over?"#ff7a5a":(spd<=soft?"#7bf0a0":(spd<=soft*1.8?"#ffc46b":"#ff7a5a"));

  else if(s==="drop"){ ctx.moveTo(0,-R*1.15); ctx.quadraticCurveTo(R,-R*0.2,0,R); ctx.quadraticCurveTo(-R,-R*0.2,0,-R*1.15); }
  else if(s==="star"){ for(var i=0;i<10;i++){ var a=-Math.PI/2+i*Math.PI/5,rr2=i%2?R*0.5:R; ctx.lineTo(Math.cos(a)*rr2,Math.sin(a)*rr2); } ctx.closePath(); }
  else ctx.arc(0,0,R,0,6.3);

  ctx.strokeStyle=glow; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(0,1,3,0.2,Math.PI-0.2); ctx.stroke();

  ctx.beginPath(); ctx.moveTo(11,-11); ctx.lineTo(6,-20); ctx.lineTo(2,-12); ctx.closePath(); ctx.fill();
  ctx.restore();

  if(g.overheat>0){

// ===== 畫面：標題／機庫／圖鑑／Game Over =====

  btn(menuBtns,W/2+4,510,86,34,"圖鑑",function(){scene="codex";},"#4a3a6a");

    else if(p.shape==="star"){for(var k=0;k<10;k++){var a=-Math.PI/2+k*Math.PI/5,r2=k%2?5.5:12;ctx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);}ctx.closePath();}
    else ctx.arc(0,0,12,0,6.3);

    txt(p.name.slice(0,6),x+cw/2,y+58,11,un?"#eaf3ff":"#8a94a8","center",true);
    if(un){ txt("油"+p.tank+"｜殼"+p.hull,x+cw/2,y+74,10,"#9fb6d8","center");
      txt("綠 ≤"+p.soft_limit.toFixed(1),x+cw/2,y+88,10,"#7bf0a0","center");
      codexBtns.push({x:x+4,y:y,w:cw-8,h:chh-8,fn:(function(id){return function(){ SAVE.podSelected=id; save(); SFX.pick(); };})(p.id)});

  txt("總落地 "+SAVE.stats.landings+"　完美 "+SAVE.stats.perfect+"　最長連段 "+SAVE.stats.maxCombo+"　局數 "+SAVE.stats.runs,W/2,486,11,"#7f95b8","center");
  btn(codexBtns,W/2-70,506,140,40,"返回",function(){scene="title";},"#2a4a7a");
}

  txt(g.newRecord?"🏆 新紀錄！":"艙體報銷",W/2,96,g.newRecord?30:26,g.newRecord?"#ffd27a":"#ff9a9a","center",true);
  if(g.newRecord){ // 破紀錄慶祝彩帶
    for(var i=0;i<3;i++)burst(g,W/2+(Math.random()-0.5)*220,110+Math.random()*40,1,["#ffd27a","#7bf0a0","#9fd8ff"][i%3],1);

  if(nl)txt("機庫還差 "+mg+" 魚乾就能升「"+nl.name+"」",W/2,548,11,"#ffd27a","center");

// ===== 主迴圈（固定步長） =====
var last=0,accT=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!last)last=ts;
  var dt=(ts-last)/1000; last=ts;
  if(dt>0.25)dt=0.25; // 分頁切回不快轉
  ctx.save();
  if(shake>0){ ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake); shake=Math.max(0,shake-dt*40); }
  if(scene==="title")drawTitle(dt);
  else if(scene==="hangar")drawHangar();
  else if(scene==="codex")drawCodex();
  else if(scene==="play")playFrame(dt);
  else if(scene==="over")drawOver(dt);
  ctx.restore();
  // 全螢幕閃光
  if(flash){ ctx.fillStyle=flash.c; ctx.globalAlpha=flash.a; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;
    flash.a-=dt*1.2; if(flash.a<=0)flash=null; }
  // toast 計時
  for(var i=uiToasts.length-1;i>=0;i--){ uiToasts[i].t+=dt; if(uiToasts[i].t>=uiToasts[i].life)uiToasts.splice(i,1); }
}
function playFrame(dt){
  var g=G; if(!g)return;
  // 狀態機
  if(g.phase==="choose"){ g.cardT+=dt; }
  else if(g.phase==="landed"){
    g.landT-=dt;
    // 墊子裂開演出
    var lp=g.pads.filter(function(p){return p.used&&!p.broken;})[0];
    if(lp&&g.landT<0.45){ lp.broken=0.001; burst(g,lp.x,lp.y,10,lp.type.color); }
    if(g.landT<=0){
      // 每 4 層抽卡
      if(g.landings>0&&g.landings%4===0&&CONTENT.boons.length){
        var cards=drawCards(g);
        if(cards){ g.cards=cards; g.phase="choose"; g.cardT=0;
          SFX.card(); if(cards.some(function(c){return c.rarity==="legendary";}))SFX.legend(); }
        else g.phase="fall";
      } else g.phase="fall";
      if(g.phase==="fall"){ g.vy=20; }
    }
  }
  else if(g.phase==="fall"){
    // 固定步長累積器（決定論）
    accT+=dt; var guard=0;
    while(accT>=FIXED&&guard<20){ accT-=FIXED; guard++;
      if(step(g,FIXED)==="over")break; }
    if(accT>FIXED*20)accT=0;
    // 首次出現墊型提示
    var z=zoneTuned(g);
    for(var i=0;i<g.pads.length;i++){
      var pt=g.pads[i].type;
      if(!g.padHintSeen[pt.id]&&pt.hint&&g.pads[i].y-g.y<520){ g.padHintSeen[pt.id]=1; g.hintTxt=pt.name+"："+pt.hint; g.hintT=2.4; }
    }
  }
  else if(g.phase==="boom"){ /* 等 endRun */ }
  if(g.introT>0)g.introT-=dt;
  if(g.hintT>0)g.hintT-=dt;
  fxStep(g,dt);
  // 繪製
  camY=g.y-POD_Y;
  drawWell(g,camY);
  g.beams.forEach(function(b){
    var y=b.y-camY; if(y<-20||y>H+20)return;
    ctx.fillStyle="#5a4a6a"; ctx.fillRect(30,y-6,b.gx-b.gap/2-30,12); ctx.fillRect(b.gx+b.gap/2,y-6,W-30-(b.gx+b.gap/2),12);
    ctx.fillStyle="rgba(255,120,120,.5)";
    ctx.fillRect(30,y-8,Math.max(0,b.gx-b.gap/2-30),2); ctx.fillRect(b.gx+b.gap/2,y-8,Math.max(0,W-30-(b.gx+b.gap/2)),2);
  });
  g.cans.forEach(function(c){
    if(c.got)return; var y=c.y-camY; if(y<-20||y>H+20)return;
    var bob=Math.sin(c.ph)*3;
    ctx.save(); ctx.translate(c.x,y+bob);
    ctx.shadowColor="#ffd27a"; ctx.shadowBlur=10; ctx.fillStyle="#ffd27a";
    rr(-8,-10,16,20,4); ctx.fill(); ctx.shadowBlur=0;
    ctx.fillStyle="#7a5a2a"; ctx.fillRect(-8,-3,16,3);
    txt("🐟",0,5,11,"#7a5a2a","center");
    ctx.restore();
  });
  g.pads.forEach(function(p){ if(!p.broken||p.broken<0.25)drawPad(g,p,camY); else{
    // 裂開：左右兩半飛開
    var y=p.y-camY,o=(p.broken-0.25)*160;
    ctx.fillStyle=p.type.color; ctx.globalAlpha=clamp(1-(p.broken-0.25)*2,0,1);
    rr(p.x-p.w/2-o,y+o*0.4,p.w/2-4,11,5); ctx.fill();
    rr(p.x+4+o,y+o*0.4,p.w/2-4,11,5); ctx.fill(); ctx.globalAlpha=1;
  }});
  if(!g.over||g.phase!=="boom"||g.parts.length)drawPod(g,camY);
  drawRunFX(g,camY);
  drawHUD(g);
  if(g.phase==="choose"&&g.cards)drawCardsUI(g);
}

// ===== 啟動 =====
try{
  loadContent(); loadSave(); resize();

}catch(err){

    txt(String(err&&err.message||err).slice(0,40),W/2,310,12,"#ffc9c9","center");

}
window.addEventListener("error",function(e){ e.preventDefault&&e.preventDefault(); });
})();
