<!--CONTENT-NOTES
引擎只從 window.SC_CONTENT 讀四個包；缺欄位給預設值、數值自動 clamp。
跨包 id 引用錯誤會「自動修正並 console.warn」（略過該鎖／該貓、未知環型改用基礎環），
只有「沒有任何可玩的罐頭塔」才 console.error 並阻擋開始。請確保所有引用 id 都存在。

【ring_types】環型（建議 5～8 筆，沒有時引擎補一個錫環）
- id：唯一字串（重複者略過）
- name：繁中名稱（新環型提示會顯示）
- steps_per_tap：整數 0～3（0＝冰封環：點了只會抖動，只能被連動帶動）
- direction：both｜cw｜ccw（cw＝點左右半都順時針；ccw＝都逆時針）；其他值視為 both
- gaps：1～2；gap_offset：gaps=2 時 1～11（第二缺口＝第一缺口位置＋gap_offset），gaps=1 時忽略
- color：#rgb 或 #rrggbb；glyph：取第 1 個字元，畫在環上（空字串＝畫鉚釘）
- tip：本局第一次出現時顯示在上方（建議 ≤14 字）
- 必須至少有一筆 steps_per_tap=1、direction=both、gaps=1 的基礎環（未知環型會替換成它）

【lock_blueprints】鎖型（建議 ≤30 筆）
- id、name、tip（可空，本局首次出現時顯示）
- rings：環型 id 陣列，外→內，長度 2～5（多的截斷、少的補基礎環）
- positions：每環格數 4～16（建議 6/8/10/12）；positions^環數 > 300000 時引擎自動遞減格數
- links：[{from,to,sign}]，from/to 為 rings 索引（0＝最外），sign 1 或 -1；from==to 或越界者略過；
  沿鏈傳遞、每環每次最多帶動一次（A→B→C→A 環鏈可用，但全部 sign=1 的環鏈會讓三環永遠同轉，建議放一條 -1）
- scramble：[min,max] 亂轉步數 1～30；min_par：1～20；tier：1～5（僅標籤，引擎不含難度公式）
- 生成：亂轉 30 次找「≥2 環錯位且 BFS par ≥ min_par」，找不到再從可達狀態抽樣；啟動時每鎖型自檢 20 次
- steps_per_tap=0 的環必須是某條 link 的 to，否則它永遠不動

【towers】罐頭塔（建議 ≤12 筆）
- id、name、desc（≤20 字）
- locks：鎖型 id 陣列（建議 8～14；上限 20），不存在的 id 會被略過
- cats：[{at,cat}]，at＝第幾道鎖（1 起算，需 ≤ locks 長度），cat＝cats id
- start_fresh：20～120（建議 45～60 才能保證不操作 60 秒內失敗）
- refill_base：0～40；refill_per_par：0～15（保鮮上限固定 120）
- unlock_stars：0～9999（第一座塔強制 0）；palette：{bg,tin,label} hex；daily：true/false
- 同日每日塔從 daily=true 的塔中以日期為種子挑一座（都沒有就從全部挑）

【cats】圖鑑貓（建議 ≤30 筆）
- id（必須有 cat_default，缺少時引擎補一隻）、name、quip（≤16 字）、lore（≤30 字）
- rarity：common｜rare｜legend；body：hex
- pattern：solid｜stripe｜spot｜tuxedo；eyes：dot｜star｜sleepy；accessory：none｜bow｜crown｜scarf
- 未知 enum 值一律退回第一個選項
-->

   BTN.push({x:16,y,w:368,h:rh,fn:()=>startRun(t,false)});}
  else{T(`🔒 需要 ★ ${t.unlock}`,374,y+rh*.28,fs*.85,'#9aa','right');BTN.push({x:16,y,w:368,h:rh,fn:()=>{AU.play('thud');FX.text(`再收集 ${t.unlock-P.d.total_stars} 顆星解鎖`,200,y+rh/2,'#ffb347',14,1);}});}});
 button(130,546,140,38,'← 返回',()=>go('title'),'#44536a','#fff',16);FX.draw();}
function drawDex(){bgFill('#231c38');const cs=C.list('cats'),got=cs.filter(owned).length;T('喵喵圖鑑',200,38,24,'#fff');T(`收集 ${got}／${cs.length}`,200,64,14,'#ffcf40');
 const cols=4,rows=Math.ceil(cs.length/cols),ch=Math.min(104,410/rows),cw=92,x0=200-cols*cw/2,y0=82;
 cs.forEach((c,i)=>{const cx=x0+(i%cols)*cw+cw/2,ty=y0+Math.floor(i/cols)*ch,o=owned(c),r=Math.min(26,ch*.28),y=ty+ch*.42;
  if(dexSel===i){rr(cx-cw/2+3,ty+2,cw-6,ch-4,10);ctx.fillStyle='rgba(255,255,255,.14)';ctx.fill();}
  drawCat(cx,y,r,c,!o);T(o?c.name:'？？？',cx,y+r+Math.min(14,ch*.2),Math.min(12,ch*.15),o?RC[c.rarity]:'#667');
  BTN.push({x:cx-cw/2,y:ty,w:cw,h:ch,fn:()=>{dexSel=i;AU.play('ui');}});});
 rr(16,498,368,52,10);ctx.fillStyle='rgba(0,0,0,.35)';ctx.fill();const c=cs[dexSel];
 if(c&&owned(c)){T(`${c.name}・${RN[c.rarity]}`,200,512,14,RC[c.rarity]);T(`「${c.quip}」${c.lore}`.slice(0,32),200,534,11,'#dde',undefined,false);}
 else T(c?'還沒遇見這隻貓，去塔的里程碑鎖找找！':'點一隻貓看介紹',200,524,13,'#9fb0c6');
 button(130,558,140,36,'← 返回',()=>go('title'),'#44536a','#fff',16);}
function drawResult(){const r=RES;bgFill(R.tower.pal.bg);ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,0,W,H);
 TS(r.win?'罐頭塔登頂！':'保鮮過期了…',200,78,30,r.win?'#ffe27a':'#ff9d8a');T(R.tower.name+(r.daily?'・每日塔':''),200,110,14,'#cfd8e3');
 const sc=1+(r.rec?.06*Math.sin(time*6):0);ctx.save();ctx.translate(200,170);ctx.scale(sc,sc);TS(fmt(r.shown),0,0,50,'#fff');ctx.restore();
 if(r.rec)TS('🎉 新紀錄！',200,222,24,'#ffcf40');else TS(`差 ${fmt(r.diff)} 分破${r.daily?'今日':'本塔'}紀錄！`,200,222,20,'#ffb347');
 T(`${r.daily?'今日':'本塔'}最佳 ${fmt(Math.max(r.prev,r.score))}　全局最佳 ${fmt(P.d.best_score)}`,200,250,12,'#b8c4d4',undefined,false);
 const N=r.total,gw=Math.min(26,340/N),x0=200-gw*(N-1)/2;
 for(let i=0;i<N;i++){const s=r.stars[i]||0,x=x0+i*gw;ctx.fillStyle=['#3a4658','#c98a4b','#dfe4ea','#ffcf40'][s];rr(x-gw*.38,276,gw*.76,24,4);ctx.fill();T(s?String(s):'·',x,289,12,s?'#222':'#789');}
 T('每道鎖星級',200,312,11,'#9fb0c6',undefined,false);
 if(r.cats.length){T('新收的貓',200,338,13,'#ffcf40');r.cats.forEach((id,i)=>{const c=C.get('cats',id),x=200+(i-(r.cats.length-1)/2)*90;if(c){drawCat(x,380,22,c,false);T(c.name,x,414,11,RC[c.rarity]);}});}
 else T(r.win?'把兩星的鎖刷成三星，衝更高分！':'保鮮只怕發呆和亂點——想好再轉！',200,370,13,'#cfd8e3',undefined,false);
 button(90,440,220,56,'再開一罐',restart,'#ffcf40','#3a2200',24);
 button(60,516,130,36,'選塔',()=>{selT=0;go('select');},'#44536a','#fff',15);button(210,516,130,36,'標題',()=>go('title'),'#44536a','#fff',15);
 T('點任意處或按任意鍵重開',200,576,12,`rgba(255,255,255,${.5+.4*Math.sin(time*4)})`,undefined,false);FX.draw();}
function restart(){if(resT<.4)return;startRun(R.tower,R.daily);}

// ===== input：指標與鍵盤 =====
function toLogic(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
function playTap(x,y){const L=R.L;if(!L)return;const d=Math.hypot(x-CX,y-CY);let best=-1,bd=1e9;
 for(let j=0;j<L.T.n;j++){const g=ringGeo(L.T.n,j);if(d>=g.r0-3&&d<=g.r1+3){const dd=Math.abs(d-(g.r0+g.r1)/2);if(dd<bd){bd=dd;best=j;}}}
 if(best>=0){sel=best;tap(best,x<CX?-1:1);}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();AU.init();const p=toLogic(e);if(e.pointerType!=='mouse'||scene!=='play')usingKB=false;
 for(let i=BTN.length-1;i>=0;i--){const b=BTN[i];if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){b.fn();return;}}
 if(scene==='play'){usingKB=false;playTap(p.x,p.y);}else if(scene==='result')restart();else if(scene==='title'&&!C.errors.length)titleStart();});
cv.addEventListener('pointercancel',()=>{BTN.length=BTN.length;});
window.addEventListener('blur',()=>{usingKB=false;});
window.addEventListener('keydown',e=>{const k=e.key;if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k))e.preventDefault();if(e.repeat)return;AU.init();
 if(k==='m'||k==='M'){AU.toggleMute();return;}
 if(scene==='play'){if(!R.L)return;usingKB=true;const n=R.L.T.n;
  if(k>='1'&&k<='5')sel=Math.min(+k-1,n-1);else if(k==='ArrowUp')sel=Math.max(0,sel-1);else if(k==='ArrowDown')sel=Math.min(n-1,sel+1);
  else if(k==='ArrowLeft')tap(sel,-1);else if(k==='ArrowRight')tap(sel,1);}
 else if(scene==='result')restart();
 else if(scene==='title'){if((k==='Enter'||k===' ')&&!C.errors.length)titleStart();}
 else if(scene==='select'){usingKB=true;const tws=C.list('towers');if(k==='ArrowUp')selT=Math.max(0,selT-1);else if(k==='ArrowDown')selT=Math.min(tws.length-1,selT+1);
  else if(k==='Enter'||k===' '){if(unlocked(tws[selT]))startRun(tws[selT],false);else AU.play('thud');}else if(k==='Escape')go('title');}
 else if(scene==='dex'&&(k==='Escape'||k==='Enter'||k===' '))go('title');});

// ===== 主迴圈（deltaTime，上限 50ms）=====
let last=performance.now();
function frame(now){let dt=(now-last)/1000;last=now;if(!(dt>0))dt=0;if(dt>.05)dt=.05;time+=dt;
 try{FX.update(dt);if(scene==='play')updPlay(dt);else if(scene==='result'){resT+=dt;RES.shown+=(RES.score-RES.shown)*Math.min(1,dt*6);if(Math.abs(RES.score-RES.shown)<1)RES.shown=RES.score;}
  ctx.setTransform(SCL*dpr,0,0,SCL*dpr,0,0);BTN=[];
  if(scene==='play'&&R.L)drawPlay();else if(scene==='select')drawSelect();else if(scene==='dex')drawDex();else if(scene==='result'&&RES)drawResult();else drawTitle();
 }catch(err){console.warn(TAG,err);scene='title';}
 requestAnimationFrame(frame);}

// ===== 品管掛鉤 =====
window.SC_HOOKS={
 start(){if(C.errors.length)return false;const t=C.list('towers')[0];startRun(t,false);return true;},
 snapshot(){return{scene,score:R.score,level:R.idx+1,elapsed:+R.elapsed.toFixed(2),fresh:+R.fresh.toFixed(2),tower:R.tower?R.tower.id:null,locks:R.tower?R.tower.locks.length:0,
  steps:R.steps,budget:R.L?R.L.budget:0,par:R.L?R.L.par:0,pos:R.L?R.L.pos.slice():[],phase:R.phase,streak:R.streak,stars:R.stars.slice(),over:R.over,daily:R.daily,
  total_stars:P.d?P.d.total_stars:0,best_score:P.d?P.d.best_score:0,errors:C.errors.slice()};}};

// ===== 啟動 =====
C.load();P.load();AU.muted=P.d.muted;resize();window.addEventListener('resize',resize);
if(!C.errors.length)selfTest();
requestAnimationFrame(frame);
</script>
