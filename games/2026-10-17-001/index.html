<!--CONTENT-NOTES
《喵窟擋十波》引擎實際支援的內容欄位（缺欄位用預設值、超出範圍自動 clamp；各包長度任意，波數依陣列決定）

【towers】塔卡依陣列順序排在下列（建議 6 筆）
- id string 唯一；name string（兩到三字＋喵）；emoji 一個；color "#rrggbb"
- type enum：single＝單體子彈（可打飛行）／slow＝霧圈：射程內所有地面怪減速＋傷害（飛行免疫，沒有地面怪時不噴）／
  splash＝拋射爆炸，半徑 aux.splash 內地面怪全中（不鎖定也打不到飛行）／chain＝閃電命中後跳到 80px 內最近的下一隻，每跳傷害 ×0.85，可打飛行／
  sniper＝瞬間命中且一律穿盾／income＝不攻擊，每 5 秒產 aux.income 魚乾（第 1 波開始後才產）；其他值視為 single
- unlockWave int 0-99：該波「開始時」解鎖；0＝開局即有。若全包沒有 0，引擎會把最便宜的那筆設為 0
- cost int 1-999；upgradeCost int 陣列，長度＝levels 長度−1（缺項預設 40、70…）；賣出退回總花費 70%
- levels 1-5 筆（建議 3）：range 30-260 像素（安全 50-200）、dmg 0-200（安全 0-60）、rate 0.2-5 發/秒（安全 0.3-3）
  aux：slow 0-0.8、slowDur 0-10 秒、splash 0-150 像素、chain 0-8 跳、income 0-100、pierce bool（true＝無視盾）
- desc 模板：只用 ${range} ${dmg} ${rate} ${period}(=1/rate 秒) ${slow}(百分比整數) ${slowDur} ${splash} ${chain} ${income}；未知變數會變空字串；缺 desc 依 type 用內建模板
- 升級預覽自動列出有變化的數值（傷害、射程、每秒、減速%、減速秒、濺射、連鎖、收益）

【enemies】
- id、name、emoji、color、intro(≤12 字，該怪首次生成時橫幅顯示)
- hp 1-99999；speed 5-200 像素/秒（安全 20-110）；dmg 1-99 到達貓窟扣命；bounty 0-999 魚乾；score 0-9999
- flying bool：免疫 slow 與 splash；shield 0/1：1＝第一次被非穿盾攻擊只碎盾不扣血；shieldRegen 0.5-10 秒（0 會用 3）沒被打就重生
- splitInto 必須是本包 id；splitCount 0-5；分裂出的子體不會再分裂
- introWave 1-99；size 6-30 像素半徑
- 本包 dmg 最大且 ≥5 的一筆視為「王」：hp 低於 50% 時加速 ×1.4；無限波每 5 波額外出一隻

【waves】依 index 排序：index ≤10 為固定波（幾筆就打幾波，全部清除＝通關寫入星等），index ≥11 為無限波樣板（輪流套用；沒有就用最後 4 個固定波）
- groups 1-6 筆 {enemy:id, count 0-60, interval 0.2-10 秒, delay 0-60 秒}；第 1 波固定在開局第 15 秒開始
- reward 0-999 清波魚乾；gapAfter 2-30 秒（最後一隻生成後幾秒自動開下一波）；hpMul 0.3-5；name、note(≤12 字，下一波預告)
- 無限波第 n 波：hp ×1.18^(n−固定波數)、擊殺分同倍率、賞金 ×0.9^(…)（最低 1）、gapAfter 每波 −1（最低 4）
- 提早開波：魚乾與分數各加「剩餘秒數×2」

【maps】
- paths 1-3 筆 {cells:[[col,row]…] 頂點相鄰須同行或同列，col 0-9、row 0-10；fromWave}；paths[0] 一律第 1 波啟用；其他路徑在 fromWave 前兩波畫虛線預告
- 終點格即貓窟；blocked [[col,row]…]（與路徑重疊的格子自動忽略）；未啟用的路徑格也不能蓋塔
- unlockStars 0-999（第一張地圖永遠開放）；startFish 0-9999；lives 1-99；hpMul 0.3-5；star2、star3 分數門檻（通關＝1 星）
- theme 底色 "#rrggbb"；note ≤14 字
【驗證】四包筆數剛好 6/7/14/4 時為嚴格模式：未知 enemy id、未知 splitInto、路徑不相連 → console.error 並阻擋開始；
其他筆數視為樣板測試，改 console.warn 並略過壞資料。
-->

function load(){
  const C=(window.SC_CONTENT&&typeof window.SC_CONTENT==='object')?window.SC_CONTENT:{};
  const arr=k=>Array.isArray(C[k])?C[k]:[];
  const errs=[];
  const towers=arr('towers').map(normTower),enemies=arr('enemies').map(normEnemy),waves=arr('waves').map(normWave),maps=arr('maps').map(normMap);
  const strict=towers.length===6&&enemies.length===7&&waves.length===14&&maps.length===4;
  const eById={};enemies.forEach(e=>eById[e.id]=e);
  enemies.forEach(e=>{if(e.splitInto&&!eById[e.splitInto]){errs.push('enemies.'+e.id+'.splitInto 未知 id：'+e.splitInto);e.splitInto='';}});
  waves.forEach(w=>{w.groups=w.groups.filter(g=>{if(eById[g.enemy])return true;errs.push('waves.'+w.id+' 未知 enemy id：'+(g.enemy||'(空)'));return false;});});
  maps.forEach(m=>{
    if(!m.paths.length){errs.push('maps.'+m.id+' 沒有路徑');m.ok=false;}
    m.paths.forEach((p,k)=>{const c=p.cells;let ok=c.length>=2;
      for(let i=0;i<c.length;i++){const x=c[i][0],y=c[i][1];if(x<0||x>=COLS||y<0||y>=ROWS)ok=false;if(i&&c[i-1][0]!==x&&c[i-1][1]!==y)ok=false;}
      if(!ok){errs.push('maps.'+m.id+'.paths['+k+'] 頂點不相連或越界');m.ok=false;}});
  });
  if(towers.length&&!towers.some(t=>t.unlockWave===0)){let ci=0;towers.forEach((t,i)=>{if(t.cost<towers[ci].cost)ci=i;});towers[ci].unlockWave=0;}
  waves.sort((a,b)=>a.index-b.index);
  let fixed=waves.filter(w=>w.index<=10);if(!fixed.length)fixed=waves.slice();
  let templ=waves.filter(w=>w.index>10);if(!templ.length)templ=fixed.slice(-4);
  let boss=null;enemies.forEach(e=>{if(e.dmg>=5&&(!boss||e.dmg>boss.dmg))boss=e;});
  // 星等門檻依實際可得分校正：最低通關分＋300／＋750，但不超過可達上限
  const val=e=>{const c=e.splitInto&&e.splitCount?eById[e.splitInto]:null;return e.score+(c?c.score*e.splitCount:0);};
  let sum=0,early=0;const used=new Set();
  fixed.forEach((w,k)=>{sum+=CLEAR_SCORE*(k+1);if(k<fixed.length-1)early+=Math.max(0,Math.ceil(w.gapAfter)-1)*2;
    w.groups.forEach(g=>{const e=eById[g.enemy];if(!e||!g.count)return;sum+=val(e)*g.count;used.add(e);});});
  maps.forEach(m=>{
    let rt=0;used.forEach(e=>{if(e.dmg<=m.lives-1)rt=Math.max(rt,val(e)/e.dmg);});
    const lo=sum-(m.lives-1)*rt+LIFE_BONUS,hi=sum+m.lives*LIFE_BONUS+early,span=Math.max(0,hi-lo);
    m.star3=Math.round(Math.min(hi,Math.max(m.star3,lo+Math.min(750,span*0.8))));
    m.star2=Math.round(Math.min(m.star3,Math.max(m.star2,lo+Math.min(300,span*0.4))));
  });
  const fatal=!towers.length||!enemies.length||!fixed.length||!maps.some(m=>m.ok);
  if(!towers.length)errs.push('towers 內容包為空');if(!enemies.length)errs.push('enemies 內容包為空');
  if(!fixed.length)errs.push('waves 內容包為空');if(!maps.length)errs.push('maps 內容包為空');
  const blocked=fatal||(strict&&errs.length>0);
  if(errs.length){if(blocked)console.error('[喵窟] 內容包錯誤，禁止開始：\n'+errs.join('\n'));else console.warn('[喵窟] 內容包警告（已略過壞資料）：\n'+errs.join('\n'));}
  console.log('[喵窟] 內容包載入：towers '+towers.length+'／enemies '+enemies.length+'／waves '+waves.length+'／maps '+maps.length+(blocked?'（有錯誤）':'（成功）'));
  G={towers,enemies,eById,fixed,templ,fixedN:fixed.length,boss,maps,errors:errs,blocked,strict};
}

const particles=[],floats=[],banners=[];let shakeT=0,shakeA=0;
function burst(x,y,color,n,spd){for(let i=0;i<n&&particles.length<600;i++){const a=Math.random()*6.283,v=(spd||120)*(0.3+Math.random());particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0.4+Math.random()*0.4,max:0.8,color,s:2+Math.random()*3,g:0});}}
function confetti(n){const cs=['#ffd34d','#ff7b9a','#7fd8ff','#9dffb0','#c9a0ff'];for(let i=0;i<n&&particles.length<600;i++)particles.push({x:rnd(40,360),y:rnd(90,170),vx:rnd(-70,70),vy:rnd(-120,30),g:160,life:rnd(1.2,2.4),max:2.4,color:cs[i%5],s:rnd(3,6)});}
function floatText(x,y,text,color,size){floats.push({x,y,text,color:color||'#fff',size:size||13,life:1.1,max:1.1});if(floats.length>60)floats.shift();}
function shake(ms,a){shakeT=Math.max(shakeT,ms/1000);shakeA=Math.max(shakeA,a||4);}
function banner(text,icon,ms){banners.push({text,icon:icon||'',life:(ms||1600)/1000,max:(ms||1600)/1000});if(banners.length>4)banners.shift();}
function fxUpdate(dt){
  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;const k=1-(p.g?1:4)*dt;p.vx*=k;if(!p.g)p.vy*=k;p.life-=dt;}
  for(let i=particles.length-1;i>=0;i--)if(particles[i].life<=0)particles.splice(i,1);
  for(const f of floats){f.y-=26*dt;f.life-=dt;}
  for(let i=floats.length-1;i>=0;i--)if(floats[i].life<=0)floats.splice(i,1);
  if(shakeT>0){shakeT-=dt;if(shakeT<=0)shakeA=0;}
  if(banners[0]){banners[0].life-=dt*(banners.length>2?1.7:1);if(banners[0].life<=0)banners.shift();}
}

const cellXY=(c,r)=>({x:c*CELL+CELL/2,y:MAP_Y+r*CELL+CELL/2});
function cellAt(x,y){const c=Math.floor(x/CELL),r=Math.floor((y-MAP_Y)/CELL);return(c>=0&&c<COLS&&r>=0&&r<ROWS)?{c,r}:null;}
function buildMap(M){
  const pc=new Set(),paths=[];
  M.paths.forEach(p=>{
    const pts=p.cells.map(([c,r])=>cellXY(c,r)),seg=[];let len=0;pc.add(p.cells[0][0]+','+p.cells[0][1]);
    for(let i=1;i<p.cells.length;i++){const a=p.cells[i-1],b=p.cells[i],dc=Math.sign(b[0]-a[0]),dr=Math.sign(b[1]-a[1]);let c=a[0],r=a[1];
      while(c!==b[0]||r!==b[1]){c+=dc;r+=dr;pc.add(c+','+r);}const L=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);seg.push(L);len+=L;}
    paths.push({pts,seg,len:Math.max(1,len),from:p.fromWave});
  });
  const blk=new Set(M.blocked.map(b=>b[0]+','+b[1]).filter(k=>!pc.has(k)));
  const holes=[];paths.forEach(p=>{const q=p.pts[p.pts.length-1];if(!holes.some(h=>h.x===q.x&&h.y===q.y))holes.push(q);});
  return{pc,paths,blk,holes};
}
function pathPos(p,d){
  let i=0;while(i<p.seg.length&&d>p.seg[i]){d-=p.seg[i];i++;}
  if(i>=p.seg.length){const q=p.pts[p.pts.length-1];return{x:q.x,y:q.y};}
  const a=p.pts[i],b=p.pts[i+1],k=p.seg[i]?d/p.seg[i]:0;return{x:a.x+(b.x-a.x)*k,y:a.y+(b.y-a.y)*k};
}
function towerAt(c,r){return R.towers.find(t=>t.c===c&&t.r===r)||null;}
function canBuild(c,r){const k=c+','+r;return c>=0&&c<COLS&&r>=0&&r<ROWS&&!R.mp.pc.has(k)&&!R.mp.blk.has(k)&&!towerAt(c,r);}
// 建議的第一座塔位置：周圍路徑格最多的空格
function suggestCell(mp){
  let best=null,bs=-1;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const k=c+','+r;if(mp.pc.has(k)||mp.blk.has(k))continue;let s=0;
    for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++)if(mp.pc.has((c+dc)+','+(r+dr)))s++;if(s>bs){bs=s;best={c,r};}}
  return best;
}

    fishBump:0,lifeBump:0,redFlash:0,upFx:null,beatT:0,deny:null,over:null};
  scene='play';sceneT=0;particles.length=0;floats.length=0;banners.length=0;
  P.save.lastMap=M.id;
  banner(M.name+(M.note?'｜'+M.note:''),'🏰',1800);
}
function restart(){if(R)startRun(R.mi);else startRun(0);}
function end(){
  if(scene!=='play'||!R)return;
  scene='over';sceneT=0;
  const S=P.save,id=R.M.id,final=R.score,rec=final>R.prevBest;
  S.best[id]=Math.max(S.best[id]|0,final);
  S.reach[id]=Math.max(S.reach[id]|0,R.wave);
  if(R.victory)S.endless[id]=Math.max(S.endless[id]|0,R.wave);
  S.runs++;
  const gap3=R.victory?Math.max(0,R.M.star3-R.scoreAtClear):Math.max(0,R.M.star3-final);
  S.lastRun={map:id,wave:R.wave,victory:R.victory,gap3,stars:R.starsGot};
  pSave();
  const sn=streakNow();
  R.over={final,rec,prevBest:R.prevBest,
    l3:R.victory?(R.starsGot>=3?'★★★ 達成！':'差 '+comma(gap3)+' 分拿 ★★★'):'差 '+comma(gap3)+' 分＋再擋 '+(G.fixedN-R.fixedCleared)+' 波拿 ★★★',
    reach:'撐到第 '+R.wave+' 波（最佳 '+S.reach[id]+'）'+(R.victory?'｜無限波最佳 '+S.endless[id]:''),
    streak:R.victory?'🔥 連續 '+sn+' 天通關':(sn?'連勝 '+sn+' 天，今天通關可延續':'每天通關一次，累積連勝天數')};
  sfx(rec?'record':'over');if(rec)confetti(90);shake(300,6);
  try{if (window.SC) SC.over(final);}catch(e){}
}

// ===== waves：排程與提早開波 =====
function startWave(n){
  const Wd=waveDef(n),N=G.fixedN,ex=n>N?n-N:0;R.wave=n;
  const sc={hpS:Wd.hpMul*R.M.hpMul*Math.pow(1.18,ex),bS:ex?Math.pow(0.9,ex):1,sS:Math.pow(1.18,ex)};
  const w=R.waves[n]={left:0,alive:0,done:false};let last=R.t;
  Wd.groups.forEach(g=>{const e=G.eById[g.enemy];if(!e)return;for(let i=0;i<g.count;i++){const at=R.t+g.delay+i*g.interval;R.queue.push({at,e,n,sc,lead:i===0});w.left++;last=Math.max(last,at);}});
  if(ex>0&&ex%5===0&&G.boss){R.queue.push({at:R.t+4,e:G.boss,n,sc,lead:true});w.left++;last=Math.max(last,R.t+4);}
  R.nextWaveAt=last+(ex?Math.max(4,Wd.gapAfter-ex):Wd.gapAfter);
  banner(ex?'無限波 第 '+n+' 波':'第 '+n+' 波｜'+Wd.name,ex?'♾️':'⚔️',1500);sfx('wave');
  G.towers.forEach((T,i)=>{if(T.unlockWave===n){R.unlockFx[i]=1.3;banner(T.name+' 解鎖！'+T.cost+'🐟','🔓',1500);sfx('unlock');}});
  R.mp.paths.forEach(p=>{if(p.from>1&&p.from===n+2)banner('第 '+p.from+' 波開第二入口！','⚠️',1800);if(p.from>1&&p.from===n){banner('第二入口開啟！','⚠️',1600);shake(200,4);}});
  if(n===2&&R.towers[0]){const t=R.towers[0];firstTime('upgrade',()=>hint(t.x,t.y,'點塔可升級',24));}
}
// 第 10 波還沒清完＝等通關：不自動、也不准提早開無限波
function holdFinal(){return R.wave>=G.fixedN&&!R.victory;}
function minCost(){let m=1e9;G.towers.forEach(T=>{if(R.wave>=T.unlockWave)m=Math.min(m,T.cost);});return m;}
function canEarly(){
  if(scene!=='play'||R.nextWaveAt-R.t<=0.5)return false;
  if(R.wave===0)return R.towers.length>0&&R.fish<minCost();   // 開戰前：魚乾花到蓋不起才給「立即開戰」，其餘時間只教放塔
  return R.queue.length===0&&!holdFinal();
}
function callEarly(){
  if(!canEarly()){sfx('deny');return;}
  const b=Math.floor(R.nextWaveAt-R.t)*2;R.fish+=b;R.score+=b;R.earlyCalls++;R.fishBump=0.4;
  floatText(358,490,'提早 +'+b+'🐟','#ffe680',15);sfx('early');shake(120,3);startWave(R.wave+1);
}
// 免費貓爪拍擊：每 PAW_CD 秒一次，拍最接近貓窟的那隻＋周圍 PAW_R 內的怪，地面怪減速
function pawReady(){return scene==='play'&&R.wave>=1&&R.pawCd<=0;}
function pawDmg(){return 6+2*Math.min(R.wave,G.fixedN);}
function usePaw(){
  if(!pawReady()){sfx('deny');floatText(357,492,R.wave<1?'開戰後可用':'拍擊冷卻中','#ff8080',12);return false;}
  let tg=null,bv=-1e9;for(const e of R.enemies){if(e.dead)continue;const v=e.d-R.mp.paths[e.pi].len;if(v>bv){bv=v;tg=e;}}
  if(!tg){sfx('deny');floatText(357,492,'場上沒有怪','#ff8080',12);return false;}
  R.pawCd=PAW_CD;const x=tg.x,y=tg.y,dmg=pawDmg();
  for(const e of R.enemies.slice()){if(e.dead||!inRange(x,y,PAW_R,e))continue;slow(e,PAW_SLOW,PAW_SLOW_DUR);damage(e,dmg,false);}
  R.rings.push({x,y,r0:PAW_R,r1:PAW_R,life:0.5,max:0.5,color:'#ffb3d1'});burst(x,y,'#ffb3d1',16,170);   // 圈＝實際判定範圍
  floatText(x,y-24,'🐾 拍擊！','#ffb3d1',16);sfx('boom');shake(140,4);
  return true;
}
function onWaveCleared(n){
  const rw=waveDef(n).reward;R.fish+=rw;R.score+=CLEAR_SCORE*n;R.fishBump=0.45;
  floatText(W/2,MAP_Y+220,'第 '+n+' 波清除 +'+rw+'🐟','#9dffb0',18);sfx('clear');
  R.mp.holes.forEach(h=>burst(h.x,h.y,'#9dffb0',18));
  if(n<=G.fixedN){R.fixedCleared++;if(R.fixedCleared>=G.fixedN&&!R.victory)onVictory();}
}
// 固定波全清：當下寫入星等與最佳分
function onVictory(){
  R.victory=true;const bonus=R.lives*LIFE_BONUS;R.score+=bonus;
  floatText(W/2,MAP_Y+250,'剩 '+R.lives+' 命 +'+bonus+' 分','#7fd8ff',16);
  R.scoreAtClear=R.score;R.starsGot=starsOf(R.M,R.score,true);
  const S=P.save,id=R.M.id;S.stars[id]=Math.max(S.stars[id]|0,R.starsGot);S.best[id]=Math.max(S.best[id]|0,R.score);
  const td=dayStr();if(S.streak.last!==td){S.streak.n=(S.streak.last===dayStr(-1)?S.streak.n:0)+1;S.streak.last=td;}
  R.nextWaveAt=R.t+VICTORY_GAP;   // 第 10 波一清完就排第 11 波（不管原本倒數還剩多久）
  pSave();banner(starStr(R.starsGot)+' 通關已記錄！'+VICTORY_GAP+' 秒後無限波','🏆',2400);sfx('record');confetti(110);
}

// ===== enemies =====
function spawnQ(q){
  const act=[];R.mp.paths.forEach((p,i)=>{if(p.from<=q.n)act.push(i);});
  spawnEnemy(q.e,act[R.spawnN++%act.length],q.sc,0,q.n,false);R.waves[q.n].left--;
}
function spawnEnemy(def,pi,sc,d,wn,child){
  const hp=Math.max(1,def.hp*sc.hpS);
  const e={def,pi,sc,d:Math.max(0,d),hp,maxHp:hp,shield:def.shield,lastHit:-99,regenT:0,slowPct:0,slowT:0,wn,child,flash:0,
    boss:!!G.boss&&def.id===G.boss.id,bounty:def.bounty?Math.max(1,Math.round(def.bounty*sc.bS)):0,score:Math.round(def.score*sc.sS),x:0,y:0,bob:Math.random()*6,rage:0};
  const p=pathPos(R.mp.paths[pi],e.d);e.x=p.x;e.y=p.y;R.enemies.push(e);R.waves[wn].alive++;
  if(!R.seenIntro[def.id]){R.seenIntro[def.id]=1;banner(def.name+(def.intro?'：'+def.intro:' 登場'),def.emoji,1800);
    if(def.flying)firstTime('flying',()=>hint(e.x,e.y,'飛行：霧與爆炸打不到',22));}
  if(e.boss&&!child){sfx('boss');shake(400,6);}
}
function slow(e,pct,dur){if(e.def.flying||pct<=0)return;e.slowPct=Math.max(e.slowT>0?e.slowPct:0,pct);e.slowT=Math.max(e.slowT,dur);}
function damage(e,dmg,pierce){
  if(e.dead)return;e.lastHit=R.t;
  if(e.shield>0&&!pierce){e.shield=0;e.flash=0.12;sfx('shield');burst(e.x,e.y,'#ffe08a',18,180);floatText(e.x,e.y-22,'盾碎！','#ffe08a',15);
    firstTime('shield',()=>hint(e.x,e.y,'盾碎！再打才扣血',e.def.size+10));return;}
  if(dmg<=0)return;e.hp-=dmg;e.flash=0.08;sfx('hit');if(e.hp<=0)kill(e);
}
function kill(e){
  e.dead=true;R.kills++;R.fish+=e.bounty;R.score+=e.score;R.fishBump=0.25;R.waves[e.wn].alive--;
  burst(e.x,e.y,e.def.color,e.boss?50:12,e.boss?220:130);if(e.bounty)floatText(e.x,e.y-12,'+'+e.bounty+'🐟','#ffd76a');sfx('pop');
  if(e.boss){shake(500,8);confetti(40);}
  const d=e.def.splitInto&&!e.child?G.eById[e.def.splitInto]:null;
  if(d&&e.def.splitCount>0){for(let i=0;i<e.def.splitCount;i++)spawnEnemy(d,e.pi,e.sc,e.d-i*12,e.wn,true);
    firstTime('split',()=>hint(e.x,e.y,'分裂成 '+e.def.splitCount+' 隻！',28));}
}
function reach(e){
  e.dead=true;R.waves[e.wn].alive--;R.lives=Math.max(0,R.lives-e.def.dmg);R.lifeBump=0.5;R.redFlash=0.35;
  shake(260,e.def.dmg>=3?9:5);sfx('hurt');floatText(e.x,e.y-14,'-'+e.def.dmg+'❤','#ff6b6b',17);burst(e.x,e.y,'#ff5a5a',16);
  if(R.lives<=0)end();
}
function updEnemies(dt){
  for(const e of R.enemies){
    if(e.dead)continue;
    if(e.slowT>0&&(e.slowT-=dt)<=0)e.slowPct=0;
    if(e.flash>0)e.flash-=dt;if(e.regenT>0)e.regenT-=dt;
    if(e.def.shield&&e.shield===0&&R.t-e.lastHit>=e.def.shieldRegen){e.shield=1;e.regenT=1;sfx('regen');floatText(e.x,e.y-18,'盾重生','#ffe08a',11);}
    let sp=e.def.speed*(1-e.slowPct);
    if(e.boss&&e.hp<e.maxHp*0.5){sp*=BOSS_ACCEL;if(!e.rage){e.rage=1;banner(e.def.name+' 暴走加速！','⚡',1400);sfx('boss');}}
    e.d+=sp*dt;const p=R.mp.paths[e.pi],q=pathPos(p,e.d);e.x=q.x;e.y=q.y;
    if(e.d>=p.len){reach(e);if(scene!=='play')return;}
  }
}
// 射程內路徑進度最大的怪
function frontMost(cx,cy,r,flyOk){
  let best=null,bv=-1e9;
  for(const e of R.enemies){if(e.dead||(!flyOk&&e.def.flying)||!inRange(cx,cy,r,e))continue;const v=e.d-R.mp.paths[e.pi].len;if(v>bv){bv=v;best=e;}}
  return best;
}

// ===== towers =====
const rangeOf=t=>t.T.levels[t.lv].range;
function deny(c,r,msg){const p=cellXY(c,r);R.deny={c,r,t:0.45};sfx('deny');floatText(p.x,p.y-10,msg,'#ff8080',13);shake(90,2);}
function place(ti,c,r){
  const T=G.towers[ti];if(!T)return false;
  if(R.wave<T.unlockWave){deny(c,r,'第 '+T.unlockWave+' 波解鎖');return false;}
  if(!canBuild(c,r)){deny(c,r,R.mp.pc.has(c+','+r)?'路上不能蓋':'這格不能蓋');return false;}
  if(R.fish<T.cost){deny(c,r,'魚乾不夠');return false;}
  R.fish-=T.cost;const p=cellXY(c,r);
  const t={T,ti,c,r,x:p.x,y:p.y,lv:0,cd:T.type==='income'?INCOME_PERIOD:0,spent:T.cost,sq:0.4,flash:0};
  R.towers.push(t);sfx('place');burst(p.x,p.y+12,'#fff',12,110);shake(80,2);
  if(T.type!=='income')R.rings.push({x:p.x,y:p.y,r0:0,r1:rangeOf(t),life:1,max:1,color:'#9dffb0'});
  firstTime('place',()=>hint(p.x,p.y,T.type==='income'?'每 5 秒產魚乾':'射程內自動開火',T.type==='income'?24:rangeOf(t)));
  return true;
}
function upgrade(t){
  if(!t)return;const T=t.T;
  if(t.lv>=T.levels.length-1){floatText(t.x,t.y-20,'已滿級','#ffd27a');sfx('deny');return;}
  if(R.wave<2){floatText(t.x,t.y-20,'第 2 波開放升級','#ff8080');sfx('deny');return;}
  const cost=T.upgradeCost[t.lv];if(R.fish<cost){floatText(t.x,t.y-20,'魚乾不夠','#ff8080');sfx('deny');return;}
  const a=T.levels[t.lv],b=T.levels[t.lv+1];R.fish-=cost;t.spent+=cost;t.lv++;t.flash=0.6;t.sq=0.4;
  const main=T.type==='income'?'收益 '+a.aux.income+' → '+b.aux.income+'🐟':'傷害 '+fmt(a.dmg)+' → '+fmt(b.dmg);
  R.upFx={t,text:'Lv'+t.lv+' → Lv'+(t.lv+1)+'：'+main,life:1.2};floatText(t.x,t.y-28,main,'#ffe680',17);
  if(T.type!=='income')R.rings.push({x:t.x,y:t.y,r0:a.range,r1:b.range,life:1.1,max:1.1,color:'#ffe680'});
  sfx('upgrade');burst(t.x,t.y,'#ffe680',20,150);
}
function sell(t){
  if(!t)return;const v=Math.floor(t.spent*SELL_RATE);R.fish+=v;R.fishBump=0.3;R.towers=R.towers.filter(x=>x!==t);
  floatText(t.x,t.y-12,'+'+v+'🐟','#ffd76a',15);sfx('sell');burst(t.x,t.y,t.T.color,14);R.panel=null;
}
function updTowers(dt){
  for(const t of R.towers){
    if(t.sq>0)t.sq-=dt;if(t.flash>0)t.flash-=dt;
    const T=t.T,L=T.levels[t.lv];
    if(T.type==='income'){
      if(R.wave<1)continue;
      if((t.cd-=dt)<=0){t.cd=INCOME_PERIOD;const n=L.aux.income;if(n>0){R.fish+=n;R.fishBump=0.25;floatText(t.x,t.y-18,'+'+n+'🐟','#ffd76a');sfx('coin');burst(t.x,t.y,'#ffd76a',6);t.sq=0.25;
        firstTime('income',()=>hint(t.x,t.y,'每 5 秒 +'+n+'🐟',24));}}
      continue;
    }
    if((t.cd-=dt)>0)continue;
    if(T.type==='slow'){
      const hit=R.enemies.filter(e=>!e.dead&&!e.def.flying&&inRange(t.x,t.y,L.range,e));if(!hit.length){t.cd=0;continue;}
      t.cd=1/L.rate;t.sq=0.2;R.puddles.push({x:t.x,y:t.y,r:L.range,life:0.6,max:0.6,color:T.color});sfx('mist');
      hit.forEach(e=>{slow(e,L.aux.slow,L.aux.slowDur);damage(e,L.dmg,L.aux.pierce);});
      firstTime('slow',()=>hint(t.x,t.y,'減速 '+Math.round(L.aux.slow*100)+'%（飛行免疫）',L.range));continue;
    }
    const tg=frontMost(t.x,t.y,L.range,T.type!=='splash');if(!tg){t.cd=0;continue;}
    t.cd=1/L.rate;t.sq=0.12;fire(t,tg,L);
  }
}

// ===== combat：子彈、濺射、連鎖；判定與預覽共用 inRange =====
function inRange(cx,cy,r,e){const dx=e.x-cx,dy=e.y-cy;return dx*dx+dy*dy<=r*r;}
function fire(t,tg,L){
  const ty=t.T.type;
  if(ty==='chain'){chain(tg,L.aux.chain,L.dmg,t);sfx('zap');return;}
  if(ty==='sniper'){R.lines.push({pts:[{x:t.x,y:t.y},{x:tg.x,y:tg.y}],life:0.15,max:0.15,color:t.T.color,jag:0});
    if(tg.shield>0)firstTime('pierce',()=>hint(tg.x,tg.y,'遠射穿盾！',22));damage(tg,L.dmg,true);burst(tg.x,tg.y,t.T.color,6);sfx('snipe');return;}
  R.shots.push({x:t.x,y:t.y-6,tg,tx:tg.x,ty:tg.y,spd:ty==='splash'?240:380,dmg:L.dmg,kind:ty,r:L.aux.splash,pierce:L.aux.pierce,color:t.T.color});
  sfx(ty==='splash'?'lob':'shoot');
}
function splashAt(x,y,r,dmg){
  let n=0;for(const e of R.enemies.slice()){if(e.dead||e.def.flying||!inRange(x,y,r,e))continue;damage(e,dmg,false);n++;}
  R.puddles.push({x,y,r,life:0.35,max:0.35,color:'#ffcf6a'});burst(x,y,'#ffb347',12,160);sfx('boom');shake(80,2);
  if(n>1)firstTime('splash',()=>hint(x,y,'範圍內 '+n+' 隻全中',r));
}
function chain(tg,jumps,dmg,t){
  const hit=[tg];let cur=tg;damage(tg,dmg,false);
  for(let j=0;j<jumps;j++){let nb=null,bd=1e9;
    for(const e of R.enemies){if(e.dead||hit.includes(e)||!inRange(cur.x,cur.y,CHAIN_JUMP,e))continue;const d=(e.x-cur.x)**2+(e.y-cur.y)**2;if(d<bd){bd=d;nb=e;}}
    if(!nb)break;hit.push(nb);cur=nb;damage(nb,dmg*Math.pow(0.85,j+1),false);}
  R.lines.push({pts:[{x:t.x,y:t.y}].concat(hit.map(e=>({x:e.x,y:e.y}))),life:0.2,max:0.2,color:'#bfe8ff',jag:1});
  if(hit.length>1)firstTime('chain',()=>hint(hit[1].x,hit[1].y,'連鎖跳 '+(hit.length-1)+' 隻',24));
}
function updShots(dt){
  for(const s of R.shots){
    if(s.tg&&!s.tg.dead){s.tx=s.tg.x;s.ty=s.tg.y;}
    const dx=s.tx-s.x,dy=s.ty-s.y,dd=Math.hypot(dx,dy),st=s.spd*dt;
    if(dd<=st+2){s.done=true;if(s.kind==='splash')splashAt(s.tx,s.ty,s.r,s.dmg);else if(s.tg&&!s.tg.dead){damage(s.tg,s.dmg,s.pierce);burst(s.tx,s.ty,s.color,4,80);}}
    else{s.x+=dx/dd*st;s.y+=dy/dd*st;}
  }
  R.shots=R.shots.filter(s=>!s.done);
}

// ===== 主更新 =====
function update(dt){
  sceneT+=dt;fxUpdate(dt);
  if(scene!=='play'||!R||R.paused)return;
  R.t+=dt;
  for(const k of ['fishBump','lifeBump','redFlash','selT','pawCd'])if(R[k]>0)R[k]-=dt;
  for(const k in R.unlockFx)R.unlockFx[k]-=dt;
  if(R.upFx&&(R.upFx.life-=dt)<=0)R.upFx=null;
  if(R.deny&&(R.deny.t-=dt)<=0)R.deny=null;
  for(const h of R.hints)h.life-=dt;R.hints=R.hints.filter(h=>h.life>0);
  if(R.t>=R.nextWaveAt&&!holdFinal())startWave(R.wave+1);
  for(let i=R.queue.length-1;i>=0;i--){const q=R.queue[i];if(R.t>=q.at){R.queue.splice(i,1);spawnQ(q);}}
  updEnemies(dt);if(scene!=='play')return;
  updTowers(dt);updShots(dt);
  R.enemies=R.enemies.filter(e=>!e.dead);
  for(const k in R.waves){const w=R.waves[k];if(!w.done&&w.left<=0&&w.alive<=0){w.done=true;onWaveCleared(+k);}}
  for(const key of ['puddles','lines','rings']){for(const o of R[key])o.life-=dt;R[key]=R[key].filter(o=>o.life>0);}
  if(canEarly())firstTime('early',()=>hint(357,529,'提早開波＝剩餘秒×2🐟',30));
  if(pawReady()&&R.enemies.length&&R.towers.length)firstTime('paw',()=>hint(357,573,'免費拍擊！每 '+PAW_CD+' 秒一次',30));

    else{ctx.globalAlpha=af?1:0.45;txt(T.emoji,cx,y+25,24);txt(T.name,cx,y+51,Math.min(11,b[2]/3.6),'#fff');ctx.globalAlpha=1;txt(T.cost+'🐟',cx,y+71,11,af?'#ffd76a':'#ff7b7b','center',true);}
  });
  const b=EARLY,cx=b[0]+b[2]/2;
  if(canEarly()){const bon=Math.floor(R.nextWaveAt-R.t)*2,pl=1+0.05*Math.sin(R.t*8);ctx.save();ctx.translate(cx,b[1]+b[3]/2);ctx.scale(pl,pl);
    ctx.fillStyle='#e9653b';rr(-b[2]/2,-b[3]/2,b[2],b[3],10);ctx.fill();txt(R.wave<1?'立即開戰':'提早開波',0,-8,13,'#fff','center',true);txt('+'+bon+'🐟',0,10,12,'#ffe680','center',true);ctx.restore();}
  else{ctx.fillStyle='#2a2338';rr(b[0],b[1],b[2],b[3],10);ctx.fill();
    if(holdFinal()){txt('清光第 '+G.fixedN+' 波',cx,b[1]+14,11,'#ffd27a','center',true);txt('就通關',cx,b[1]+30,10,'#cbbfe6');}
    else{txt((R.wave<1?'開戰 ':'下一波 ')+Math.ceil(Math.max(0,R.nextWaveAt-R.t))+'s',cx,b[1]+14,12,'#fff','center',true);
      const nw=waveDef(R.wave+1);font(10);txt(wrap(nw.note||nw.name,b[2]-6)[0]||'',cx,b[1]+30,10,'#cbbfe6');}}
  // 拍擊鈕：冷卻中由下往上填滿
  const pb=PAW_BOX,pc=pb[0]+pb[2]/2,rdy=pawReady();
  ctx.fillStyle=rdy&&R.enemies.length?'#c2457a':'#2a2338';rr(pb[0],pb[1],pb[2],pb[3],10);ctx.fill();
  if(!rdy&&R.wave>=1){const k=clamp(1-R.pawCd/PAW_CD,0,1);ctx.fillStyle='rgba(255,179,209,0.3)';ctx.fillRect(pb[0]+3,pb[1]+pb[3]*(1-k),pb[2]-6,pb[3]*k);}
  txt('🐾 拍擊',pc,pb[1]+14,13,'#fff','center',true);
  txt(R.wave<1?'開戰後可用':rdy?'免費':Math.ceil(R.pawCd)+'s',pc,pb[1]+30,10,rdy?'#ffe680':'#cbbfe6','center',rdy);
}
function drawPanel(){
  const t=R.panel,T=t.T,max=t.lv>=T.levels.length-1;
  ctx.fillStyle='#241a3a';rr(4,504,392,92,10);ctx.fill();
  txt(T.emoji+' '+T.name+'  Lv'+(t.lv+1),12,518,15,'#fff','left',true);
  font(11);wrap(descOf(T,t.lv),258).slice(0,2).forEach((s,i)=>txt(s,12,537+i*14,11,'#d8cff0','left'));
  if(R.upFx&&R.upFx.t===t){const k=1+0.1*Math.sin(R.t*20);ctx.save();ctx.translate(12,578);ctx.scale(k,k);txt(R.upFx.text,0,0,14,'#ffe680','left',true);ctx.restore();}
  else if(!max){font(11);wrap('Lv'+(t.lv+1)+' → Lv'+(t.lv+2)+'：'+diffs(T,T.levels[t.lv],T.levels[t.lv+1]).join('｜'),258).slice(0,2).forEach((s,i)=>txt(s,12,570+i*14,11,'#9dffb0','left'));}
  else txt('已滿級，火力全開',12,578,12,'#ffd27a','left',true);
  const uc=max?0:T.upgradeCost[t.lv],can=!max&&R.wave>=2&&R.fish>=uc;
  btn(PB.up,max?'已滿級':R.wave<2?'第 2 波開放':'升級 '+uc+'🐟',can?'#e9a23b':'#4a4160',R.wave<2&&!max?12:14);
  btn(PB.sell,'賣 +'+Math.floor(t.spent*SELL_RATE)+'🐟','#6b4a8a',12);btn(PB.close,'✕','#3a3150',16);
}
function drawBanner(){
  const b=banners[0];if(!b)return;
  const a=clamp(Math.min((b.max-b.life)*6,b.life*4),0,1);ctx.globalAlpha=a;
  const s=(b.icon?b.icon+' ':'')+b.text;let sz=15;font(sz,true);if(ctx.measureText(s).width>350){sz=12;font(sz,true);}
  const w=Math.min(390,ctx.measureText(s).width+30),y=MAP_Y+30;
  ctx.fillStyle='rgba(20,12,36,0.9)';rr(W/2-w/2,y-17,w,34,17);ctx.fill();ctx.strokeStyle='#ffd27a';ctx.lineWidth=2;ctx.stroke();
  txt(s,W/2,y,sz,'#fff','center',true);ctx.globalAlpha=1;
}
function drawOver(){
  const o=R.over;if(!o)return;
  ctx.fillStyle='rgba(8,4,18,0.74)';ctx.fillRect(0,MAP_Y,W,H-MAP_Y);
  const pop=Math.min(1,sceneT*5),sc=0.85+0.15*pop;ctx.save();ctx.translate(W/2,300);ctx.scale(sc,sc);ctx.translate(-W/2,-300);ctx.globalAlpha=pop;
  ctx.fillStyle='#231a3c';rr(25,105,350,400,18);ctx.fill();ctx.strokeStyle=o.rec?'#ffd27a':'#6b5a9a';ctx.lineWidth=3;ctx.stroke();
  txt(R.victory?'🏆 通關！無限波倒在第 '+R.wave+' 波':'💥 貓窟被攻破',W/2,138,18,'#fff','center',true);
  txt(comma(o.final*Math.min(1,sceneT/0.7)),W/2,188,44,'#ffe9b0','center',true);
  if(o.rec){const k=1+0.08*Math.sin(sceneT*8);ctx.save();ctx.translate(W/2,238);ctx.scale(k,k);txt('🎉 新紀錄！',0,0,24,'#ffd27a','center',true);ctx.restore();}
  else{const d=o.prevBest-o.final;txt(d<=0?'追平最佳紀錄！':'差 '+comma(d)+' 分破紀錄',W/2,238,20,'#ff9a6a','center',true);}
  for(let i=0;i<3;i++)txt(i<R.starsGot?'★':'☆',W/2-42+i*42,282,32,i<R.starsGot?'#ffd34d':'#5a5078','center',true);
  txt(o.l3,W/2,320,14,'#ffe680','center',true);
  txt(o.reach,W/2,346,13,'#cbbfe6');
  txt(o.streak,W/2,372,13,'#9dffb0');
  btn(OB.again,'再來一局','#e9a23b',18);btn(OB.map,'換地圖','#4a4160',15);
  txt('點任意處／R 重開・M 換地圖',W/2,488,11,'#887ea8');
  ctx.restore();ctx.globalAlpha=1;drawFx();
}
function draw(){
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);ctx.clearRect(0,0,W,H);
  if(scene==='title')drawTitle();else if(scene==='map_select'){drawMapSelect();drawFx();}else if(R){drawPlay();if(scene==='over')drawOver();}
}

// ===== input：觸控與鍵盤 =====
function pt(ev){const b=cv.getBoundingClientRect();return{x:(ev.clientX-b.left)/b.width*W,y:(ev.clientY-b.top)/b.height*H};}
function goFromTitle(){
  if(G.blocked){sfx('deny');return;}
  const av=G.maps.map((m,i)=>m.ok&&unlocked(i)?i:-1).filter(i=>i>=0);
  if(av.length<=1)startRun(av.length?av[0]:0);
  else{scene='map_select';sceneT=0;const li=G.maps.findIndex(m=>m.id===P.save.lastMap);mapSel=li>=0?li:av[av.length-1];sfx('select');}
}
function chooseMap(i){if(!G.maps[i])return;if(!G.maps[i].ok||!unlocked(i)){sfx('deny');shake(150,4);mapSel=i;return;}sfx('select');startRun(i);}
function selectCard(i){
  const T=G.towers[i];if(!T)return;const b=cardRect(i);
  if(R.wave<T.unlockWave){floatText(b[0]+b[2]/2,494,'第 '+T.unlockWave+' 波解鎖','#ff8080',12);sfx('deny');return;}
  R.panel=null;R.sel=i;R.preSel=false;R.selT=3.5;sfx('select');   // 冪等：點了就是選中（取消用 Esc 或點別張卡）
  if(R.sel>=0&&R.kb)R.ghost={c:R.cursor.c,r:R.cursor.r};
}
function showPanel(t){R.panel=t;R.ghost=null;sfx('select');}
function hidePanel(){R.panel=null;}
function onDown(p){
  if(scene==='title'){goFromTitle();return;}
  if(scene==='map_select'){for(let i=0;i<G.maps.length;i++)if(inBox(p,mapRect(i))){chooseMap(i);return;}return;}
  if(scene==='over'){if(sceneT<0.45)return;if(inBox(p,OB.map)){scene='map_select';sceneT=0;mapSel=R.mi;sfx('select');}else restart();return;}
  if(!R)return;
  if(R.paused){R.paused=false;return;}
  if(p.y>=500){
    if(R.panel){if(inBox(p,PB.up))upgrade(R.panel);else if(inBox(p,PB.sell))sell(R.panel);else if(inBox(p,PB.close))hidePanel();return;}
    if(inBox(p,EARLY)){if(canEarly())callEarly();else{sfx('deny');floatText(357,492,R.wave<1?'先放塔，第 1 波準備中':holdFinal()?'先清光第 '+G.fixedN+' 波':'這波怪還沒出完','#ff8080',12);}return;}
    if(inBox(p,PAW_BOX)){usePaw();return;}
    for(let i=0;i<G.towers.length;i++)if(inBox(p,cardRect(i))){selectCard(i);return;}
    return;
  }
  if(p.y<MAP_Y)return;
  const cell=cellAt(p.x,p.y);if(!cell)return;R.kb=false;
  const t=towerAt(cell.c,cell.r);
  if(t){R.panel===t?hidePanel():showPanel(t);return;}
  if(R.panel){hidePanel();return;}
  if(R.sel>=0){R.holding=true;R.ghost=cell;R.selT=Math.max(R.selT,0.5);}
}
function onMove(p,ev){
  if(scene!=='play'||!R)return;
  const c=cellAt(p.x,p.y);
  if(R.holding){R.ghost=c;return;}
  if(ev.pointerType==='mouse'){R.hover=!!c&&p.y<500;if(R.hover&&R.sel>=0){R.ghost=c;R.kb=false;}}
}
function onUp(p,ev){
  if(scene!=='play'||!R||!R.holding)return;
  R.holding=false;const c=cellAt(p.x,p.y);
  if(c&&p.y<500&&R.sel>=0)place(R.sel,c.c,c.r);
  if(ev.pointerType!=='mouse')R.ghost=null;
}
function cancelInput(){if(R){R.holding=false;R.hover=false;if(!R.kb)R.ghost=null;}}
cv.addEventListener('pointerdown',ev=>{ev.preventDefault();audioInit();try{cv.setPointerCapture(ev.pointerId);}catch(e){}onDown(pt(ev));});
cv.addEventListener('pointermove',ev=>{ev.preventDefault();onMove(pt(ev),ev);});
cv.addEventListener('pointerup',ev=>{ev.preventDefault();onUp(pt(ev),ev);});
cv.addEventListener('pointercancel',cancelInput);
cv.addEventListener('pointerleave',ev=>{if(ev.pointerType==='mouse'&&R&&!R.holding){R.hover=false;}});
cv.addEventListener('contextmenu',ev=>ev.preventDefault());
window.addEventListener('blur',cancelInput);
document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelInput();});
window.addEventListener('keydown',ev=>{
  const k=ev.key;if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter'].includes(k))ev.preventDefault();
  if(ev.repeat&&scene!=='play')return;audioInit();
  if(scene==='title'){goFromTitle();return;}
  if(scene==='map_select'){
    const n=G.maps.length;if(k==='ArrowUp')mapSel=(mapSel+n-1)%n;else if(k==='ArrowDown')mapSel=(mapSel+1)%n;
    else if(k==='Enter'||k===' ')chooseMap(mapSel);else if(/^[1-9]$/.test(k))chooseMap(+k-1);return;}
  if(scene==='over'){if(sceneT<0.45)return;if(k==='m'||k==='M'){scene='map_select';sceneT=0;mapSel=R.mi;}else restart();return;}
  if(!R)return;
  if(k==='p'||k==='P'){R.paused=!R.paused;return;}
  if(R.paused)return;
  const mv={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[k];
  if(mv){R.kb=true;R.cursor.c=clamp(R.cursor.c+mv[0],0,COLS-1);R.cursor.r=clamp(R.cursor.r+mv[1],0,ROWS-1);R.ghost=R.sel>=0?{c:R.cursor.c,r:R.cursor.r}:null;return;}
  if(/^[1-9]$/.test(k)){R.kb=true;selectCard(+k-1);return;}
  if(k==='Enter'||k===' '){R.kb=true;const c=R.cursor.c,r=R.cursor.r,t=towerAt(c,r);
    if(t)R.panel===t?hidePanel():showPanel(t);else if(R.panel)hidePanel();else if(R.sel>=0)place(R.sel,c,r);return;}
  const ct=R.panel||towerAt(R.cursor.c,R.cursor.r);
  if(k==='u'||k==='U'){upgrade(ct);return;}
  if(k==='x'||k==='X'){sell(ct);return;}
  if(k==='n'||k==='N'){callEarly();return;}
  if(k==='c'||k==='C'){usePaw();return;}
  if(k==='Escape'){if(R.panel)hidePanel();else{R.sel=-1;R.ghost=null;}}
});

// ===== 縮放與主迴圈 =====
function resize(){
  const s=Math.min(window.innerWidth/W,window.innerHeight/H),dw=Math.max(1,Math.floor(W*s)),dh=Math.max(1,Math.floor(H*s));
  cv.style.width=dw+'px';cv.style.height=dh+'px';dpr=Math.min(3,window.devicePixelRatio||1);
  cv.width=Math.round(dw*dpr);cv.height=Math.round(dh*dpr);scale=dw/W;
}
let lastTs=0,acc=0,warned=false;
function frame(ts){
  requestAnimationFrame(frame);
  let d=lastTs?(ts-lastTs)/1000:0;lastTs=ts;d=clamp(d,0,0.25);acc+=d;let n=0;
  try{while(acc>=STEP&&n<15){update(STEP);acc-=STEP;n++;}if(n>=15)acc=0;draw();}
  catch(err){if(!warned){warned=true;console.warn('[喵窟] 執行錯誤',err);}}
}

// ===== 品管掛鉤 =====
window.SC_HOOKS={
  start(){if(G.blocked)return false;startRun(Math.max(0,G.maps.findIndex(m=>m.ok)));return true;},
  snapshot(){return{scene,score:R?R.score:0,level:R?R.wave:0,elapsed:R?Math.round(R.t*100)/100:0,
    map:R?R.M.id:null,wave:R?R.wave:0,totalWaves:G.fixedN,fish:R?R.fish:0,lives:R?R.lives:0,kills:R?R.kills:0,
    towers:R?R.towers.length:0,enemies:R?R.enemies.length:0,victory:R?R.victory:false,stars:R?R.starsGot:0,
    canEarly:R?canEarly():false,paused:R?R.paused:false,blocked:G.blocked,errors:G.errors.slice()};}
};

load();pLoad();resize();
window.addEventListener('resize',resize);
requestAnimationFrame(frame);
})();
</script>
