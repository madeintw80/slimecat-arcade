const KEY='sc_meow_abyss_v1';
const SV={best_score:0,runs:0,unlocked:1,rooms:{},dex:{},feats:[],stats:{},daily:{date:'',best:0,prev_date:'',prev_best:0,streak:0,days:0},tips:[],palette:'',title:'',muted:false};
STAT_KEYS.forEach(k=>{SV.stats[k]=0;});SV.stats.fastest_first_room=9999;
function loadSave(){try{const j=JSON.parse(localStorage.getItem(KEY)||'{}');Object.keys(SV).forEach(k=>{if(j[k]!=null&&typeof j[k]===typeof SV[k]&&Array.isArray(j[k])===Array.isArray(SV[k]))SV[k]=j[k];});
  STAT_KEYS.forEach(k=>{if(typeof SV.stats[k]!=='number')SV.stats[k]=k==='fastest_first_room'?9999:0;});if(typeof SV.daily.streak!=='number')SV.daily.streak=0;}catch(e){}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(SV));}catch(e){}}
function todayStr(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dailyInfo(){ // 每日一房：日期種子、房序＝日序 % 房數
  const t=todayStr(),y=todayStr(new Date(Date.now()-864e5)),d=SV.daily;
  const dayIdx=Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);
  return{seed:hash('daily-'+t),order:((dayIdx%C.scenes.length)+C.scenes.length)%C.scenes.length+1,todayBest:d.date===t?d.best:0,yBest:d.date===y?d.best:(d.prev_date===y?d.prev_best:0),streak:(d.date===t||d.date===y)?d.streak:0};
}
function evalFeats(){const st=SV.stats,out=[];C.feats.forEach(f=>{if(SV.feats.includes(f.id))return;const v=st[f.stat];const ok=f.op==='lte'?v<=f.value:v>=f.value;if(!ok)return;SV.feats.push(f.id);out.push(f);
  if(f.reward_type==='palette'&&f.reward_value)SV.palette=f.reward_value;else if(f.reward_type==='title'&&f.reward_value)SV.title=f.reward_value;});return out;}
function commit(S){ // 一趟結束寫入進度
  const st=SV.stats;SV.runs++;st.runs=SV.runs;
  st.objects_total+=S.objects;st.bosses_total+=S.bosses;st.max_combo=Math.max(st.max_combo,S.maxCombo);st.clocks_total+=S.clocks;st.hazards_total+=S.hazards;st.full_clears+=S.fullClears;
  st.best_rooms_run=Math.max(st.best_rooms_run,S.roomsCleared);st.clean_rooms_run=Math.max(st.clean_rooms_run,S.cleanRooms);
  if(S.firstBossTime!=null)st.fastest_first_room=Math.min(st.fastest_first_room,Math.round(S.firstBossTime*10)/10);
  if(S.mode==='chain'){S.prevBest=SV.best_score;if(S.score>SV.best_score){S.newRecord=true;SV.best_score=S.score;}st.best_score=SV.best_score;}
  else{const t=todayStr(),y=todayStr(new Date(Date.now()-864e5)),d=SV.daily;
    if(d.date!==t){d.streak=(d.date===y)?d.streak+1:1;d.prev_date=d.date;d.prev_best=d.best;d.date=t;d.best=0;d.days=(d.days||0)+1;}
    S.prevBest=d.best;if(S.score>d.best){d.best=S.score;S.newRecord=true;}st.daily_days=Math.max(st.daily_days,d.streak);}
  const before=SV.unlocked;
  S.roomResults.forEach(r=>{const rm=SV.rooms[r.order]||(SV.rooms[r.order]={best_pct:0,stars:0,best_clear_sec:0});rm.best_pct=Math.max(rm.best_pct,r.pct);rm.stars=Math.max(rm.stars,r.stars);
    if(r.entered&&(!rm.best_clear_sec||r.sec<rm.best_clear_sec))rm.best_clear_sec=r.sec;if(r.entered&&S.mode==='chain')SV.unlocked=Math.max(SV.unlocked,Math.min(C.scenes.length,r.order+1));});
  if(SV.unlocked>before)S.unlockedNew=SV.unlocked;
  st.stars_total=Object.keys(SV.rooms).reduce((a,k)=>a+(SV.rooms[k].stars||0),0);
  S.dexNew=[];Object.keys(S.eaten).forEach(id=>{if(!SV.dex[id])S.dexNew.push(id);SV.dex[id]=(SV.dex[id]||0)+S.eaten[id];});
  st.dex_count=Object.keys(SV.dex).length;S.featsNew=evalFeats();persist();
}

const G={phase:'title',mode:'chain',chain:[],roomIdx:0,runSeed:0,timeScale:1,score:0,dispScore:0,best:0,recHit:false,S:null,startOrder:1,sel:1,now:0,runElapsed:0,lastPerk:null,pending:null};
let R=null; // 目前房間
const P={x:0,y:0,vx:0,vy:0,r:R0,targetR:R0,speedMul:1,captureRatio:CAP,gainMul:1,magnet:0,hazardMul:1,slowUntil:0,pointsMul:1,refundMul:1,comboWindow:COMBO_WIN,radar:0,moveMul:1,squash:0};
const T={t:0};
const cv=$('cv'),cx=cv.getContext('2d');let scale=1,dpr=1;

// ===== 佈局生成（純函式）=====
function mk(d,x,y){return{def:d,id:d.id,x,y,bx:x,by:y,size:d.size,tier:d.tier,boss:d.boss,hazard:d.hazard,eaten:false,sink:0,sx:x,sy:y,seen:false,t:0,ang:0,pd:1,hitT:-9};}
function buildLayout(sc,seed,r0){
  const rng=RNG(seed),w=sc.world_w,h=sc.world_h;
  const start={x:sc.start[0]*w,y:sc.start[1]*h},door={x:sc.door[0]*w,y:sc.door[1]*h};
  const bdef=C.byId[sc.boss]||DEF_BOSS;const ang=Math.atan2(door.y-start.y,door.x-start.x);
  const boss=mk(bdef,clamp(start.x+Math.cos(ang)*sc.boss_dist,bdef.size+10,w-bdef.size-10),clamp(start.y+Math.sin(ang)*sc.boss_dist,bdef.size+10,h-bdef.size-10));
  const objs=[boss],list=[];
  sc.spawn.forEach(e=>{const d=C.byId[e.obj];if(!d)return;for(let i=0;i<e.n;i++)list.push(d);});
  list.sort((a,b)=>(a.tier-b.tier)||((a.hazard?1:0)-(b.hazard?1:0))); // T1 食物優先填安全圈
  const maxD=Math.hypot(w,h);let centers=[];
  if(sc.layout==='clusters'){const n=6+rng.int(0,3);for(let i=0;i<n;i++){let cx0,cy0,tries=0;do{cx0=rng.range(80,w-80);cy0=rng.range(80,h-80);tries++;}while(tries<40&&(dist(cx0,cy0,start.x,start.y)<SAFE+80||centers.some(c=>dist(c.x,c.y,cx0,cy0)<240)));centers.push({x:cx0,y:cy0,d:dist(cx0,cy0,start.x,start.y)});}centers.sort((a,b)=>a.d-b.d);}
  let safeCount=0;
  list.forEach(d=>{
    const safeOK=d.tier===1&&!d.hazard;let x=0,y=0,ok=false;
    for(let t=0;t<16&&!ok;t++){
      if(safeOK&&safeCount<14){const a=rng.next()*TAU,rr=rng.range(45,SAFE-30);x=start.x+Math.cos(a)*rr;y=start.y+Math.sin(a)*rr;}
      else if(sc.layout==='rings'){const band=[[60,320],[240,560],[420,820],[620,1200],[800,1600]][clamp(d.tier,1,5)-1];const a=rng.next()*TAU,rr=rng.range(band[0],Math.min(band[1],maxD));x=start.x+Math.cos(a)*rr;y=start.y+Math.sin(a)*rr;}
      else if(sc.layout==='clusters'&&centers.length){let ci=Math.round((d.tier-1)/4*(centers.length-1)+rng.range(-1,1));const c=centers[clamp(ci,0,centers.length-1)];const a=rng.next()*TAU,rr=rng.range(0,110+d.tier*15);x=c.x+Math.cos(a)*rr;y=c.y+Math.sin(a)*rr;}
      else{x=rng.range(0,w);y=rng.range(0,h);const minD=Math.min(maxD*0.55,[0,0,220,380,540,0][d.tier]);if(dist(x,y,start.x,start.y)<minD)continue;}
      const m=d.size+8;x=clamp(x,m,w-m);y=clamp(y,m,h-m);const ds=dist(x,y,start.x,start.y);
      if(!safeOK&&ds<SAFE)continue;if(ds<d.size+r0+30)continue;if(dist(x,y,door.x,door.y)<DOOR_R+d.size)continue;
      if(objs.some(o=>dist(o.x,o.y,x,y)<o.size+d.size+6))continue;ok=true;
    }
    if(!ok)return;if(safeOK&&dist(x,y,start.x,start.y)<SAFE)safeCount++;objs.push(mk(d,x,y));
  });
  return{objects:objs,boss,door,start,bounds:{w,h},rng};
}

// ===== 一趟流程 =====
function startRun(order,mode){
  mode=mode||'chain';const n=C.scenes.length;order=clamp(Math.round(order)||1,1,n);
  G.mode=mode;G.startOrder=order;G.chain=[];
  if(mode==='daily'){const d=dailyInfo();G.chain=[C.scenes[d.order-1]];G.runSeed=d.seed;G.best=d.todayBest;}
  else{for(let i=0;i<4&&order-1+i<n;i++)G.chain.push(C.scenes[order-1+i]);G.runSeed=(hash(G.chain[0].id)+SV.runs*7)>>>0;G.best=SV.best_score;}
  G.roomIdx=0;G.score=0;G.dispScore=0;G.recHit=false;G.runElapsed=0;G.timeScale=1;G.lastPerk=null;G.pending=null;
  G.S={mode,startOrder:order,score:0,objects:0,bosses:0,maxCombo:0,hazards:0,clocks:0,fullClears:0,roomsCleared:0,cleanRooms:0,firstBossTime:null,roomResults:[],eaten:{},perks:[],won:false,reason:'',prevBest:G.best,newRecord:false,dexNew:[],featsNew:[]};
  Object.assign(P,{r:R0,targetR:R0,vx:0,vy:0,speedMul:1,captureRatio:CAP,gainMul:1,magnet:0,hazardMul:1,slowUntil:0,pointsMul:1,refundMul:1,comboWindow:COMBO_WIN,radar:0,moveMul:1,squash:0});
  PK.taken={};cam.slow.t=0;cam.shakeT=0;AU.beatT=0;IN.reset();
  T.t=mode==='daily'?100:G.chain[0].time_first;
  enterRoom();UI.hide();
}
function enterRoom(){
  const sc=G.chain[G.roomIdx];const L=buildLayout(sc,(G.runSeed+G.roomIdx*7919)>>>0,P.r);
  R={scene:sc,objs:L.objects,boss:L.boss,door:L.door,bounds:L.bounds,rng:L.rng,roomT:0,intro:1.3,combo:0,comboT:0,lastEat:-9,bossEaten:false,doorOpen:false,
    mod:{type:sc.mod,active:false,pos:0,fogR:9999,axis:'y',dir:-1},eaten:0,total:L.objects.filter(o=>!o.boss&&!o.hazard).length,washed:0,hazardsHere:0,nearHi:null,taunt:null,pips:[],milestones:{}};
  const m=R.mod,dx=R.door.x-L.start.x,dy=R.door.y-L.start.y;
  if(Math.abs(dy)>=Math.abs(dx)){m.axis='y';m.dir=dy>0?1:-1;m.pos=m.dir<0?R.bounds.h:0;}else{m.axis='x';m.dir=dx>0?1:-1;m.pos=m.dir<0?R.bounds.w:0;}
  P.x=L.start.x;P.y=L.start.y;P.vx=P.vy=0;cam.x=P.x;cam.y=P.y;cam.zoom=zoomFor(P.r);
  initPips();FX.clear();G.phase='run';
}
function roomStats(){const tot=R.total;return{pct:tot?clamp(R.eaten/tot,0,1):1,eaten:R.eaten,total:tot,bossEaten:R.bossEaten};}
function nearMissN(o){const need=o.size/P.captureRatio-P.r;const ed=R.objs.filter(x=>!x.eaten&&!x.hazard&&!x.boss&&x.size<=P.r*P.captureRatio);
  const avg=ed.length?ed.reduce((a,x)=>a+x.def.gain,0)/ed.length*P.gainMul:1;return Math.max(1,Math.ceil(need/Math.max(0.3,avg)));}
function initPips(){R.pips=[];const cap=P.r*P.captureRatio;for(let t=1;t<=5;t++){let best=null;R.objs.forEach(o=>{if(o.tier===t&&!o.hazard&&(!best||o.size>best.size))best=o;});if(best)R.pips.push({tier:t,glyph:best.def.glyph,size:best.size,name:best.def.name,lit:best.size<=cap,flash:0});}}
function updatePips(){const cap=P.r*P.captureRatio;R.pips.forEach(p=>{if(p.flash>0)p.flash-=STEP;if(!p.lit&&p.size<=cap){p.lit=true;p.flash=1;FX.banner('吞得下 '+p.glyph+' '+p.name+' 了！','tier',1.5);AU.tierUp();}});}
function tickRun(rdt){
  cam.slow.t-=rdt;G.timeScale=cam.slow.t>0?cam.slow.scale:1;
  if(R.intro>0){R.intro-=rdt;if(R.intro<=0&&G.lastPerk){FX.float('🎴 '+G.lastPerk.desc,P.x,P.y-P.r-24,'perk');G.lastPerk=null;}cam.follow(rdt);return;}
  const dt=rdt*G.timeScale;R.roomT+=dt;G.runElapsed+=dt;
  T.t-=dt;if(T.t<=0){T.t=0;endRun('time');return;}
  movePit(dt);updateObjects(dt);updateMods(dt);checkOverlaps();
  if(R.combo>0){R.comboT-=dt;if(R.comboT<=0)breakCombo();}
  if(R.nearHi&&(R.nearHi.t-=dt)<=0)R.nearHi=null;if(R.taunt&&(R.taunt.t-=dt)<=0)R.taunt=null;
  updatePips();
  if(R.doorOpen&&dist(P.x,P.y,R.door.x,R.door.y)<=DOOR_R){doorEnter();return;}
  if(!G.recHit&&G.best>0&&G.score>G.best){G.recHit=true;FX.banner('🎉 新紀錄！','rec',2);AU.record();}
  if(T.t<LOW_T){AU.beatT-=dt;if(AU.beatT<=0){AU.beat();AU.beatT=0.95-(LOW_T-T.t)/LOW_T*0.45;}}
  cam.follow(dt);FX.update(dt);
}
function inTide(x,y){const m=R.mod;if(m.type!=='tide'||!m.active)return false;const v=m.axis==='y'?y:x;return m.dir<0?v>m.pos:v<m.pos;}
function movePit(dt){
  const a=IN.axis();let sp=190*P.speedMul*(1-0.15*clamp((P.r-R0)/80,0,1));
  if(G.now<P.slowUntil||inTide(P.x,P.y))sp*=0.5;
  const k=a.mag>0?1-Math.exp(-dt*18):1-Math.exp(-dt*20);
  P.vx=lerp(P.vx,a.x*a.mag*sp,k);P.vy=lerp(P.vy,a.y*a.mag*sp,k);
  P.x=clamp(P.x+P.vx*dt,P.r*0.5,R.bounds.w-P.r*0.5);P.y=clamp(P.y+P.vy*dt,P.r*0.5,R.bounds.h-P.r*0.5);
  if(R.mod.type==='leak'&&R.mod.active)P.targetR=Math.max(R0,P.targetR-0.35*R.scene.mod_power*dt);
  P.r+=(P.targetR-P.r)*Math.min(1,dt*8);if(P.squash>0)P.squash-=dt;
}
function updateObjects(dt){
  const b=R.bounds,cap=P.r*P.captureRatio;
  for(const o of R.objs){
    if(o.eaten){o.sink+=dt;continue;}
    const d=dist(o.x,o.y,P.x,P.y);
    if(P.magnet>0&&!o.boss&&o.size<=cap&&d<P.r+P.magnet&&d>1){o.x+=(P.x-o.x)/d*90*dt;o.y+=(P.y-o.y)/d*90*dt;}
    const mv=o.def.move;if(mv==='static'||!o.def.speed)continue;
    const sp=o.def.speed*(o.boss?1:P.moveMul);
    if(mv==='wander'){o.t-=dt;if(o.t<=0){o.t=1+R.rng.next();o.ang=R.rng.next()*TAU;}o.x+=Math.cos(o.ang)*sp*dt;o.y+=Math.sin(o.ang)*sp*dt;}
    else if(mv==='flee'){if(d<170+P.r){o.ang=Math.atan2(o.y-P.y,o.x-P.x);o.x+=Math.cos(o.ang)*sp*dt;o.y+=Math.sin(o.ang)*sp*dt;}}
    else if(mv==='patrol'){if(b.w>b.h){o.x+=o.pd*sp*dt;if(o.x-o.bx>160)o.pd=-1;else if(o.bx-o.x>160)o.pd=1;}else{o.y+=o.pd*sp*dt;if(o.y-o.by>160)o.pd=-1;else if(o.by-o.y>160)o.pd=1;}}
    const m=o.size;
    if(o.x<m){o.x=m;o.ang=Math.PI-o.ang;o.pd=1;}else if(o.x>b.w-m){o.x=b.w-m;o.ang=Math.PI-o.ang;o.pd=-1;}
    if(o.y<m){o.y=m;o.ang=-o.ang;o.pd=1;}else if(o.y>b.h-m){o.y=b.h-m;o.ang=-o.ang;o.pd=-1;}
  }
  R.objs=R.objs.filter(o=>!o.eaten||o.sink<SINK_T);
}
function updateMods(dt){
  const m=R.mod,sc=R.scene;if(m.type==='none')return;
  if(!m.active&&R.roomT>=sc.mod_at){m.active=true;AU.ui('mod');FX.banner({leak:'⬇ 漏淵開始！不吃就會縮小',fog:'🌫 濃霧來了！記住路線',tide:'🌊 潮水來了！別被沖走'}[m.type],'mod',2.2);}
  if(!m.active)return;
  if(m.type==='fog')m.fogR=260/sc.mod_power+P.r;
  else if(m.type==='tide'){m.pos+=m.dir*18*sc.mod_power*dt;m.pos=clamp(m.pos,0,m.axis==='y'?R.bounds.h:R.bounds.w);
    R.objs.forEach(o=>{if(o.eaten||o.boss)return;if(inTide(o.x,o.y)){o.eaten=true;o.sink=SINK_T;R.washed++;FX.burst(o.x,o.y,'#8fd0ff',4);}});}
}
function checkOverlaps(){
  const cap=P.r*P.captureRatio,fog=R.mod.type==='fog'&&R.mod.active;
  for(const o of R.objs){
    if(o.eaten)continue;const d=dist(o.x,o.y,P.x,P.y);
    if(fog&&d<R.mod.fogR)o.seen=true;
    if(o.size<=cap){if(d<=P.r+o.size*0.25)eat(o);continue;}
    const lim=P.r+o.size*0.75;if(d>=lim)continue;
    const nx=(P.x-o.x)/(d||1),ny=(P.y-o.y)/(d||1),ov=lim-d; // 實體彈開
    P.x+=nx*ov*1.6;P.y+=ny*ov*1.6;const dot=P.vx*nx+P.vy*ny;P.vx=(P.vx-2*dot*nx)*0.5;P.vy=(P.vy-2*dot*ny)*0.5;
    if(G.now-o.hitT>0.45){o.hitT=G.now;cam.shake(6,0.2);AU.thud();breakCombo();FX.burst(P.x+nx*P.r,P.y+ny*P.r,'#ffffff',6);
      if(o.size<=cap*NEAR){R.nearHi={o,t:0.9,n:nearMissN(o)};FX.float('再吞 '+R.nearHi.n+' 個',o.x,o.y-o.size-10,'near');}
      if(o.boss){R.taunt={t:1.8,text:o.def.taunt||'還早呢！'};tip('bounce','太大了！先吃小的變大再回來');}}
  }
}
function breakCombo(){if(R.combo>=3)AU.drop();R.combo=0;R.comboT=0;R.milestones={};}
function eat(o){
  o.eaten=true;o.sink=0;o.sx=o.x;o.sy=o.y;const def=o.def;G.S.eaten[def.id]=(G.S.eaten[def.id]||0)+1;
  if(def.hazard){P.targetR=Math.max(R0,P.targetR+def.gain*P.hazardMul);breakCombo();R.hazardsHere++;G.S.hazards++;
    if(def.effect==='slow')P.slowUntil=G.now+def.effect_value;AU.hazard();cam.shake(5,0.25);FX.burst(o.x,o.y,'#e04848',14);FX.float('好痛！縮小了',o.x,o.y-o.size,'bad');return;}
  if(R.roomT-R.lastEat<=P.comboWindow)R.combo++;else R.combo=1;R.lastEat=R.roomT;R.comboT=P.comboWindow;
  G.S.maxCombo=Math.max(G.S.maxCombo,R.combo);
  const mult=1+0.1*Math.min(R.combo,20),pts=Math.round(def.points*mult*P.pointsMul);
  G.score+=pts;T.t+=def.refund*P.refundMul;
  if(def.effect==='time'){T.t+=def.effect_value;G.S.clocks++;FX.float('⏰ +'+def.effect_value+' 秒',o.x,o.y-o.size-16,'time');}
  if(def.effect==='slow')P.slowUntil=G.now+def.effect_value;
  P.targetR+=def.gain*P.gainMul;P.squash=0.12;if(!def.boss)R.eaten++;G.S.objects++;
  AU.eat(def.tier,R.combo);FX.burst(o.x,o.y,def.color,4+def.tier*3);FX.float('+'+pts,o.x,o.y-o.size,def.tier>=3?'big':'');
  [10,20,30].forEach((m,i)=>{if(R.combo===m&&!R.milestones[m]){R.milestones[m]=1;const add=[3,5,8][i];T.t+=add;FX.banner(m+' 連吞！⏱ +'+add+' 秒','gold',1.6);AU.milestone(i);}});
  if(def.boss){R.bossEaten=true;R.doorOpen=true;G.S.bosses++;if(G.roomIdx===0&&G.S.firstBossTime==null)G.S.firstBossTime=R.roomT;
    cam.slowmo(0.6,0.35);cam.shake(10,0.4);AU.boss();FX.banner('報仇！吞掉了 '+def.name,'boss',2);FX.burst(o.x,o.y,'#ffd35a',40);tip('door','報仇成功！貓門開了 →');}
}
function doorEnter(){
  const st=roomStats(),stars3=st.pct>=1?3:st.pct>=0.85?2:1,clearPts=Math.round(st.pct*200),addT=R.scene.time_next+Math.round(R.scene.clear_bonus*st.pct);
  G.score+=clearPts;G.S.roomResults.push({order:R.scene.order,pct:Math.round(st.pct*100),stars:stars3,sec:Math.round(R.roomT*10)/10,entered:true});
  G.S.roomsCleared++;if(st.pct>=1)G.S.fullClears++;if(R.hazardsHere===0)G.S.cleanRooms++;AU.door();
  if(G.roomIdx>=G.chain.length-1){endRun('win');return;}
  T.t+=addT;G.pending={pct:Math.round(st.pct*100),stars:stars3,addT,clearPts};
  const offer=PK.draw(G.chain[G.roomIdx+1].order);
  if(!offer.length){nextRoom();return;}
  G.phase='perk';IN.reset();UI.perkCards(offer);
}
function nextRoom(){G.roomIdx++;enterRoom();UI.hide();}
function endRun(reason){
  if(G.phase==='result')return;const S=G.S;S.reason=reason;
  if(reason==='win'){S.won=true;S.timeBonus=Math.round(T.t*5);G.score+=S.timeBonus;}
  else if(R.bossEaten){const st=roomStats();S.roomResults.push({order:R.scene.order,pct:Math.round(st.pct*100),stars:st.pct>=1?3:st.pct>=0.85?2:1,sec:0,entered:false});}
  if(!R.bossEaten&&R.boss)S.bossMiss={name:R.boss.def.name,n:nearMissN(R.boss)};
  S.score=G.score;S.roomsEntered=G.roomIdx+1;S.lastScene=R.scene.name;
  commit(S);G.phase='result';IN.reset();if(S.newRecord)AU.record();UI.result(S);
  try{if(window.SC&&typeof window.SC.over==='function')window.SC.over(G.score);}catch(e){}
}

// ===== 貪吃卡 =====
const PK={taken:{},offer:[],
  draw(order){const pool=C.perks.filter(p=>order>=p.min_order&&(PK.taken[p.id]||0)<p.max_stack);const rng=RNG((G.runSeed+order*101+G.roomIdx*7)>>>0);const out=[];
    while(out.length<3&&pool.length){const tot=pool.reduce((a,p)=>a+p.weight,0);let x=rng.next()*tot,i=0;for(;i<pool.length-1;i++){x-=pool[i].weight;if(x<0)break;}out.push(pool.splice(i,1)[0]);}
    PK.offer=out;return out;},
  choose(i){const p=PK.offer[i];if(!p)return;PK.taken[p.id]=(PK.taken[p.id]||0)+1;applyEffects(p.effects);G.S.perks.push(p.name);G.lastPerk=p;AU.ui('pick');nextRoom();}
};
function applyEffects(effs){effs.forEach(e=>{const v=e.v;switch(e.k){
  case'speed':P.speedMul=clamp(P.speedMul+v,0.4,2.5);break;case'capture':P.captureRatio=clamp(P.captureRatio+v,0.5,1.3);break;
  case'gain':P.gainMul=clamp(P.gainMul+v,0.3,3);break;case'combo_window':P.comboWindow=clamp(P.comboWindow+v,0.5,4);break;
  case'refund':P.refundMul=clamp(P.refundMul+v,0.3,3);break;case'magnet':P.magnet=clamp(P.magnet+v,0,200);break;
  case'hazard_guard':P.hazardMul=clamp(P.hazardMul-v,0,1);break;case'start_size':P.targetR+=v<=1?R0*v:v;break;
  case'points':P.pointsMul=clamp(P.pointsMul+v,0.3,3);break;case'time_now':T.t=Math.max(0,T.t+v);break;
  case'radar':P.radar+=v;break;case'slow_movers':P.moveMul=clamp(P.moveMul*(1-v),0.2,1.5);break;}});}

const zoomFor=r=>clamp(1.12-r/150,0.5,1);
const cam={x:0,y:0,zoom:1,shakeT:0,shakeDur:1,shakeAmp:0,ox:0,oy:0,slow:{t:0,scale:1},
  follow(dt){cam.zoom+=(zoomFor(P.r)-cam.zoom)*Math.min(1,dt*4);cam.x+=(P.x-cam.x)*Math.min(1,dt*10);cam.y+=(P.y-cam.y)*Math.min(1,dt*10);
    const vw=W/cam.zoom,vh=H/cam.zoom,b=R.bounds;cam.x=vw<b.w?clamp(cam.x,vw/2,b.w-vw/2):b.w/2;cam.y=vh<b.h?clamp(cam.y,vh/2,b.h-vh/2):b.h/2;
    if(cam.shakeT>0){cam.shakeT-=dt;const a=cam.shakeAmp*Math.max(0,cam.shakeT/cam.shakeDur);cam.ox=(Math.random()*2-1)*a;cam.oy=(Math.random()*2-1)*a;}else{cam.ox=cam.oy=0;}},
  shake(px,dur){cam.shakeAmp=px;cam.shakeT=dur;cam.shakeDur=dur;},slowmo(dur,s){cam.slow.t=dur;cam.slow.scale=s;},
  w2s(x,y){return{x:(x-cam.x)*cam.zoom+W/2+cam.ox,y:(y-cam.y)*cam.zoom+H/2+cam.oy};}
};

const FX={p:[],f:[],b:[],clear(){FX.p=[];FX.f=[];FX.b=[];},
  burst(x,y,color,n){for(let i=0;i<n;i++){if(FX.p.length>=300)FX.p.shift();const a=Math.random()*TAU,s=40+Math.random()*120;FX.p.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0,life:0.35+Math.random()*0.4,c:color,s:2+Math.random()*3});}},
  float(text,x,y,style){if(FX.f.length>40)FX.f.shift();FX.f.push({text,x,y,t:0,life:1.1,style:style||''});},
  banner(text,style,dur){FX.b.push({text,style:style||'',t:0,life:dur||1.6});},
  update(dt){FX.p=FX.p.filter(p=>(p.t+=dt)<p.life);FX.p.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.94;p.vy*=0.94;});
    FX.f=FX.f.filter(f=>(f.t+=dt)<f.life);FX.f.forEach(f=>{f.y-=40*dt;});FX.b=FX.b.filter(b=>(b.t+=dt)<b.life);},
  drawWorld(ctx){FX.p.forEach(p=>{ctx.globalAlpha=1-p.t/p.life;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,TAU);ctx.fill();});ctx.globalAlpha=1;},
  drawScreen(ctx){
    FX.f.forEach(f=>{const s=cam.w2s(f.x,f.y);const k=f.t/f.life;ctx.globalAlpha=1-k*k;const big=f.style==='big'||f.style==='perk';ctx.font=(big?'bold 20px':'bold 15px')+' sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,0.6)';ctx.strokeText(f.text,s.x,s.y);ctx.fillStyle={big:'#ffd35a',bad:'#ff6b6b',time:'#7ef0ff',near:'#ffe14d',perk:'#ffd35a'}[f.style]||'#fff';ctx.fillText(f.text,s.x,s.y);});ctx.globalAlpha=1;
    FX.b.forEach((b,i)=>{const k=b.t/b.life,sc=b.t<0.15?0.6+0.4*(b.t/0.15):1;ctx.globalAlpha=k>0.8?(1-k)/0.2:1;ctx.save();ctx.translate(W/2,200+i*38);ctx.scale(sc,sc);
      const col={tier:'#7ef0a0',boss:'#ff8c5a',gold:'#ffd35a',tip:'#ffffff',mod:'#8fd0ff',rec:'#ffe14d'}[b.style]||'#fff';ctx.font=(b.style==='boss'||b.style==='rec'?'bold 24px':'bold 17px')+' sans-serif';
      const tw=ctx.measureText(b.text).width+28;ctx.fillStyle='rgba(20,14,30,0.75)';ctx.fillRect(-tw/2,-18,tw,36);ctx.fillStyle=col;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.text,0,1);ctx.restore();});ctx.globalAlpha=1;}
};

const AU={ctx:null,master:null,muted:false,beatT:0,
  init(){if(AU.ctx)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;AU.ctx=new A();AU.master=AU.ctx.createGain();AU.master.gain.value=AU.muted?0:0.5;AU.master.connect(AU.ctx.destination);}catch(e){}},
  resume(){try{if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume().catch(()=>{});}catch(e){}},
  tone(f,type,dur,vol,t0,slide){if(!AU.ctx)return;try{const c=AU.ctx,t=c.currentTime+(t0||0),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(AU.master);o.start(t);o.stop(t+dur+0.02);}catch(e){}},
  noise(dur,vol,t0){if(!AU.ctx)return;try{const c=AU.ctx,n=Math.floor(c.sampleRate*dur),buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    const s=c.createBufferSource(),g=c.createGain();s.buffer=buf;g.gain.value=vol;s.connect(g);g.connect(AU.master);s.start(c.currentTime+(t0||0));}catch(e){}},
  eat(tier,combo){const f=220*Math.pow(2,Math.min(combo,24)/12)*Math.pow(2,(tier-1)*0.5);AU.tone(f,'triangle',0.12,0.25);AU.tone(f*2,'sine',0.08,0.08);if(tier>=3)AU.tone(f/2,'square',0.18,0.1);},
  thud(){AU.tone(120,'sine',0.18,0.4,0,45);AU.noise(0.08,0.15);},
  drop(){AU.tone(330,'sawtooth',0.25,0.12,0,110);},
  hazard(){AU.tone(180,'square',0.25,0.18,0,90);AU.tone(190,'sawtooth',0.25,0.1,0,80);},
  tierUp(){AU.tone(523,'sine',0.12,0.22);AU.tone(784,'sine',0.22,0.22,0.1);},
  boss(){[262,330,392,523].forEach((f,i)=>AU.tone(f,'sawtooth',0.7,0.1,i*0.05));AU.noise(0.3,0.2);},
  milestone(i){[0,4,7,12].forEach((s,k)=>AU.tone(440*Math.pow(2,(s+i*3)/12),'triangle',0.15,0.2,k*0.07));},
  door(){[392,494,587,784].forEach((f,i)=>AU.tone(f,'sine',0.25,0.2,i*0.08));},
  beat(){AU.tone(60,'sine',0.12,0.5,0,40);AU.tone(55,'sine',0.12,0.4,0.18,38);},
  record(){[523,659,784,1047,784,1047].forEach((f,i)=>AU.tone(f,'square',0.18,0.1,i*0.1));},
  ui(k){if(k==='mod')AU.tone(200,'sawtooth',0.4,0.12,0,120);else if(k==='pick')AU.tone(880,'sine',0.1,0.12);else AU.tone(660,'sine',0.06,0.1);},
  toggleMute(){AU.muted=!AU.muted;SV.muted=AU.muted;persist();if(AU.master)AU.master.gain.value=AU.muted?0:0.5;$('b-mute').textContent=AU.muted?'🔇':'🔊';$('b-mute2').textContent=AU.muted?'🔇':'🔊';}
};

const IN={active:false,pid:null,ax:0,ay:0,vx:0,vy:0,keys:{},moved:false,
  pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};},
  axis(){if(IN.active){const len=Math.hypot(IN.vx,IN.vy);if(len<1)return{x:0,y:0,mag:0};return{x:IN.vx/len,y:IN.vy/len,mag:Math.min(1,len/60)};}
    let x=0,y=0;const k=IN.keys;if(k.ArrowLeft||k.KeyA)x-=1;if(k.ArrowRight||k.KeyD)x+=1;if(k.ArrowUp||k.KeyW)y-=1;if(k.ArrowDown||k.KeyS)y+=1;const l=Math.hypot(x,y);return l?{x:x/l,y:y/l,mag:1}:{x:0,y:0,mag:0};},
  reset(){IN.active=false;IN.pid=null;IN.vx=IN.vy=0;IN.keys={};},
  markMoved(){if(!IN.moved){IN.moved=true;if(!SV.tips.includes('move')){SV.tips.push('move');persist();}}}
};
cv.addEventListener('pointerdown',e=>{e.preventDefault();AU.init();AU.resume();if(G.phase!=='run')return;const p=IN.pos(e);
  if(R&&R.intro<=0&&p.x>W-60&&p.y<52){pause();return;}
  IN.active=true;IN.pid=e.pointerId;IN.ax=p.x;IN.ay=p.y;IN.vx=IN.vy=0;IN.markMoved();try{cv.setPointerCapture(e.pointerId);}catch(err){}});
cv.addEventListener('pointermove',e=>{if(!IN.active||e.pointerId!==IN.pid)return;e.preventDefault();const p=IN.pos(e);IN.vx=p.x-IN.ax;IN.vy=p.y-IN.ay;const len=Math.hypot(IN.vx,IN.vy);
  if(len>60){IN.ax=p.x-IN.vx/len*60;IN.ay=p.y-IN.vy/len*60;IN.vx=p.x-IN.ax;IN.vy=p.y-IN.ay;}});
const endPtr=e=>{if(IN.pid!==null&&e.pointerId!==IN.pid)return;IN.active=false;IN.pid=null;IN.vx=IN.vy=0;};
['pointerup','pointercancel','lostpointercapture'].forEach(n=>cv.addEventListener(n,endPtr));

  if(c==='KeyM'){AU.toggleMute();return;}

  else if(G.phase==='pause'){if(c==='KeyP'||c==='Escape'||c==='Space'||c==='Enter')resume();}
  else if(G.phase==='perk'){const m=/^(Digit|Numpad)([1-3])$/.exec(c);if(m)PK.choose(+m[2]-1);}
  else if(G.phase==='title'){if(c==='Space'||c==='Enter')startRun(G.sel,'chain');}

$('ui').addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;AU.init();AU.resume();const act=el.dataset.act;
  if(act==='start')startRun(G.sel,'chain');else if(act==='daily')startRun(dailyInfo().order,'daily');else if(act==='dex')UI.dex();else if(act==='feats')UI.feats();
  else if(act==='mute')AU.toggleMute();else if(act==='back')UI.title();else if(act==='room'){const o=+el.dataset.order;if(o<=SV.unlocked){G.sel=o;AU.ui();UI.title();}}
  else if(act==='dexi')UI.dexInfo(+el.dataset.i);else if(act==='perk')PK.choose(+el.dataset.i);else if(act==='resume')resume();else if(act==='title')UI.title();
  else if(act==='retry')startRun(G.startOrder,G.mode);});

// ===== 繪製 =====
function pitColors(){const m=/^(#[0-9a-fA-F]{6}),(#[0-9a-fA-F]{6})$/.exec(SV.palette||'');return m?[m[1],m[2]]:['#2a1b3d','#6b4fbf'];}
function fmtT(t){if(t<10)return t.toFixed(1);const s=Math.ceil(t);return s>=60?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):String(s);}
function drawArrow(ctx,x,y,ang,color,label){ctx.save();ctx.translate(x,y);ctx.fillStyle='rgba(20,14,30,0.6)';ctx.beginPath();ctx.arc(0,0,22,0,TAU);ctx.fill();ctx.rotate(ang);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(-8,-9);ctx.lineTo(-4,0);ctx.lineTo(-8,9);ctx.fill();ctx.restore();
  ctx.font='11px sans-serif';ctx.fillStyle=color;ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(label,x,y+24);}
function drawTide(ctx){const m=R.mod,b=R.bounds;const wave=(i)=>6*Math.sin(i*0.15+G.now*4);ctx.save();
  let rx=0,ry=0,rw=b.w,rh=b.h,g;
  if(m.axis==='y'){if(m.dir<0){ry=m.pos;rh=b.h-m.pos;g=ctx.createLinearGradient(0,m.pos,0,m.pos-60);}else{rh=m.pos;g=ctx.createLinearGradient(0,m.pos,0,m.pos+60);}}
  else{if(m.dir<0){rx=m.pos;rw=b.w-m.pos;g=ctx.createLinearGradient(m.pos,0,m.pos-60,0);}else{rw=m.pos;g=ctx.createLinearGradient(m.pos,0,m.pos+60,0);}}
  ctx.fillStyle='rgba(80,160,220,0.45)';ctx.fillRect(rx,ry,rw,rh);
  g.addColorStop(0,'rgba(80,160,220,0.35)');g.addColorStop(1,'rgba(80,160,220,0)');ctx.fillStyle=g;
  if(m.axis==='y')ctx.fillRect(0,m.dir<0?m.pos-60:m.pos,b.w,60);else ctx.fillRect(m.dir<0?m.pos-60:m.pos,0,60,b.h);
  ctx.strokeStyle='#ffffff';ctx.lineWidth=5;ctx.beginPath();
  if(m.axis==='y'){for(let x=0;x<=b.w;x+=20){const y=m.pos+wave(x);x?ctx.lineTo(x,y):ctx.moveTo(x,y);}}else{for(let y=0;y<=b.h;y+=20){const x=m.pos+wave(y);y?ctx.lineTo(x,y):ctx.moveTo(x,y);}}
  ctx.stroke();ctx.restore();}
function drawDoor(ctx){const d=R.door,open=R.doorOpen;ctx.save();ctx.translate(d.x,d.y);
  if(open){const pul=0.6+0.4*Math.sin(G.now*5);ctx.fillStyle='rgba(255,215,90,'+(0.3*pul).toFixed(3)+')';ctx.beginPath();ctx.arc(0,0,DOOR_R*1.9,0,TAU);ctx.fill();}
  ctx.fillStyle=open?'#ffd35a':'rgba(0,0,0,0.15)';ctx.beginPath();ctx.arc(0,0,DOOR_R,0,TAU);ctx.fill();ctx.strokeStyle=open?'#b8860b':'rgba(0,0,0,0.3)';ctx.lineWidth=4;ctx.stroke();
  ctx.font='40px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.globalAlpha=open?1:0.45;ctx.fillText(open?'🚪':'🔒',0,3);ctx.restore();}
function drawObj(ctx,o){
  const d=o.def;let s=o.size,x=o.x,y=o.y,rot=0,alpha=1;
  if(o.eaten){const k=Math.min(1,o.sink/SINK_T);s=o.size*(1-k*0.9);x=lerp(o.sx,P.x,k*k);y=lerp(o.sy,P.y,k*k);rot=k*5;alpha=1-k*0.6;}
  const edible=o.size<=P.r*P.captureRatio;ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.globalAlpha=alpha;
  ctx.beginPath();ctx.arc(0,0,s,0,TAU);ctx.fillStyle=d.hazard?'rgba(230,70,70,'+(0.35+0.25*Math.sin(G.now*8)).toFixed(3)+')':(edible?'rgba(255,255,255,0.6)':'rgba(0,0,0,0.14)');ctx.fill();
  ctx.lineWidth=Math.max(2,s*0.12);ctx.strokeStyle=d.color;ctx.stroke();
  if(R.nearHi&&R.nearHi.o===o){ctx.lineWidth=4;ctx.strokeStyle='#ffe14d';ctx.beginPath();ctx.arc(0,0,s+6,0,TAU);ctx.stroke();}
  if(d.boss){ctx.fillStyle=d.color;ctx.beginPath();ctx.moveTo(-s*0.7,-s*0.5);ctx.lineTo(-s*0.5,-s*1.15);ctx.lineTo(-s*0.15,-s*0.8);ctx.fill();ctx.beginPath();ctx.moveTo(s*0.7,-s*0.5);ctx.lineTo(s*0.5,-s*1.15);ctx.lineTo(s*0.15,-s*0.8);ctx.fill();}
  ctx.font=Math.round(s*1.35)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#333';ctx.fillText(d.glyph,0,s*0.06);ctx.restore();
}
function drawPit(ctx){
  const r=P.r*(P.squash>0?1.06:1),c=pitColors();ctx.save();ctx.translate(P.x,P.y);
  const g=ctx.createRadialGradient(0,0,r*0.15,0,0,r*1.15);g.addColorStop(0,c[1]);g.addColorStop(0.55,c[0]);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r*1.15,0,TAU);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=Math.max(1.5,r*0.06);ctx.beginPath();const t=G.now*3;
  for(let i=0;i<3;i++){const a0=t+i*2.094;for(let k=0;k<=12;k++){const rr=r*(0.15+0.75*k/12),a=a0+k*0.35;const px=Math.cos(a)*rr,py=Math.sin(a)*rr;k?ctx.lineTo(px,py):ctx.moveTo(px,py);}}ctx.stroke();
  ctx.fillStyle=c[0];[-1,1].forEach(sg=>{ctx.beginPath();ctx.moveTo(sg*r*0.75,-r*0.45);ctx.lineTo(sg*r*0.55,-r*1.2);ctx.lineTo(sg*r*0.15,-r*0.85);ctx.fill();}); // 貓耳
  const sp=Math.hypot(P.vx,P.vy),ex=sp>5?P.vx/sp*r*0.06:0,ey=sp>5?P.vy/sp*r*0.06:0;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-r*0.3,-r*0.15,r*0.15,0,TAU);ctx.arc(r*0.3,-r*0.15,r*0.15,0,TAU);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-r*0.3+ex,-r*0.15+ey,r*0.07,0,TAU);ctx.arc(r*0.3+ex,-r*0.15+ey,r*0.07,0,TAU);ctx.fill();
  if(R.combo>0&&R.comboT>0){ctx.strokeStyle='#ffd35a';ctx.lineWidth=Math.max(2,r*0.08);ctx.beginPath();ctx.arc(0,0,r+8,-Math.PI/2,-Math.PI/2+TAU*(R.comboT/P.comboWindow));ctx.stroke();} // 連吞窗口環
  ctx.restore();
}
function drawWorld(ctx){
  const pal=R.scene.palette,b=R.bounds,z=cam.zoom,fog=R.mod.type==='fog'&&R.mod.active;
  ctx.fillStyle='#1d1626';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(W/2+cam.ox,H/2+cam.oy);ctx.scale(z,z);ctx.translate(-cam.x,-cam.y);
  const vx0=cam.x-W/2/z,vy0=cam.y-H/2/z,vx1=cam.x+W/2/z,vy1=cam.y+H/2/z;
  ctx.fillStyle=pal.bg;ctx.fillRect(0,0,b.w,b.h);
  ctx.strokeStyle=pal.grid;ctx.lineWidth=1;ctx.beginPath();for(let x=0;x<=b.w;x+=80){ctx.moveTo(x,0);ctx.lineTo(x,b.h);}for(let y=0;y<=b.h;y+=80){ctx.moveTo(0,y);ctx.lineTo(b.w,y);}ctx.stroke();
  ctx.strokeStyle=pal.accent;ctx.lineWidth=6;ctx.strokeRect(0,0,b.w,b.h);
  if(R.mod.type==='tide'&&R.mod.active)drawTide(ctx);
  drawDoor(ctx);
  for(const o of R.objs){if(o.x<vx0-o.size||o.x>vx1+o.size||o.y<vy0-o.size||o.y>vy1+o.size)continue;if(!fog)o.seen=true;else if(!o.seen&&!o.eaten)continue;drawObj(ctx,o);}
  drawPit(ctx);FX.drawWorld(ctx);
  if(fog){const fr=R.mod.fogR;const g=ctx.createRadialGradient(P.x,P.y,fr*0.6,P.x,P.y,fr);g.addColorStop(0,'rgba(20,14,30,0)');g.addColorStop(1,'rgba(20,14,30,0.78)');ctx.fillStyle=g;ctx.fillRect(vx0-10,vy0-10,vx1-vx0+20,vy1-vy0+20);}
  ctx.restore();
}
function drawHUD(ctx){
  const acc=R.scene.palette.accent,st=roomStats();
  ctx.fillStyle='rgba(20,14,30,0.72)';ctx.fillRect(0,0,W,52);
  G.dispScore+=(G.score-G.dispScore)*0.2;if(Math.abs(G.score-G.dispScore)<1)G.dispScore=G.score;
  ctx.fillStyle='#fff';ctx.font='bold 20px sans-serif';ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(String(Math.round(G.dispScore)),10,6);
  const recT=G.best<=0?'首趟・立下紀錄':(G.score>G.best?'新紀錄！':'距紀錄 −'+(G.best-G.score));
  ctx.font='11px sans-serif';ctx.fillStyle=G.score>G.best&&G.best>0?'#ffd35a':'#cbbfd6';ctx.fillText(recT,10,32);
  const low=T.t<LOW_T;ctx.textAlign='center';ctx.font='bold 28px sans-serif';ctx.fillStyle=low&&Math.sin(G.now*10)>0?'#ff5a5a':'#fff';ctx.fillText(fmtT(T.t),W/2,10);
  ctx.textAlign='right';ctx.font='12px sans-serif';ctx.fillStyle='#e8dcc8';ctx.fillText('第'+R.scene.order+'房 '+R.scene.name,W-42,8);
  ctx.font='11px sans-serif';ctx.fillStyle='#bbb';ctx.fillText(G.mode==='daily'?'每日一房':'串 '+(G.roomIdx+1)+'/'+G.chain.length,W-42,27);
  ctx.font='20px sans-serif';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText('⏸',W-20,14);
  ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillRect(10,58,W-50,12);ctx.fillStyle=acc;ctx.fillRect(10,58,(W-50)*st.pct,12); // 清房進度條
  ctx.fillStyle='#fff';ctx.font='bold 10px sans-serif';ctx.textAlign='left';ctx.fillText('清房 '+Math.round(st.pct*100)+'%'+(R.washed?'（沖走 '+R.washed+'）':''),14,59);
  ctx.font='18px sans-serif';ctx.textAlign='center';ctx.fillText(R.bossEaten?'✔':(R.boss?R.boss.def.glyph:'🐱'),W-24,55);
  R.pips.forEach((p,i)=>{const x=10+i*38,y=H-46,fl=p.flash>0?1+0.3*Math.sin(p.flash*Math.PI):1;ctx.save();ctx.translate(x+16,y+16);ctx.scale(fl,fl); // 吞得下燈
    ctx.fillStyle=p.lit?TIER_COLOR[p.tier]:'rgba(20,14,30,0.6)';ctx.beginPath();ctx.arc(0,0,16,0,TAU);ctx.fill();ctx.globalAlpha=p.lit?1:0.35;ctx.font='18px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.glyph,0,1);ctx.restore();});
  ctx.font='10px sans-serif';ctx.fillStyle='#e8dcc8';ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText('吞得下 ＝ 亮燈',10,H-60);
  const m=R.mod;if(m.type!=='none'){const nm={leak:'⬇ 漏淵',fog:'🌫 濃霧',tide:'🌊 潮水'}[m.type];let txt='';if(m.active)txt=nm+(m.type==='leak'?' 中（半徑流失）':' 中');else if(R.scene.mod_at-R.roomT<=8)txt=nm+' '+Math.ceil(R.scene.mod_at-R.roomT)+' 秒後';
    if(txt){ctx.font='bold 12px sans-serif';ctx.fillStyle=m.active&&Math.sin(G.now*4)>0?'#ff8c5a':'#ffd35a';ctx.fillText(txt,10,H-76);}}
  if(P.magnet||P.speedMul!==1||P.captureRatio!==CAP){ctx.font='10px sans-serif';ctx.fillStyle='#bfb3cc';ctx.fillText('🎴 卡 ×'+G.S.perks.length,10,H-90);}
  if(R.doorOpen){drawArrow(ctx,W-40,H-52,Math.atan2(R.door.y-P.y,R.door.x-P.x),'#ffd35a','貓門');}
  else if(P.radar>0){let best=null;const cap=P.r*P.captureRatio;R.objs.forEach(o=>{if(!o.eaten&&!o.hazard&&o.size<=cap&&(!best||o.def.gain>best.def.gain))best=o;});if(best)drawArrow(ctx,W-40,H-52,Math.atan2(best.y-P.y,best.x-P.x),'#7ef0ff','雷達');}
  else if(!R.bossEaten&&R.boss){drawArrow(ctx,W-40,H-52,Math.atan2(R.boss.y-P.y,R.boss.x-P.x),'rgba(255,255,255,0.55)','房東');}
  if(R.combo>=2){const s=cam.w2s(P.x,P.y);ctx.font='bold 18px sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,0.6)';const tx='×'+R.combo,px=s.x+P.r*cam.zoom+12,py=s.y-P.r*cam.zoom-6;ctx.strokeText(tx,px,py);ctx.fillStyle='#ffd35a';ctx.fillText(tx,px,py);}
  if(R.taunt&&R.boss){const s=cam.w2s(R.boss.x,R.boss.y-R.boss.size*1.3);ctx.font='bold 13px sans-serif';const tw=ctx.measureText(R.taunt.text).width+20;ctx.fillStyle='#fff';ctx.beginPath();ctx.roundRect?ctx.roundRect(s.x-tw/2,s.y-28,tw,26,8):ctx.rect(s.x-tw/2,s.y-28,tw,26);ctx.fill();
    ctx.fillStyle='#333';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(R.taunt.text,s.x,s.y-15);}
  if(IN.active){ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(IN.ax,IN.ay,60,0,TAU);ctx.stroke();ctx.fillStyle='rgba(255,255,255,0.4)';ctx.beginPath();ctx.arc(IN.ax+IN.vx,IN.ay+IN.vy,16,0,TAU);ctx.fill();}
  if(T.t<LOW_T&&R.intro<=0){const g=ctx.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.75);g.addColorStop(0,'rgba(255,40,40,0)');g.addColorStop(1,'rgba(255,40,40,'+(0.3+0.2*Math.sin(G.now*6)).toFixed(3)+')');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
  FX.drawScreen(ctx);
  if(!IN.moved&&!SV.tips.includes('move')&&R.intro<=0){const a=G.now*2;ctx.font='30px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('👆',W/2+Math.cos(a)*36,H*0.72+Math.sin(a)*36);
    ctx.font='bold 14px sans-serif';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,0.6)';ctx.strokeText('按住任何地方拖曳移動喵淵',W/2,H*0.72+60);ctx.fillStyle='#fff';ctx.fillText('按住任何地方拖曳移動喵淵',W/2,H*0.72+60);}
  if(R.intro>0){ctx.fillStyle='rgba(20,14,30,'+Math.min(0.7,R.intro).toFixed(3)+')';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#ffd58a';ctx.font='bold 28px sans-serif';ctx.fillText('第 '+R.scene.order+' 房 '+R.scene.name,W/2,H/2-30);
    ctx.fillStyle='#fff';ctx.font='16px sans-serif';ctx.fillText(R.scene.intro,W/2,H/2+10);ctx.font='13px sans-serif';ctx.fillStyle='#cbbfd6';ctx.fillText('吞下房東 '+(R.boss?R.boss.def.glyph+' '+R.boss.def.name:'')+' 才能開門',W/2,H/2+40);}
}
function render(){cx.setTransform(scale*dpr,0,0,scale*dpr,0,0);if(!R){cx.fillStyle='#2a2033';cx.fillRect(0,0,W,H);return;}drawWorld(cx);drawHUD(cx);}
function resize(){const vw=window.innerWidth,vh=window.innerHeight;scale=Math.min(vw/W,vh/H);dpr=Math.min(3,window.devicePixelRatio||1);
  cv.width=Math.round(W*scale*dpr);cv.height=Math.round(H*scale*dpr);cv.style.width=W*scale+'px';cv.style.height=H*scale+'px';
  const wrap=$('wrap');wrap.style.width=W*scale+'px';wrap.style.height=H*scale+'px';wrap.style.left=Math.floor((vw-W*scale)/2)+'px';wrap.style.top=Math.floor((vh-H*scale)/2)+'px';$('ui').style.transform='scale('+scale+')';}
window.addEventListener('resize',resize);

// ===== 主迴圈（固定步長累積）=====
let last=0,acc=0;
function frame(now){requestAnimationFrame(frame);let dt=(now-last)/1000;last=now;if(!(dt>0))dt=0;if(dt>0.05)dt=0.05;G.now+=dt;
  try{if(G.phase==='run'){acc+=dt;let n=0;while(acc>=STEP&&n<8&&G.phase==='run'){tickRun(STEP);acc-=STEP;n++;}if(n>=8)acc=0;}else acc=0;render();}catch(e){acc=0;}}

// ===== 品管掛鉤 =====
window.SC_HOOKS={start(){startRun(G.sel||1,'chain');},snapshot(){const st=R?roomStats():null;return{phase:G.phase,mode:G.mode,scene:R?R.scene.id:null,level:R?R.scene.order:0,room:G.roomIdx+1,rooms:G.chain.length,score:G.score,elapsed:Math.round(G.runElapsed*10)/10,
  time:Math.round(T.t*10)/10,radius:Math.round(P.r*10)/10,combo:R?R.combo:0,pct:st?Math.round(st.pct*100):0,bossEaten:!!(R&&R.bossEaten),doorOpen:!!(R&&R.doorOpen),mod:R?R.mod.type:null,modActive:!!(R&&R.mod.active),objects:R?R.objs.length:0,best:SV.best_score,unlocked:SV.unlocked,runs:SV.runs};}};

// ===== 啟動 =====
function boot(){loadContent();loadSave();AU.muted=!!SV.muted;resize();G.sel=Math.max(1,Math.min(SV.unlocked,C.scenes.length));UI.title();last=performance.now();requestAnimationFrame(frame);}
boot();
})();
