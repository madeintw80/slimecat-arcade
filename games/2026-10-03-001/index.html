<!--CONTENT-NOTES
《喵掌上架王》引擎實際讀取的欄位（缺欄位給預設、超界自動 clamp；可修復的錯誤以 console.warn 列出並自動修正；未知 goods 引用、未知 rule、未知 effect、goods 或 shifts 全空屬致命錯誤，以 console.error 列出並阻擋開局）
[goods] 任意筆數（建議 6 筆）
  id：字串唯一（shifts.categories 引用）；name：2～4 字，顯示在貨架標籤
  shape：can | fish | ball | cookie | wand | pouch（未知值依序補一個）
  hue：0～360 標籤底色；variants：5 個字串（不足補「款N」，超過忽略）
  variant_hues：5 個 0～360，與 variants 一一對應，相鄰差 ≥40 手機才分得清
[shifts] 任意筆數，依陣列順序成為班 1、班 2…；班 n 通關即解鎖 n+1
  name、intro（開局橫幅顯示，20 字內）
  rows：1～4 排（多的忽略）{slots 3～6, rule any|distinct|ordered（未知→錯誤，阻擋開局）, open_at 秒}
    distinct／ordered 排的 slots 會被壓到 ≤5；第一排 open_at 強制 0，之後不得小於前一排
  categories：goods.id 陣列；未知 id 為錯誤並阻擋開局；數量不足時用其他 goods 補（goods 太少時允許兩排同類）
    rotate=false：第 k 排固定用 categories[k]；rotate=true：前 N 個先上架，出貨後換成「目前沒上架」的類別
  helpful_ratio 0.2～0.95；inflow [{t, every}]：every 1.8～10，自動依 t 排序、強制遞減；
    第一段 every 會被壓到 ≤ 60 / floor_cap（保證不操作 60 秒內打烊）
  floor_cap 8～20（混裝箱佔 3）；buffer_slots 1～4；wash bool（有 dust 事件時強制 true）
  events [{t 0～3600, kind dust|crate|gust, ratio 0～0.6（dust 用）, every 10～180（crate／gust 用）}]
  goal_ships 1～99；skill_at 整數陣列（出貨排數里程碑，達到時彈爪技二選一）
  treasure_chance 0～0.15；par_time 30～1800（勝利加時獎勵 =(par_time−用時)×5）；stars [二星分, 三星分]
[skills] 任意筆數（任何班次可抽池 ≥3 最好）
  effect：stack_grab | magnet | buffer_plus | slow_chute | quick_wash | row_hint | combo_hold | crate_pop（未知→錯誤，阻擋開局）
  value 範圍：stack_grab 2～4（上架時同類同色一起跟上的總件數）；magnet 3～12（冷卻秒，點排標籤或按 Q 吸一件）；
    buffer_plus 1～2（暫放區總上限 5）；slow_chute 0.4～0.9（傳送口速度倍率）；quick_wash 0～1（水盆秒數）；
    row_hint 0.3～0.8（排填滿比例達此值時優先補缺）；combo_hold 3.5～8（連擊寬限秒）；crate_pop 固定 1
  duration 0～300（0＝整局）；min_shift 1 起；name 4 字內；desc 16 字內（選取時浮動顯示）
  沒水盆的班次不會抽到 quick_wash；沒 crate 事件的班次不會抽到 crate_pop；同次二選一不會同 effect
[treasures] 任意筆數
  shape：star | crown | fishbone | bell | coin | gem；hue 0～360；rarity 1～3；weight 0.05～20；
  min_shift 1 起；points 50～1000；name 6 字內；lore 24 字內（圖鑑點選顯示）
-->

(function(){

let G=null,NOW=0,SCALE=1,btns=[];

// ===== content：載入與驗證內容包 =====
const GOOD_SHAPES=['can','fish','ball','cookie','wand','pouch'];

const C={packs:{goods:[],shifts:[],skills:[],treasures:[]},gmap:{},errors:[],warns:[],ok:false,

  const raw=window.SC_CONTENT||{};const arr=k=>Array.isArray(raw[k])?raw[k].filter(o=>o&&typeof o==='object'):[];
  this.errors=[];this.warns=[];const warn=m=>this.warns.push(m),err=m=>this.errors.push(m);

   goods.push({id,name:str(g.name,id),shape,hue:num(g.hue,30,0,360),variants:vars,vh:hues});});

  const shifts=[],sseen={};

   let rows=(Array.isArray(s.rows)?s.rows:[]).filter(r=>r&&typeof r==='object').slice(0,4);

    let n=Math.round(num(r.slots,5,3,6));if(rule!=='any')n=Math.min(n,5);
    const oa=k===0?0:Math.max(last,num(r.open_at,k*20,0,600));last=oa;return {n,rule,open:oa};});
   let cats=(Array.isArray(s.categories)?s.categories:[]).filter(c=>{if(gids.indexOf(c)<0){err(id+' 未知 goods id：'+c);return false;}return true;});
   cats=cats.filter((c,k)=>cats.indexOf(c)===k);
   const rotate=!!s.rotate,need=rows.length+(rotate?1:0);
   for(const g of gids){if(cats.length>=need)break;if(cats.indexOf(g)<0)cats.push(g);}
   if(!cats.length&&gids.length)cats=[gids[0]];
   const cap=Math.round(num(s.floor_cap,14,8,20));
   let inflow=(Array.isArray(s.inflow)?s.inflow:[]).filter(o=>o&&typeof o==='object').map(o=>({t:num(o.t,0,0,3600),every:num(o.every,3.2,1.8,10)})).sort((a,b)=>a.t-b.t);
   if(!inflow.length)inflow=[{t:0,every:4},{t:60,every:3.2}];

   for(let k=1;k<inflow.length;k++)inflow[k].every=Math.min(inflow[k].every,inflow[k-1].every);
   const events=[];
   (Array.isArray(s.events)?s.events:[]).forEach(e=>{if(!e||['dust','crate','gust'].indexOf(e.kind)<0){warn(id+' 未知 event kind：'+(e&&e.kind));return;}
    events.push({kind:e.kind,t:num(e.t,150,0,3600),ratio:num(e.ratio,0.25,0,0.6),every:num(e.every,40,10,180)});});

   const skAt=(Array.isArray(s.skill_at)?s.skill_at:[]).map(v=>Math.round(num(v,2,1,99))).sort((a,b)=>a-b);
   const st=Array.isArray(s.stars)?s.stars:[];const s2=Math.round(num(st[0],goal*150,0,1e7)),s3=Math.max(s2+1,Math.round(num(st[1],s2*1.35,0,1e7)));
   shifts.push({id,name:str(s.name,'第 '+(i+1)+' 班'),intro:str(s.intro,'把雜物放回對的貨架'),rows,cats,rotate,hr:num(s.helpful_ratio,0.6,0.2,0.95),inflow,cap,

// ===== save：存檔 =====
const KEY='sc_meow_shelf_v1';
const S={d:null,

  const b=this.def();
  if(d&&typeof d==='object'){for(const k in b){if(d[k]!=null&&typeof d[k]===typeof b[k]&&Array.isArray(d[k])===Array.isArray(b[k]))b[k]=d[k];}}
  b.v=1;b.unlocked=Math.max(1,Math.round(+b.unlocked||1));this.d=b;return b;},

};
function dayStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
// 連續上班日
function touchDay(){const t=dayStr(new Date());if(S.d.lastDay===t)return;const y=dayStr(new Date(Date.now()-864e5));S.commit({streak:S.d.lastDay===y?(S.d.streak||0)+1:1,lastDay:t});}

// ===== audio：WebAudio 合成 =====
const AU={ctx:null,muted:false,nb:null,
 init(){if(this.ctx)return;try{const A=window.AudioContext||window.webkitAudioContext;if(A)this.ctx=new A();}catch(e){this.ctx=null;}},
 resume(){this.init();if(this.ctx&&this.ctx.state==='suspended'){try{this.ctx.resume();}catch(e){}}},

  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+0.05);}catch(e){}},

  if(!this.nb){const n=Math.floor(c.sampleRate*0.6);this.nb=c.createBuffer(1,n,c.sampleRate);const a=this.nb.getChannelData(0);for(let i=0;i<n;i++)a[i]=R()*2-1;}
  const t=c.currentTime+(delay||0);const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=this.nb;f.type='bandpass';f.frequency.value=fr||800;
  g.gain.setValueAtTime(vol||0.2,t);g.gain.exponentialRampToValueAtTime(0.0001,t+Math.min(0.58,d));s.connect(f);f.connect(g);g.connect(c.destination);s.start(t);s.stop(t+Math.min(0.6,d+0.02));}catch(e){}},
 click(step){const sc=[0,2,4,7,9,12,14,16,19,21,24];const f=261.63*Math.pow(2,sc[clamp(step|0,0,10)]/12);this.tone(f,0.13,'triangle',0.24);this.tone(f*2,0.05,'square',0.04);},

 miss(){this.tone(190,0.16,'sine',0.25,75);this.noise(0.08,0.08,350);},

 ding(){this.tone(1568,0.4,'sine',0.16);this.tone(2093,0.5,'sine',0.11,0,0.08);},
 whoosh(){this.noise(0.5,0.22,900);},
 lift(){this.tone(660,0.05,'sine',0.08,880);},
 thud(){this.tone(130,0.09,'sine',0.12,60);},

// ===== fx：粒子、浮動文字、震動 =====
const FX={ps:[],fl:[],shakeT:0,pawT:0,
 reset(){this.ps=[];this.fl=[];this.shakeT=0;this.pawT=0;},
 burst(x,y,h,n,sp){for(let i=0;i<(n||12);i++){const a=R()*6.283,v=(sp||120)*(0.3+R()*0.9);this.ps.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-50,l:0.4+R()*0.5,m:0.9,h,s:2+R()*3});}
  if(this.ps.length>500)this.ps.splice(0,this.ps.length-500);},

 tick(dt){for(const p of this.ps){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=380*dt;p.l-=dt;}this.ps=this.ps.filter(p=>p.l>0);
  for(const f of this.fl){f.y-=26*dt;f.l-=dt;}this.fl=this.fl.filter(f=>f.l>0);if(this.shakeT>0)this.shakeT-=dt;if(this.pawT>0)this.pawT-=dt;},
 draw(c){
  if(this.pawT>0){c.globalAlpha=Math.min(1,this.pawT)*0.45;pawAt(c,200,300,80*(1.4-this.pawT*0.4),'#ffe066');c.globalAlpha=1;}
  for(const p of this.ps){c.globalAlpha=Math.min(1,p.l/p.m*1.5);c.fillStyle=p.h<0?'#d8d8d8':'hsl('+p.h+',90%,65%)';c.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s);}
  c.globalAlpha=1;
  for(const f of this.fl){const age=f.m-f.l,sc=age<0.12?0.6+age/0.12*0.5:1.1-Math.min(0.1,age-0.12);c.globalAlpha=Math.min(1,f.l/0.35);
   c.save();c.translate(f.x,f.y);c.scale(sc,sc);c.font='bold '+f.z+'px '+FONT;c.textAlign='center';c.textBaseline='middle';
   c.lineWidth=3;c.strokeStyle='rgba(0,0,0,0.65)';c.strokeText(f.s,0,0);c.fillStyle=f.c;c.fillText(f.s,0,0);c.restore();}
  c.globalAlpha=1;}
};

// ===== 繪圖工具 =====
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function txt(c,s,x,y,size,col,align){c.font='bold '+size+'px '+FONT;c.fillStyle=col;c.textAlign=align||'center';c.textBaseline='middle';c.fillText(s,x,y);}
function fit(c,s,w){if(c.measureText(s).width<=w)return s;while(s.length>1&&c.measureText(s+'…').width>w)s=s.slice(0,-1);return s+'…';}
function txtFit(c,s,x,y,size,col,maxW,align){c.font='bold '+size+'px '+FONT;txt(c,fit(c,s,maxW),x,y,size,col,align);}
function wrapTxt(c,s,x,y,size,col,maxW,lh){c.font='bold '+size+'px '+FONT;let line='',yy=y;for(const ch of s){if(c.measureText(line+ch).width>maxW){txt(c,line,x,yy,size,col);line=ch;yy+=lh;}else line+=ch;}if(line)txt(c,line,x,yy,size,col);}
function fmt(t){t=Math.max(0,Math.floor(t));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
// 貓掌圖
function pawAt(c,x,y,s,col){c.fillStyle=col;c.beginPath();c.ellipse(x,y+s*0.35,s*0.55,s*0.45,0,0,7);c.fill();
 [[-0.62,-0.25],[-0.22,-0.62],[0.22,-0.62],[0.62,-0.25]].forEach(p=>{c.beginPath();c.ellipse(x+p[0]*s,y+p[1]*s,s*0.2,s*0.26,0,0,7);c.fill();});}
// 向量圖形（貨品與珍品）；sil=剪影
function drawShape(c,shape,r,h,sil){
 const f=sil?'#2a2433':'hsl('+h+',72%,60%)',d=sil?'#4a4258':'hsl('+h+',55%,27%)',l=sil?'#2a2433':'hsl('+h+',85%,85%)';
 c.lineWidth=2;c.strokeStyle=d;c.fillStyle=f;c.lineJoin='round';c.lineCap='round';
 switch(shape){
 case 'can':rr(c,-r*0.7,-r*0.8,r*1.4,r*1.6,r*0.25);c.fill();c.stroke();c.fillStyle=l;c.fillRect(-r*0.7+1,-r*0.2,r*1.4-2,r*0.45);
  c.fillStyle=d;c.beginPath();c.ellipse(0,-r*0.78,r*0.6,r*0.16,0,0,7);c.fill();break;
 case 'fish':c.beginPath();c.ellipse(-r*0.15,0,r*0.75,r*0.45,0,0,7);c.fill();c.stroke();c.beginPath();c.moveTo(r*0.5,0);c.lineTo(r*0.95,-r*0.45);c.lineTo(r*0.95,r*0.45);c.closePath();c.fill();c.stroke();
  c.fillStyle=d;c.beginPath();c.arc(-r*0.55,-r*0.08,r*0.09,0,7);c.fill();break;
 case 'ball':c.beginPath();c.arc(0,0,r*0.8,0,7);c.fill();c.save();c.clip();c.strokeStyle=l;c.lineWidth=1.6;
  for(let i=-1;i<=1;i++){c.beginPath();c.arc(i*r*0.55,-r,r*1.05,0.3,2.8);c.stroke();}c.restore();c.beginPath();c.arc(0,0,r*0.8,0,7);c.strokeStyle=d;c.lineWidth=2;c.stroke();break;
 case 'cookie':c.beginPath();c.arc(0,0,r*0.78,0,7);c.fill();c.stroke();c.fillStyle=d;
  [[-0.3,-0.25],[0.3,-0.1],[-0.05,0.35],[0.35,0.38],[-0.42,0.2]].forEach(p=>{c.beginPath();c.arc(p[0]*r,p[1]*r,r*0.1,0,7);c.fill();});break;
 case 'wand':c.lineWidth=3;c.beginPath();c.moveTo(-r*0.65,r*0.8);c.lineTo(r*0.25,-r*0.25);c.stroke();c.lineWidth=1.5;
  for(let i=0;i<5;i++){const a=-Math.PI/4-0.8+i*0.4;c.beginPath();c.ellipse(r*0.3+Math.cos(a)*r*0.38,-r*0.3+Math.sin(a)*r*0.38,r*0.34,r*0.12,a,0,7);c.fillStyle=f;c.fill();c.stroke();}break;
 case 'pouch':c.beginPath();c.moveTo(-r*0.45,-r*0.55);c.lineTo(r*0.45,-r*0.55);c.quadraticCurveTo(r*0.95,r*0.8,0,r*0.8);c.quadraticCurveTo(-r*0.95,r*0.8,-r*0.45,-r*0.55);c.fill();c.stroke();
  c.fillStyle=d;c.fillRect(-r*0.5,-r*0.66,r,r*0.16);c.fillStyle=l;c.beginPath();c.ellipse(0,r*0.15,r*0.16,r*0.3,0.5,0,7);c.fill();break;
 case 'star':c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*0.42:r*0.92;c.lineTo(Math.cos(a)*q,Math.sin(a)*q);}c.closePath();c.fill();c.stroke();break;
 case 'crown':c.beginPath();c.moveTo(-r*0.8,r*0.5);c.lineTo(-r*0.8,-r*0.4);c.lineTo(-r*0.4,0);c.lineTo(0,-r*0.7);c.lineTo(r*0.4,0);c.lineTo(r*0.8,-r*0.4);c.lineTo(r*0.8,r*0.5);c.closePath();c.fill();c.stroke();break;
 case 'fishbone':c.lineWidth=3;c.strokeStyle=f;c.beginPath();c.moveTo(-r*0.4,0);c.lineTo(r*0.6,0);
  for(let i=0;i<3;i++){const x=-r*0.15+i*r*0.26;c.moveTo(x,-r*0.4);c.lineTo(x+r*0.1,0);c.lineTo(x,r*0.4);}
  c.moveTo(r*0.6,0);c.lineTo(r*0.9,-r*0.35);c.moveTo(r*0.6,0);c.lineTo(r*0.9,r*0.35);c.stroke();
  c.beginPath();c.arc(-r*0.6,0,r*0.28,0,7);c.fill();c.lineWidth=2;c.strokeStyle=d;c.stroke();break;
 case 'bell':c.beginPath();c.moveTo(-r*0.75,r*0.5);c.quadraticCurveTo(-r*0.6,-r*0.8,0,-r*0.8);c.quadraticCurveTo(r*0.6,-r*0.8,r*0.75,r*0.5);c.closePath();c.fill();c.stroke();
  c.fillStyle=d;c.beginPath();c.arc(0,r*0.62,r*0.15,0,7);c.fill();break;
 case 'coin':c.beginPath();c.arc(0,0,r*0.8,0,7);c.fill();c.stroke();c.beginPath();c.arc(0,0,r*0.58,0,7);c.stroke();pawAt(c,0,0,r*0.32,d);break;
 case 'gem':c.beginPath();c.moveTo(-r*0.8,-r*0.25);c.lineTo(-r*0.4,-r*0.7);c.lineTo(r*0.4,-r*0.7);c.lineTo(r*0.8,-r*0.25);c.lineTo(0,r*0.85);c.closePath();c.fill();c.stroke();
  c.beginPath();c.moveTo(-r*0.8,-r*0.25);c.lineTo(r*0.8,-r*0.25);c.moveTo(-r*0.25,-r*0.25);c.lineTo(0,r*0.85);c.lineTo(r*0.25,-r*0.25);c.stroke();break;
 default:c.beginPath();c.arc(0,0,r*0.8,0,7);c.fill();c.stroke();}
}
function hueOf(it){if(it.kind==='tr')return it.tr.hue;if(it.kind==='crate')return 30;const g=C.goods(it.cat);return g?g.vh[it.v]:0;}
// 畫一件物品（含回彈、squash-stretch 動畫）
function drawItem(c,it,x,y,sc,ghost,sil){let px=x,py=y,sx=1,sy=1;
 if(!ghost){if(it.ret){const p=(NOW-it.ret.at)/0.22;if(p>=1||p<0)it.ret=null;else{const e=1-(1-p)*(1-p);px=lerp(it.ret.x,x,e);py=lerp(it.ret.y,y,e);}}
  if(it.sqAt){const p=(NOW-it.sqAt)/0.4;if(p>=0&&p<1){const k=Math.sin(p*Math.PI*2.5)*(1-p)*0.3;sx=1+k;sy=1-k;}}}
 c.save();c.translate(px,py+(1-sy)*14*sc);c.scale(sc*sx,sc*sy);if(ghost)c.globalAlpha=0.45;
 if(it.kind==='crate'){rr(c,-26,-21,52,42,5);c.fillStyle=sil?'#2a2433':'#a8743e';c.fill();c.strokeStyle='#5a3a1c';c.lineWidth=2;c.stroke();
  if(!sil){c.fillStyle='#e0c07c';c.fillRect(-26,-5,52,10);c.fillRect(-5,-21,10,42);txt(c,'×3',15,12,10,'#5a3a1c');
   if(it.hits>0){c.strokeStyle='#2a1a0a';c.lineWidth=2;c.beginPath();c.moveTo(-16,-19);c.lineTo(-7,-6);c.lineTo(-13,4);c.lineTo(-3,18);c.stroke();}}}
 else if(it.kind==='tr'){if(!sil){c.shadowColor='#ffd84a';c.shadowBlur=12;}drawShape(c,it.tr.shape,19,it.tr.hue,sil);c.shadowBlur=0;
  if(!sil){c.strokeStyle='#ffd84a';c.lineWidth=2;c.beginPath();c.arc(0,0,22,0,7);c.stroke();const tw=(NOW*2+it.id*0.37)%2;
   if(tw<1){c.fillStyle='rgba(255,255,255,'+(1-tw).toFixed(2)+')';c.beginPath();c.arc(13,-14,3*(1-tw)+1,0,7);c.fill();}}}
 else{const g=C.goods(it.cat);if(g)drawShape(c,g.shape,19,g.vh[it.v],sil);
  if(it.dusty&&!sil){c.fillStyle='rgba(95,85,80,0.8)';[[-8,-6,5],[6,4,6],[-2,10,4],[9,-9,3.5],[-11,6,3]].forEach(d=>{c.beginPath();c.arc(d[0],d[1],d[2],0,7);c.fill();});}
  if(G&&G.hasOrd&&!sil){c.fillStyle='rgba(0,0,0,0.7)';c.beginPath();c.arc(14,14,7,0,7);c.fill();txt(c,String(it.v+1),14,14.5,10,'#fff');}}
 c.restore();}

// ===== 版面座標 =====
function rowY(k){return 58+k*65;}
function slotX(j){return 52+j*55;}
function fillOf(r){let n=0;for(const s of r.slots)if(s&&!s.stray)n++;return n;}
function clutter(){let n=0;for(const i of G.items)n+=i.kind==='crate'?3:1;return n;}
function comboWin(){return SK.has('combo_hold')?SK.val('combo_hold'):3;}
function mult(){return Math.min(4,1+0.25*(Math.max(1,G.combo)-1));}
function inflowEvery(){let e=G.sh.inflow[0].every;for(const s of G.sh.inflow)if(G.t>=s.t)e=s.every;return e;}
// 投放區判定
function zoneAt(x,y){
 if(y>=56&&y<322){const k=Math.floor((y-56)/65);return k<G.rows.length?{t:'row',k}:null;}
 if(y>=326&&y<394){if(x<244)return {t:'buf'};if(x<296)return G.sh.wash?{t:'wash'}:null;if(x<348)return {t:'trash'};return {t:'chest'};}
 if(y>=394)return {t:'floor'};return null;}
function zoneCenter(z){if(z.t==='row'){const r=G.rows[z.k];const j=Math.max(0,r.slots.indexOf(null));return {x:slotX(j)+26,y:rowY(z.k)+28};}
 if(z.t==='buf')return {x:6+Math.min(4,G.buffer.length)*47+22,y:360};if(z.t==='wash')return {x:270,y:360};if(z.t==='trash')return {x:322,y:360};if(z.t==='chest')return {x:373,y:360};return {x:200,y:500};}

// ===== shelves：規則判定、上架、出貨 =====
function canAccept(r,it){
 if(G.t<r.open)return {ok:false,why:'還沒開門'};
 if(r.shipT>=0)return {ok:false,why:'出貨中'};
 if(it.kind==='crate')return {ok:false,why:'箱子要先點開'};
 if(it.kind==='tr')return {ok:false,why:'珍品放寶物箱'};
 if(it.dusty)return {ok:false,why:'沾灰了，先過水盆'};
 if(it.cat!==r.cat)return {ok:false,why:'類別不符'};
 const sl=r.slots;
 if(r.rule==='ordered'){if(it.v>=r.n)return {ok:false,why:'沒有 '+(it.v+1)+' 號格'};if(sl[it.v])return {ok:false,why:(it.v+1)+' 號格已有東西'};return {ok:true,slot:it.v};}
 if(r.rule==='distinct'&&sl.some(s=>s&&!s.stray&&s.it.v===it.v))return {ok:false,why:'已有同色'};
 const j=sl.indexOf(null);if(j<0)return {ok:false,why:'整排已滿'};return {ok:true,slot:j};}
function place(k,j,it,fx,fy){const r=G.rows[k];r.slots[j]={it,stray:false};it.held=false;it.fly=-1;
 if(fx!=null)it.ret={x:fx,y:fy,at:NOW};it.sqAt=NOW;
 G.combo=(G.combo>0&&G.t-G.lastPlace<=comboWin())?G.combo+1:1;G.lastPlace=G.t;
 const pts=Math.round(10*mult());G.score+=pts;G.placed++;
 const fl=fillOf(r);AU.click(fl-1+Math.min(4,Math.floor((G.combo-1)/4)));
 const x=slotX(j)+26,y=rowY(k)+28;FX.burst(x,y,hueOf(it),10,90);FX.text('+'+pts,x,y-22,'#fff6b0',14,0.8);
 if(G.combo>=2){G.comboAt=NOW;if(G.combo%5===0)FX.text(G.combo+' 連擊！',200,y,'#ffcf3b',20);}
 if(fl===r.n)ship(k);}
function ship(k){const r=G.rows[k];r.shipT=0;const bonus=Math.round(60*r.n*(G.combo>=2?1.5:1));G.score+=bonus;G.shipped++;G.trash=0;
 FX.text('出貨！ +'+bonus,224,rowY(k)+28,'#ffe066',22,1.3);AU.chord();FX.shake(0.12);
 for(let j=0;j<r.n;j++)FX.burst(slotX(j)+26,rowY(k)+28,hueOf(r.slots[j].it),8,140);
 if(G.sh.skAt.indexOf(G.shipped)>=0&&G.shipped<G.sh.goal)G.pendingPick=true;}
function finishShip(k){const r=G.rows[k];r.shipT=-1;r.slots=new Array(r.n).fill(null);
 if(G.sh.rotate&&G.sh.cats.length>1){const shown=G.rows.map(q=>q.cat);let cand=G.sh.cats.filter(c=>shown.indexOf(c)<0);if(!cand.length)cand=G.sh.cats.filter(c=>c!==r.cat);
  if(cand.length){const pool=G.items.concat(G.buffer);const cnt=c=>pool.filter(i=>i.cat===c).length;let mx=-1;cand.forEach(c=>{mx=Math.max(mx,cnt(c));});
   r.cat=pick(cand.filter(c=>cnt(c)===mx));r.flipT=0.4;AU.tone(700,0.08,'square',0.06,900);}}
 if(G.rows.some(q=>q.shipT>=0))return;
 if(G.shipped>=G.sh.goal){F.over('win');return;}
 if(G.pendingPick){G.pendingPick=false;openPick();}}
function rowsTick(dt){G.rows.forEach((r,k)=>{
 if(!r.opened&&G.t>=r.open){r.opened=true;if(k>0){AU.tone(392,0.2,'triangle',0.14,587);FX.text('新貨架開門！',224,rowY(k)+28,'#bdf',16);}}
 if(r.shake>0)r.shake-=dt;if(r.flipT>0)r.flipT-=dt;
 r.oneT=(r.opened&&r.shipT<0&&fillOf(r)===r.n-1&&r.slots.indexOf(null)>=0)?r.oneT+dt:0;
 if(r.shipT>=0){r.shipT+=dt;if(r.shipT>=0.95)finishShip(k);}});}

// ===== floor：地面物品 =====
function floorAdd(it,fx,fy,tx,ty){it.held=false;it.fx0=fx;it.fy0=fy;it.x=fx;it.y=fy;it.tx=tx!=null?clamp(tx,26,374):26+R()*348;it.ty=ty!=null?clamp(ty,430,576):432+R()*144;it.fly=0;G.items.push(it);}
function removeFloor(it){const i=G.items.indexOf(it);if(i>=0)G.items.splice(i,1);}
function floorTick(dt){
 for(const it of G.items){if(it.fly>=0){it.fly+=dt/0.45;if(it.fly>=1){it.fly=-1;it.x=it.tx;it.y=it.ty;it.sqAt=NOW;AU.thud();}
  else{const p=it.fly;it.x=lerp(it.fx0,it.tx,p);it.y=lerp(it.fy0,it.ty,p)-Math.sin(p*Math.PI)*55;}}}
 const a=G.items.filter(i=>i.fly<0&&!i.held);
 for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){const p=a[i],q=a[j],rq=(p.kind==='crate'||q.kind==='crate')?48:40;let dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);
  if(d<rq){if(d<0.01){dx=R()-0.5;dy=R()-0.5;d=Math.hypot(dx,dy);}const push=(rq-d)/2*Math.min(1,dt*10);dx/=d;dy/=d;p.x-=dx*push;p.y-=dy*push;q.x+=dx*push;q.y+=dy*push;}}
 for(const it of a){it.x=clamp(it.x,26,374);it.y=clamp(it.y,430,576);}}

// ===== spawner：生成貨品 =====
// 目前缺什麼（扣掉地上已有的）
function needs(only){const have=G.items.concat(G.buffer);if(G.preview)have.push(G.preview);if(G.wash)have.push(G.wash.it);const out=[];
 G.rows.forEach((r,k)=>{if(only!=null&&only!==k)return;if(G.t<r.open-6||r.shipT>=0)return;
  const cov=have.filter(i=>i.kind==='g'&&i.cat===r.cat),empty=r.slots.filter(s=>!s).length;if(!empty)return;
  if(r.rule==='any'){if(cov.length<empty)out.push({cat:r.cat,v:-1});return;}
  let covN=0;const miss=[];
  for(let v=0;v<5;v++){if(r.rule==='ordered'&&(v>=r.n||r.slots[v]))continue;if(r.rule==='distinct'&&r.slots.some(s=>s&&!s.stray&&s.it.v===v))continue;
   if(cov.some(i=>i.v===v)){covN++;continue;}miss.push(v);}
  if(covN<empty)miss.forEach(v=>out.push({cat:r.cat,v}));});
 return out;}
function forcedNeed(){for(let k=0;k<G.rows.length;k++){const r=G.rows[k];if(r.oneT>20){r.oneT=0;const ns=needs(k);if(ns.length)return pick(ns);}}return null;}
function pickTreasure(){const pool=C.get('treasures').filter(t=>t.min<=G.si+1);if(!pool.length)return null;let sum=0;for(const t of pool)sum+=t.weight;
 let x=R()*sum;for(const t of pool){x-=t.weight;if(x<=0)return t;}return pool[pool.length-1];}
function genItem(sp){const it={id:++G.nid,kind:'g',cat:null,v:0,dusty:false,hits:0,fly:-1,held:false,x:0,y:0};
 if(sp&&G.queue.length){G.queue.shift();it.kind='crate';return it;}
 if(sp&&R()<G.sh.tc){const tr=pickTreasure();if(tr){it.kind='tr';it.tr=tr;return it;}}
 let need=sp?forcedNeed():null;
 if(!need&&SK.has('row_hint')&&R()<0.9){const th=SK.val('row_hint');for(let k=0;k<G.rows.length&&!need;k++){const r=G.rows[k];
  if(r.shipT<0&&G.t>=r.open&&fillOf(r)/r.n>=th){const ns=needs(k);if(ns.length)need=pick(ns);}}}
 if(!need&&R()<G.sh.hr){const ns=needs();if(ns.length)need=pick(ns);}
 if(need){it.cat=need.cat;it.v=need.v>=0?need.v:Math.floor(R()*5);}
 else{it.cat=R()<0.75?pick(G.rows).cat:pick(G.sh.cats);it.v=Math.floor(R()*5);}
 if(sp&&G.dust>0&&R()<G.dust)it.dusty=true;return it;}
function spTick(dt){const m=SK.has('slow_chute')?SK.val('slow_chute'):1;G.spT-=dt*m;
 if(!G.preview&&G.spT<=0.6){G.preview=genItem(true);AU.tone(880,0.06,'sine',0.05);}
 if(G.spT<=0){const it=G.preview||genItem(true);G.preview=null;floorAdd(it,373,406);G.spT+=inflowEvery();
  if(it.kind==='tr'){FX.text('珍品！拖進寶物箱',300,440,'#ffd84a',14);AU.ding();}else if(it.kind==='crate')FX.text('混裝箱',330,440,'#e0b070',14);}}

// ===== hazards：沾灰、混裝箱、陣風 =====
function banner(s,s2){G.banner={s,s2,t:2.4};AU.tone(300,0.3,'sawtooth',0.06,450);}
function hzTick(){for(const e of G.ev){if(G.t<e.t)continue;
 if(e.kind==='dust'){if(!e.on){e.on=true;G.dust=Math.max(G.dust,e.ratio);banner('灰塵捲進來了！','沾灰的貨先放水盆洗乾淨');}}
 else if(G.t>=e.next){e.next+=e.every;if(e.kind==='crate'){G.queue.push(1);if(!e.on){e.on=true;banner('混裝箱來了！','點兩下拆開，一次噴出 3 件');}}else gust(e);}}}
function gust(e){if(!e.on){e.on=true;banner('陣風！','吹上錯架的貨（紅叉）要拖下來');}
 AU.whoosh();G.windT=1;
 const cand=G.items.filter(i=>i.kind==='g'&&!i.held&&i.fly<0),slots=[];
 G.rows.forEach((r,k)=>{if(G.t>=r.open&&r.shipT<0)r.slots.forEach((s,j)=>{if(!s)slots.push([k,j]);});});
 if(!cand.length||!slots.length)return;
 const it=pick(cand),bad=slots.filter(p=>it.dusty||it.cat!==G.rows[p[0]].cat),p=pick(bad.length?bad:slots);
 removeFloor(it);it.ret={x:it.x,y:it.y,at:NOW};it.sqAt=NOW;G.rows[p[0]].slots[p[1]]={it,stray:true};
 FX.burst(slotX(p[1])+26,rowY(p[0])+28,0,12,120);FX.text('吹上錯架！',slotX(p[1])+26,rowY(p[0])+10,'#ff8080',14);}
function tapCrate(it){it.hits++;it.sqAt=NOW;AU.crack();FX.burst(it.x,it.y,30,8,90);FX.shake(0.06);
 if(it.hits>=(SK.has('crate_pop')?1:2)){removeFloor(it);AU.tone(300,0.15,'square',0.1,700);FX.burst(it.x,it.y,35,24,200);FX.text('拆開！',it.x,it.y-30,'#ffd27a',16);
  for(let i=0;i<3;i++){const g=genItem(false);floorAdd(g,it.x,it.y,it.x+(i-1)*46,it.y+R()*30-15);}}
 else FX.text('再點一下',it.x,it.y-30,'#ffd27a',13,0.7);}

// ===== skills：爪技 =====
const SK={
 has(e){return !!G&&G.owned.some(o=>o.effect===e&&(o.duration===0||o.left>0));},
 val(e){let v=null;for(const o of G.owned){if(o.effect!==e||(o.duration>0&&o.left<=0))continue;
  if(v===null)v=o.value;else if(e==='buffer_plus')v+=o.value;else if(['slow_chute','quick_wash','magnet','row_hint'].indexOf(e)>=0)v=Math.min(v,o.value);else v=Math.max(v,o.value);}return v;},
 tick(dt){let gone=false;for(const o of G.owned)if(o.duration>0&&o.left>0){o.left-=dt;if(o.left<=0){gone=true;FX.text(o.name+' 結束',200,300,'#bbb',14);}}

 rr(c,130,558,140,32,10);c.fillStyle='#3a2d52';c.fill();txt(c,'← 返回',200,574,14,'#fff');btns.push({x:130,y:558,w:140,h:32,f:()=>{F.state='title';}});}
function draw(){const c=ctx;c.setTransform(SCALE,0,0,SCALE,0,0);btns=[];c.clearRect(0,0,W,H);
 if(F.state==='title'){drawTitle(c);return;}
 if(F.state==='codex'||!G){drawCodex(c);return;}
 c.save();if(FX.shakeT>0){const s=Math.min(1,FX.shakeT*4)*8;c.translate((R()-0.5)*s,(R()-0.5)*s);}
 drawBG(c);drawRows(c);drawServices(c);drawFloor(c);drawWind(c);drawDrag(c);drawHUD(c);drawBanner(c);c.restore();
 if(F.state==='pick')drawPick(c);if(F.state==='over')drawOver(c);FX.draw(c);}

// ===== 縮放與主迴圈 =====
function resize(){const s=Math.min(window.innerWidth/W,window.innerHeight/H),dpr=Math.min(3,window.devicePixelRatio||1);
 cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';cv.width=Math.max(1,Math.round(W*s*dpr));cv.height=Math.max(1,Math.round(H*s*dpr));SCALE=s*dpr;}
window.addEventListener('resize',resize);window.addEventListener('orientationchange',resize);
const STEP=1/60;let last=performance.now(),acc=0,errShown=false;
function frame(ts){let d=(ts-last)/1000;last=ts;if(!(d>0))d=0;if(d>0.25)d=0.25;acc+=d;NOW+=d;
 try{let n=0;while(acc>=STEP&&n<8){update(STEP);acc-=STEP;n++;}if(n>=8)acc=0;draw();}
 catch(err){if(!errShown){errShown=true;console.warn('[喵掌上架王] 執行例外',err);}}
 requestAnimationFrame(frame);}

// ===== 品管掛鉤 =====
window.SC_HOOKS={
 start(i){return F.start(i==null?0:i);},
 snapshot(){return {scene:F.state,score:G?G.score:0,level:G?G.si+1:0,elapsed:G?Math.round(G.t*100)/100:0,shipped:G?G.shipped:0,goal:G?G.sh.goal:0,
  clutter:G?clutter():0,cap:G?G.sh.cap:0,combo:G?G.combo:0,floorItems:G?G.items.length:0,buffer:G?G.buffer.length:0,
  skills:G?G.owned.map(o=>o.effect):[],contentOk:C.ok,result:F.res?{win:F.res.win,score:F.res.score,stars:F.res.stars,isNew:F.res.isNew}:null};}
};

C.load();S.load();AU.muted=!!S.d.mute;
F.sel=Math.max(0,Math.min(S.d.unlocked,C.get('shifts').length)-1);F.page=Math.floor(F.sel/12);
resize();requestAnimationFrame(frame);
})();
