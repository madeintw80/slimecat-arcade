<!--CONTENT-NOTES
《喵沙橫流》引擎內容規格：window.SC_CONTENT = { shapes, stages, cats, trials }，每包為物件陣列，筆數不限（5 筆或 30 筆皆可）。
共通：缺包／空包、重複 id、enum 未知值、trials.shape_ids 引用不存在的形狀 → console.error 並阻擋開始（標題頁顯示錯誤）。
      其餘數值超出範圍一律 clamp，缺欄位套預設值。
砂場 60 欄 × 88 行（行數由底往上數），顏色依序：1 粉、2 青、3 黃、4 紫；灰砂為獨立灰色。

[shapes] 砂塊
  id 字串唯一（建議 sh_ 開頭）｜name 顯示名｜flavor 一句註解（目前只保存）
  cells [[col,row],…] 1~5 格，座標 0~3（超出 clamp、重複格去除、第 6 格起忽略），請保持相連
  grain 6~10（預設 8）：每格 grain×grain 粒；cells×grain² > 400 時引擎自動降 grain。建議總粒數 100~320
  tier 1~4（預設 1）：stage.max_tier ≥ tier 才抽得到；若無可用形狀退回最低 tier
  每個階段最多新增 2 型：同時解鎖超過 2 型時，依 tier→陣列順序順延到後續階段
  weight 0.05~10（預設 1）抽牌權重｜rotations 1/2/4（其他值就近取，缺省＝1）
  生成時用 cells 原始方向（生成點被擋才改用最扁方向）→ 長條請橫著寫

[stages] 階段（依 start_sec 排序，第一筆強制 0 秒；階段數＝陣列長度）
  id｜name（進階段大字橫幅）｜start_sec 0~3600
  colors 2~4｜fall_rps 8~120 行/秒（34 ≈ 2.6 秒落到底）｜max_tier 1~4
  dirt_chance／bicolor_chance／clump_chance 0~1：每塊機率，各至多改一格（場上結塊最多 2 個）
  wind_every_sec 0（關）或 5~120 側風週期；wind_sec 0~10 每次吹幾秒（週期>0 且秒數 0 → 4 秒）；提前 2 秒預告
  ear_row 24~78：耳線（由底往上數）；靜止砂高過耳線 0.5 秒＝翻倒。改變時以每秒 2 行平滑移動
  new_element ∈ "" / rotate / ability / bicolor / dirt / wind / clump / shrink
    rotate：該階前旋轉鎖住；ability：該階前技能鍵鎖住（整包都沒寫 rotate/ability 時開局即開放）
    其他值只觸發一次性教學卡（首次見到暫停 1.2 秒）；實際效果完全由數值欄位決定
  banner：教學卡／橫幅文字（空字串時用引擎內建說明）。進入新階段 +200 分（乘 score_mul）

[cats] 助陣喵（標題頁 4×3 一頁，超過 12 隻自動分頁）
  id｜name｜emoji 一個｜color 主色 hex（翻卡底色）｜desc 標題頁顯示｜flavor
  passive.kind ∈ score_mul(總分×) / charge_mul(充能×) / dirt_rate_mul(灰砂機率×) / fall_mul(落速×) /
                 preview_count(NEXT 多顯示 value 格，value 1~3，預設顯示 2 格) / wind_mul(風力×) /
                 thick_mul(厚流倍率＝1.5×value，最低 1)
     value clamp 0.3~2（建議 0.6~1.4）；value＝1 顯示「無被動」
  active.kind ∈ flatten(搬 power×80 粒：最高處→最低谷) / blow(頂層 power 行砂往最高柱反向吹 2 秒) /
                sweep_dirt(由上而下移除 power×20 粒灰砂) / recolor_next(接下來 power 塊換成最接近貫通的顏色) /
                melt(power 個結塊化為流砂) / slow(power 秒內落速 ×0.5)
     power 1~30｜cost 50~5000 沖走粒數（一條帶約 200~600 粒）｜name 技能名
  unlock.kind ∈ start / grains_total / best_score / best_chain / runs / stage_idx(到達的階段索引，0 起算) / daily_done
     沒有任何 start 時第一隻自動可用

[trials] 每日砂盆（取 trials[一年中第幾天 % 筆數]）
  id｜name｜desc（標題頁顯示）｜duration_sec 0＝無盡；30~1800 限時，時間到即結算
  colors 2~4 覆蓋階段色數｜fall_mul 0.5~2 乘在 fall_rps
  dirt_chance／clump_chance 0~1、wind_every_sec 0~120：有填就覆蓋整局（0＝整局關閉）
  shape_ids 限定形狀 id（空陣列＝全部，仍受 tier 限制；限定後若都超過 tier 則忽略 tier）
  start_stage_sec 0~3600 從階段時間軸第幾秒起跳｜goal_score 100~10000000（結算顯示達標）
  seed_mode date（當日 YYYYMMDD）/ fixed（用 seed）｜seed 整數
-->

let last=performance.now(),acc=0;
function frame(now){

 try{
  if(G.phase==='run'&&R){
   dasUpdate(dt);if(R.dragCol!=null&&!tipBlock())setCol(R.dragCol);
   const ts=FXS.slow>0?0.3:1;FXS.slow=Math.max(0,FXS.slow-dt);
   acc+=dt*ts;let n=0;while(acc>=STEP&&n<14&&G.phase==='run'){tick(STEP);acc-=STEP;n++;}if(n>=14)acc=0;
   auSet(AU.flow,Math.min(0.22,R.moved/2500));R.moved=0;auSet(AU.hum,R.danger*0.09);auSet(AU.wind,R.wind||R.blow?0.18:R.windWarn?0.07:0);
  }else{acc=0;auSet(AU.flow,0);auSet(AU.hum,0);auSet(AU.wind,0);}
  if(G.phase==='over'&&G.sum){G.overT+=dt;while(G.flipN<Math.min(3,G.sum.newCats.length)&&G.overT>0.8+G.flipN*0.35+0.25){G.flipN++;sfx('flip');}}
  fxUpdate(dt);draw();
